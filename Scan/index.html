<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <meta
    name="robots"
    content="noindex,nofollow"
  />

  <title>FarmVista • Opening Scanner</title>

  <script>
    (() => {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const token =
        String(
          params.get("t") || ""
        ).trim();

      const scanPage =
        "/pages/grain/grain-ticket-scan.html";

      if (!token) {

        window.location.replace(
          scanPage
        );

        return;
      }

      window.location.replace(
        `${scanPage}?t=${encodeURIComponent(token)}`
      );

    })();
  </script>
</head>

<body>
  <p>Opening FarmVista scanner…</p>
</body>
</html>
