<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FarmVista • My Pre-Trips</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#3B7E46">

  <link rel="manifest" href="/Farm-vista/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/Farm-vista/assets/icons/apple-touch-icon.png">
  <link rel="icon" href="/Farm-vista/assets/icons/icon-192.png">

  <script src="/Farm-vista/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/Farm-vista/assets/css/theme.css">
  <link rel="stylesheet" href="/Farm-vista/assets/css/app.css">
  <script src="/Farm-vista/js/fv-shell.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--app-bg, var(--bg));
      color: var(--text);
    }

    button,
    input,
    select {
      font: inherit;
    }

    [hidden] {
      display: none !important;
    }

    .page {
      width: min(1000px, 100%);
      margin: 0 auto;
      padding: 14px;
      padding-bottom:
        calc(
          env(safe-area-inset-bottom, 0px)
          + var(--ftr-h, 42px)
          + 32px
        );
    }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      margin: 6px 0 16px;
    }

    .page-header h1 {
      margin: 0 0 5px;
      font-size: clamp(25px, 5vw, 34px);
      line-height: 1.1;
    }

    .page-header p {
      margin: 0;
      color: var(--muted, #68716c);
      line-height: 1.4;
    }

    .header-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
    }

    .button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
      color: var(--text);
      font-weight: 850;
      text-decoration: none;
      cursor: pointer;
    }

    .button-primary,
    .button-primary:visited,
    .button-primary:hover,
    .button-primary:active {
      border-color: transparent;
      background: var(--brand-green, #3B7E46);
      color: #fff !important;
    }

    .button:disabled {
      cursor: wait;
      opacity: 0.58;
    }

    .message {
      display: none;
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      font-weight: 750;
      line-height: 1.4;
    }

    .message.show {
      display: block;
    }

    .message.error {
      border-color: rgba(180, 35, 24, 0.45);
      color: #b42318;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(150px, 190px);
      gap: 10px;
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow, 0 8px 22px rgba(0, 0, 0, 0.06));
    }

    .control {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
      color: var(--text);
      outline: none;
    }

    .control:focus {
      border-color: var(--brand-green, #3B7E46);
      box-shadow: 0 0 0 3px rgba(59, 126, 70, 0.14);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      margin-bottom: 14px;
    }

    .summary-card {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface);
      text-align: center;
    }

    .summary-value {
      font-size: 24px;
      font-weight: 950;
      line-height: 1;
    }

    .summary-label {
      margin-top: 5px;
      color: var(--muted, #68716c);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .records {
      display: grid;
      gap: 10px;
    }

    .record {
      width: 100%;
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      box-shadow: var(--shadow, 0 8px 22px rgba(0, 0, 0, 0.06));
      cursor: pointer;
    }

    .record:hover {
      border-color: rgba(59, 126, 70, 0.45);
    }

    .record-main {
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr) auto;
      gap: 11px;
      align-items: center;
      padding: 14px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: #98a2b3;
    }

    .record.good .status-dot {
      background: #3B7E46;
    }

    .record.defect .status-dot {
      background: #b42318;
    }

    .record-content {
      min-width: 0;
    }

    .record-title {
      font-size: 15px;
      font-weight: 900;
      line-height: 1.25;
    }

    .record-equipment {
      display: block;
      margin-top: 3px;
      color: var(--muted, #68716c);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .record-meta {
      text-align: right;
    }

    .record-result {
      display: block;
      font-size: 12px;
      font-weight: 900;
    }

    .record.defect .record-result {
      color: #b42318;
    }

    .record-time {
      display: block;
      margin-top: 3px;
      color: var(--muted, #68716c);
      font-size: 11px;
      font-weight: 700;
    }

    .empty-state,
    .loading {
      padding: 28px 18px;
      border: 1px dashed var(--border);
      border-radius: 15px;
      background: var(--surface);
      color: var(--muted, #68716c);
      text-align: center;
      line-height: 1.45;
    }

    .empty-title {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 17px;
      font-weight: 900;
    }

    .modal {
      position: fixed;
      z-index: 10000;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        calc(var(--hdr-h, 56px) + 12px)
        12px
        calc(
          var(--ftr-h, 42px)
          + env(safe-area-inset-bottom, 0px)
          + 12px
        );
      background: rgba(15, 23, 42, 0.55);
    }

    .modal-card {
      display: flex;
      width: min(820px, 100%);
      max-height: 100%;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.35);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 15px;
      border-bottom: 1px solid var(--border);
      background:
        linear-gradient(
          90deg,
          rgba(59, 126, 70, 0.12),
          transparent
        );
    }

    .modal-title h2 {
      margin: 0;
      font-size: 20px;
    }

    .modal-subtitle {
      margin-top: 3px;
      color: var(--muted, #68716c);
      font-size: 12px;
      font-weight: 700;
    }

    .modal-actions {
      display: flex;
      gap: 7px;
    }

    .icon-button {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
      color: var(--text);
      font-size: 19px;
      cursor: pointer;
    }

    .modal-body {
      min-height: 0;
      padding: 15px;
      overflow-y: auto;
    }

    .details {
      display: grid;
      gap: 14px;
    }

    .status-banner {
      padding: 10px 12px;
      border: 1px solid rgba(59, 126, 70, 0.3);
      border-radius: 11px;
      background: rgba(59, 126, 70, 0.08);
      color: #2f6c3c;
      font-weight: 900;
    }

    .status-banner.defect {
      border-color: rgba(180, 35, 24, 0.35);
      background: rgba(180, 35, 24, 0.07);
      color: #b42318;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .detail-box {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface-2, rgba(127, 127, 127, 0.05));
    }

    .detail-label {
      color: var(--muted, #68716c);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .detail-value {
      margin-top: 4px;
      overflow-wrap: anywhere;
      font-size: 13px;
      font-weight: 850;
      line-height: 1.35;
    }

    .section-title {
      margin: 0 0 7px;
      padding: 7px 9px;
      border-left: 4px solid var(--brand-green, #3B7E46);
      background: var(--surface-2, rgba(127, 127, 127, 0.05));
      font-size: 14px;
      font-weight: 950;
    }

    .remarks {
      min-height: 54px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .pdf-panel {
  position: relative;
  width: 100%;
  min-height: 65vh;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fff;
}

.pdf-loading {
  position: absolute;
  z-index: 2;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  background: var(--surface);
  color: var(--muted, #68716c);
  font-weight: 850;
}

.pdf-loading[hidden] {
  display: none !important;
}

.pdf-spinner {
  width: 42px;
  height: 42px;
  border: 4px solid rgba(59, 126, 70, 0.18);
  border-top-color: var(--brand-green, #3B7E46);
  border-radius: 50%;
  animation: pdf-spin 0.8s linear infinite;
}

@keyframes pdf-spin {
  to {
    transform: rotate(360deg);
  }
}

.pdf-frame {
  display: block;
  width: 100%;
  height: 72vh;
  min-height: 520px;
  border: 0;
  background: #fff;
}

.pdf-back-button {
  width: 100%;
  margin-bottom: 10px;
}

@media (max-width: 650px) {
  .pdf-frame {
    height: calc(
      100vh
      - var(--hdr-h, 56px)
      - var(--ftr-h, 42px)
      - 150px
    );
    min-height: 420px;
  }

  .pdf-panel {
    min-height: 60vh;
  }
}

    .inspection-block {
  margin-top: 2px;
}

.inspection-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 0 0 7px;
  padding: 7px 9px;
  border-left: 4px solid var(--brand-green, #3B7E46);
  background: var(--surface-2, rgba(127, 127, 127, 0.05));
  font-size: 14px;
  font-weight: 950;
}

.inspection-count {
  color: var(--muted, #68716c);
  font-size: 10px;
  font-weight: 850;
  white-space: nowrap;
}

.inspection-table {
  width: 100%;
  border: 1px solid var(--border);
  border-collapse: collapse;
  table-layout: fixed;
}

.inspection-table col.result-column {
  width: 92px;
}

.inspection-table th,
.inspection-table td {
  padding: 7px 9px;
  border: 1px solid var(--border);
  font-size: 11px;
  line-height: 1.35;
  text-align: left;
  vertical-align: top;
}

.inspection-table th {
  background: var(--surface-2, rgba(127, 127, 127, 0.07));
  font-weight: 950;
}

.inspection-item {
  font-weight: 800;
}

.inspection-result {
  font-weight: 950;
  white-space: nowrap;
}

.inspection-result.pass {
  color: #2f6c3c;
}

.inspection-result.defect {
  color: #b42318;
}

.inspection-result.na {
  color: #667085;
}

.defect-note {
  margin-top: 5px;
  padding: 5px 7px;
  border-left: 3px solid #b42318;
  background: rgba(180, 35, 24, 0.06);
  color: #b42318;
  font-size: 10px;
  font-weight: 700;
  line-height: 1.35;
}

.no-items {
  padding: 12px;
  border: 1px dashed var(--border);
  border-radius: 10px;
  color: var(--muted, #68716c);
  text-align: center;
}

    @media (max-width: 650px) {
      .page-header {
        align-items: stretch;
        flex-direction: column;
      }

      .header-actions {
        width: 100%;
      }

      .header-actions .button {
        flex: 1;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .record-main {
        grid-template-columns: 12px minmax(0, 1fr);
        align-items: start;
      }

      .record-meta {
        grid-column: 2;
        margin-top: 7px;
        text-align: left;
      }

      .modal {
        align-items: stretch;
        padding:
          calc(var(--hdr-h, 56px) + 7px)
          7px
          calc(
            var(--ftr-h, 42px)
            + env(safe-area-inset-bottom, 0px)
            + 7px
          );
      }

      .modal-card {
        width: 100%;
      }

      .modal-header,
      .modal-body {
        padding: 10px;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <fv-shell>
    <main
      class="page"
      data-perm="logistics-pre-trip:view"
    >
      <header class="page-header">
        <div>
          <h1>My Pre-Trips</h1>
          <p>
            View your personal inspections and open a complete PDF report.
          </p>
        </div>

        <div class="header-actions">
          <a
            class="button button-primary"
            href="/Farm-vista/pages/logistics/pre-trip.html"
            data-perm="logistics-pre-trip:add"
          >
            New Pre-Trip
          </a>
        </div>
      </header>

      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite"
      ></div>

      <section
        class="toolbar"
        aria-label="Filter inspections"
      >
        <input
          id="searchInput"
          class="control"
          type="search"
          placeholder="Search truck, trailer, or date"
          autocomplete="off"
        >

        <select
          id="statusFilter"
          class="control"
          aria-label="Filter by result"
        >
          <option value="all">All Results</option>
          <option value="satisfactory">Passed</option>
          <option value="defects">Defects Reported</option>
        </select>
      </section>

      <section
        class="summary"
        aria-label="Inspection summary"
      >
        <div class="summary-card">
          <div id="totalCount" class="summary-value">–</div>
          <div class="summary-label">Total</div>
        </div>

        <div class="summary-card">
          <div id="passedCount" class="summary-value">–</div>
          <div class="summary-label">Passed</div>
        </div>

        <div class="summary-card">
          <div id="defectCount" class="summary-value">–</div>
          <div class="summary-label">Defects</div>
        </div>
      </section>

      <div id="records" class="records">
        <div class="loading">
          Loading your pre-trip records…
        </div>
      </div>
    </main>
  </fv-shell>

  <div
    id="detailModal"
    class="modal"
    hidden
  >
    <article
      class="modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="detailTitle"
    >
      <header class="modal-header">
        <div class="modal-title">
          <h2 id="detailTitle">
            Pre-Trip Inspection
          </h2>

          <div
            id="detailSubtitle"
            class="modal-subtitle"
          ></div>
        </div>

        <div class="modal-actions">
          <button
            id="pdfButton"
            class="icon-button"
            type="button"
            title="Open PDF report"
            aria-label="Open PDF report"
          >
            📄
          </button>

          <button
            id="closeButton"
            class="icon-button"
            type="button"
            title="Close"
            aria-label="Close report"
          >
            ×
          </button>
        </div>
      </header>

<div class="modal-body">
  <div
    id="detailContent"
    class="details"
  ></div>

  <section
    id="pdfPanel"
    hidden
  >
    <button
      id="pdfBackButton"
      class="button pdf-back-button"
      type="button"
    >
      ← Back to Inspection Summary
    </button>

    <div class="pdf-panel">
      <div
        id="pdfLoading"
        class="pdf-loading"
      >
        <div
          class="pdf-spinner"
          aria-hidden="true"
        ></div>

        <div>
          Building PDF report…
        </div>
      </div>

      <iframe
        id="pdfFrame"
        class="pdf-frame"
        title="Pre-Trip PDF Report"
      ></iframe>
    </div>
  </section>
</div>
    </article>
  </div>

  <script type="module">
    import {
      ready,
      getAuth,
      getFirestore,
      collection,
      getDocs
    } from "/Farm-vista/js/firebase-init.js";

    await ready;

    const COLLECTION = "logisticsInspections";

    /*
     * IMPORTANT:
     * Replace this with the HTTPS URL shown after the Google
     * function finishes deploying.
     */
    const PDF_FUNCTION_URL =
       "https://generate-pre-trip-pdf-300398089669.us-central1.run.app";

    const auth = getAuth();
    const db = getFirestore();

    const state = {
      user: null,
      rows: [],
      filteredRows: [],
      selectedId: null,
      currentPdfUrl: ""
    };

    const elements = {
      message: document.getElementById("message"),
      searchInput: document.getElementById("searchInput"),
      statusFilter: document.getElementById("statusFilter"),
      totalCount: document.getElementById("totalCount"),
      passedCount: document.getElementById("passedCount"),
      defectCount: document.getElementById("defectCount"),
      records: document.getElementById("records"),
      modal: document.getElementById("detailModal"),
      detailSubtitle: document.getElementById("detailSubtitle"),
      detailContent: document.getElementById("detailContent"),
pdfButton: document.getElementById("pdfButton"),
closeButton: document.getElementById("closeButton"),

detailContent:
  document.getElementById("detailContent"),

pdfPanel:
  document.getElementById("pdfPanel"),

pdfLoading:
  document.getElementById("pdfLoading"),

pdfFrame:
  document.getElementById("pdfFrame"),

pdfBackButton:
  document.getElementById("pdfBackButton")
    };

    function clean(value) {
      return String(value ?? "").trim();
    }

    function normalized(value) {
      return clean(value).toLowerCase();
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(
        /[&<>"']/g,
        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[character]
      );
    }

    function toDate(value) {
      if (!value) return null;
      if (value instanceof Date) return value;
      if (typeof value.toDate === "function") return value.toDate();

      if (typeof value.seconds === "number") {
        return new Date(value.seconds * 1000);
      }

      const parsed = new Date(value);

      return Number.isNaN(parsed.getTime())
        ? null
        : parsed;
    }

    function formatDate(value) {
      const raw = clean(value);

      if (!raw) {
        return "Date not listed";
      }

      const parts = raw.slice(0, 10).split("-");

      if (parts.length === 3) {
        const date = new Date(
          Number(parts[0]),
          Number(parts[1]) - 1,
          Number(parts[2])
        );

        return new Intl.DateTimeFormat(
          "en-US",
          {
            weekday: "short",
            month: "short",
            day: "numeric",
            year: "numeric"
          }
        ).format(date);
      }

      return raw;
    }

    function formatDateTime(value) {
      const date = toDate(value);

      if (!date) {
        return "Time not listed";
      }

      return new Intl.DateTimeFormat(
        "en-US",
        {
          month: "short",
          day: "numeric",
          year: "numeric",
          hour: "numeric",
          minute: "2-digit"
        }
      ).format(date);
    }

    function formatNumber(value) {
      const number = Number(value);

      return Number.isFinite(number)
        ? number.toLocaleString()
        : "Not listed";
    }

    function defectCount(row) {
      const direct = Number(row.defectCount);

      if (Number.isFinite(direct)) {
        return direct;
      }

      return Array.isArray(row.responses)
        ? row.responses.filter(
            response =>
              normalized(response.status) === "defect"
          ).length
        : 0;
    }

    function hasDefects(row) {
      return (
        row.hasDefects === true ||
        defectCount(row) > 0 ||
        normalized(row.overallStatus) === "defectsreported"
      );
    }

    function truckLabel(row) {
      return clean(
        row.truckLabel ||
        row.truck?.label ||
        row.truckUnitId ||
        row.truck?.unitId ||
        "Truck not listed"
      );
    }

    function trailerLabel(row) {
      if (
        row.trailerHookedOn === false ||
        (
          !row.trailerId &&
          !row.trailerLabel &&
          !row.trailer
        )
      ) {
        return "No Trailer Hooked On";
      }

      return clean(
        row.trailerLabel ||
        row.trailer?.label ||
        row.trailerUnitId ||
        row.trailer?.unitId ||
        "Trailer not listed"
      );
    }

    function statusLabel(status) {
  const value = normalized(status);

  if (value === "pass") {
    return "Good";
  }

  if (value === "defect") {
    return "Defect";
  }

  if (value === "na") {
    return "N/A";
  }

  return clean(status) || "Not answered";
}

function sectionKey(response) {
  const section =
    normalized(response?.section);

  return section.includes("trailer")
    ? "trailer"
    : "truck";
}

function inspectionResponses(
  row,
  section
) {
  const responses =
    Array.isArray(row.responses)
      ? row.responses
      : [];

  return responses.filter(
    response =>
      sectionKey(response) === section
  );
}

function renderInspectionTable(
  responses
) {
  if (!responses.length) {
    return `
      <div class="no-items">
        No inspection items were saved for this section.
      </div>
    `;
  }

  return `
    <table class="inspection-table">
      <colgroup>
        <col>
        <col class="result-column">
      </colgroup>

      <thead>
        <tr>
          <th>Inspection Item</th>
          <th>Result</th>
        </tr>
      </thead>

      <tbody>
        ${responses.map(response => {
          const status =
            normalized(response.status);

          return `
            <tr>
              <td>
                <div class="inspection-item">
                  ${escapeHtml(
                    response.label ||
                    response.itemId ||
                    "Inspection item"
                  )}
                </div>

                ${
                  status === "defect" &&
                  response.note
                    ? `
                      <div class="defect-note">
                        ${escapeHtml(
                          response.note
                        )}
                      </div>
                    `
                    : ""
                }
              </td>

              <td>
                <span
                  class="inspection-result ${escapeHtml(status)}"
                >
                  ${escapeHtml(
                    statusLabel(
                      response.status
                    )
                  )}
                </span>
              </td>
            </tr>
          `;
        }).join("")}
      </tbody>
    </table>
  `;
}

    function ownsInspection(row, user) {
      if (!row || !user) return false;

      const rowUid = clean(
        row.driverUid ||
        row.submittedByUid ||
        row.userUid
      );

      if (rowUid) {
        return rowUid === clean(user.uid);
      }

      const rowEmail = normalized(
        row.driverEmail ||
        row.submittedByEmail ||
        row.userEmail
      );

      return Boolean(
        rowEmail &&
        rowEmail === normalized(user.email)
      );
    }

    function showMessage(text, type = "") {
      elements.message.textContent = text;
      elements.message.className =
        `message show ${type}`;
    }

    function clearMessage() {
      elements.message.textContent = "";
      elements.message.className = "message";
    }

    async function waitForUser() {
      for (let attempt = 0; attempt < 40; attempt += 1) {
        const user = auth.currentUser;

        if (user) {
          return user;
        }

        await new Promise(resolve =>
          setTimeout(resolve, 250)
        );
      }

      return null;
    }

    function sortRows(rows) {
      return rows.slice().sort((a, b) => {
        const aTime =
          toDate(
            a.submittedAt ||
            a.createdAt ||
            a.updatedAt
          )?.getTime() || 0;

        const bTime =
          toDate(
            b.submittedAt ||
            b.createdAt ||
            b.updatedAt
          )?.getTime() || 0;

        return bTime - aTime;
      });
    }

    function updateSummary() {
      const total = state.rows.length;
      const defects =
        state.rows.filter(hasDefects).length;

      elements.totalCount.textContent =
        String(total);

      elements.passedCount.textContent =
        String(total - defects);

      elements.defectCount.textContent =
        String(defects);
    }

    function applyFilters() {
      const search =
        normalized(elements.searchInput.value);

      const status =
        elements.statusFilter.value;

      state.filteredRows =
        state.rows.filter(row => {
          if (
            status === "satisfactory" &&
            hasDefects(row)
          ) {
            return false;
          }

          if (
            status === "defects" &&
            !hasDefects(row)
          ) {
            return false;
          }

          if (!search) {
            return true;
          }

          return normalized([
            row.inspectionDate,
            formatDate(row.inspectionDate),
            truckLabel(row),
            trailerLabel(row),
            row.odometerMiles,
            row.remarks
          ].join(" ")).includes(search);
        });

      renderRecords();
    }

    function renderRecords() {
      if (!state.filteredRows.length) {
        elements.records.innerHTML = `
          <div class="empty-state">
            <span class="empty-title">
              ${
                state.rows.length
                  ? "No matching pre-trips"
                  : "No pre-trips found"
              }
            </span>

            ${
              state.rows.length
                ? "Try changing the search or result filter."
                : "Your submitted inspections will appear here."
            }
          </div>
        `;

        return;
      }

      elements.records.innerHTML =
        state.filteredRows.map(row => {
          const defective = hasDefects(row);
          const defects = defectCount(row);

          return `
            <button
              class="record ${
                defective ? "defect" : "good"
              }"
              type="button"
              data-inspection-id="${escapeHtml(row.id)}"
            >
              <span class="record-main">
                <span
                  class="status-dot"
                  aria-hidden="true"
                ></span>

                <span class="record-content">
                  <span class="record-title">
                    ${escapeHtml(
                      formatDate(row.inspectionDate)
                    )}
                  </span>

                  <span class="record-equipment">
                    ${escapeHtml(
                      `${truckLabel(row)} • ${trailerLabel(row)}`
                    )}
                  </span>
                </span>

                <span class="record-meta">
                  <span class="record-result">
                    ${
                      defective
                        ? `${defects} defect${
                            defects === 1 ? "" : "s"
                          }`
                        : "Passed"
                    }
                  </span>

                  <span class="record-time">
                    ${escapeHtml(
                      formatDateTime(
                        row.submittedAt ||
                        row.createdAt
                      )
                    )}
                  </span>
                </span>
              </span>
            </button>
          `;
        }).join("");
    }

function renderDetails(row) {
  const defective =
    hasDefects(row);

  const defects =
    defectCount(row);

  const truckResponses =
    inspectionResponses(
      row,
      "truck"
    );

  const trailerResponses =
    inspectionResponses(
      row,
      "trailer"
    );

  elements.detailSubtitle.textContent =
    `${formatDate(
      row.inspectionDate
    )} • ${truckLabel(row)}`;

  elements.detailContent.innerHTML = `
    <div
      class="status-banner ${
        defective ? "defect" : ""
      }"
    >
      ${
        defective
          ? `${defects} defect${
              defects === 1
                ? ""
                : "s"
            } reported`
          : "Inspection passed"
      }
    </div>

    <section class="detail-grid">
      <div class="detail-box">
        <div class="detail-label">
          Driver
        </div>

        <div class="detail-value">
          ${escapeHtml(
            row.driverName ||
            state.user?.displayName ||
            state.user?.email ||
            "FarmVista User"
          )}
        </div>
      </div>

      <div class="detail-box">
        <div class="detail-label">
          Inspection Date
        </div>

        <div class="detail-value">
          ${escapeHtml(
            formatDate(
              row.inspectionDate
            )
          )}
        </div>
      </div>

      <div class="detail-box">
        <div class="detail-label">
          Truck / Semi
        </div>

        <div class="detail-value">
          ${escapeHtml(
            truckLabel(row)
          )}
        </div>
      </div>

      <div class="detail-box">
        <div class="detail-label">
          Trailer
        </div>

        <div class="detail-value">
          ${escapeHtml(
            trailerLabel(row)
          )}
        </div>
      </div>

      <div class="detail-box">
        <div class="detail-label">
          Odometer
        </div>

        <div class="detail-value">
          ${escapeHtml(
            formatNumber(
              row.odometerMiles
            )
          )} miles
        </div>
      </div>

      <div class="detail-box">
        <div class="detail-label">
          Submitted
        </div>

        <div class="detail-value">
          ${escapeHtml(
            formatDateTime(
              row.submittedAt ||
              row.createdAt
            )
          )}
        </div>
      </div>
    </section>

    <section class="inspection-block">
      <h3 class="inspection-heading">
        <span>
          Truck / Semi Inspection
        </span>

        <span class="inspection-count">
          ${truckResponses.length} items
        </span>
      </h3>

      ${renderInspectionTable(
        truckResponses
      )}
    </section>

    ${
      row.trailerHookedOn !== false
        ? `
          <section class="inspection-block">
            <h3 class="inspection-heading">
              <span>
                Trailer Inspection
              </span>

              <span class="inspection-count">
                ${trailerResponses.length} items
              </span>
            </h3>

            ${renderInspectionTable(
              trailerResponses
            )}
          </section>
        `
        : ""
    }

    <section>
      <h3 class="section-title">
        Driver Remarks
      </h3>

      <div class="remarks">
        ${escapeHtml(
          row.remarks ||
          "No additional remarks."
        )}
      </div>
    </section>

    <button
      id="openPdfButton"
      class="button button-primary"
      type="button"
    >
      Open Complete PDF Report
    </button>
  `;

  document
    .getElementById(
      "openPdfButton"
    )
    .addEventListener(
      "click",
      generatePdf
    );
}

    function openReport(id) {
      const row =
        state.rows.find(item => item.id === id);

      if (!row || !ownsInspection(row, state.user)) {
        showMessage(
          "That inspection could not be opened.",
          "error"
        );
        return;
      }

      state.selectedId = id;
      renderDetails(row);

      elements.modal.hidden = false;
      document.body.style.overflow = "hidden";

      const url = new URL(window.location.href);
      url.searchParams.set("id", id);

      history.replaceState(
        {},
        "",
        url.pathname + url.search
      );
    }

function closeReport() {
  elements.modal.hidden = true;
  document.body.style.overflow = "";
  state.selectedId = null;

  // Hide the PDF viewer
  elements.pdfPanel.hidden = true;

  // Show the inspection summary again
  elements.detailContent.hidden = false;

  // Clear the iframe
  elements.pdfFrame.removeAttribute("src");

  // Show the loading spinner next time
  elements.pdfLoading.hidden = false;

  // Clean up the temporary PDF URL
  if (state.currentPdfUrl) {
    URL.revokeObjectURL(state.currentPdfUrl);
    state.currentPdfUrl = "";
  }

  const url = new URL(window.location.href);
  url.searchParams.delete("id");

  history.replaceState(
    {},
    "",
    url.pathname + url.search
  );
}

async function generatePdf() {
  if (!state.selectedId || !state.user) {
    return;
  }

  clearMessage();

  elements.pdfButton.disabled = true;

  const detailButton =
    document.getElementById("openPdfButton");

  if (detailButton) {
    detailButton.disabled = true;
    detailButton.textContent = "Building PDF…";
  }

  /*
   * Keep the FarmVista popup open.
   * Hide the inspection summary and show the PDF viewer.
   */
  elements.detailContent.hidden = true;
  elements.pdfPanel.hidden = false;
  elements.pdfLoading.hidden = false;

  elements.pdfFrame.removeAttribute("src");

  try {
    const token =
      await state.user.getIdToken();

    const response = await fetch(
      "https://generate-pre-trip-pdf-300398089669.us-central1.run.app",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },

        body: JSON.stringify({
          inspectionId: state.selectedId
        })
      }
    );

    if (!response.ok) {
      let message =
        "FarmVista could not generate the PDF.";

      try {
        const errorBody =
          await response.json();

        if (errorBody?.message) {
          message = errorBody.message;
        }
      } catch {}

      throw new Error(message);
    }

    const pdfBlob =
      await response.blob();

    if (
      pdfBlob.type &&
      pdfBlob.type !== "application/pdf"
    ) {
      throw new Error(
        "The function did not return a PDF."
      );
    }

    if (state.currentPdfUrl) {
      URL.revokeObjectURL(
        state.currentPdfUrl
      );
    }

    state.currentPdfUrl =
      URL.createObjectURL(pdfBlob);

    elements.pdfFrame.onload = () => {
      elements.pdfLoading.hidden = true;
    };

    elements.pdfFrame.src =
      state.currentPdfUrl;
  } catch (error) {
    console.error(
      "[My Pre-Trips] PDF failed:",
      error
    );

    elements.pdfPanel.hidden = true;
    elements.detailContent.hidden = false;
    elements.pdfLoading.hidden = false;

    showMessage(
      error.message ||
      "FarmVista could not generate the PDF.",
      "error"
    );
  } finally {
    elements.pdfButton.disabled = false;

    if (detailButton) {
      detailButton.disabled = false;
      detailButton.textContent =
        "Open Complete PDF Report";
    }
  }
}

    async function loadRecords() {
      clearMessage();

      state.user =
        await waitForUser();

      if (!state.user) {
        showMessage(
          "Your account could not be loaded. Sign in again.",
          "error"
        );
        return;
      }

      try {
        const snapshot =
          await getDocs(
            collection(db, COLLECTION)
          );

        const allRows =
          snapshot.docs.map(docSnap => ({
            id: docSnap.id,
            ...docSnap.data()
          }));

        state.rows =
          sortRows(
            allRows.filter(row =>
              ownsInspection(
                row,
                state.user
              )
            )
          );

        state.filteredRows =
          state.rows.slice();

        updateSummary();
        renderRecords();

        const requestedId =
          new URLSearchParams(
            window.location.search
          ).get("id");

        if (requestedId) {
          openReport(requestedId);
        }
      } catch (error) {
        console.error(
          "[My Pre-Trips] load failed:",
          error
        );

        showMessage(
          "FarmVista could not load your pre-trip records.",
          "error"
        );

        elements.records.innerHTML = `
          <div class="empty-state">
            <span class="empty-title">
              Records unavailable
            </span>
            Refresh the page and try again.
          </div>
        `;
      }
    }

    elements.searchInput.addEventListener(
      "input",
      applyFilters
    );

    elements.statusFilter.addEventListener(
      "change",
      applyFilters
    );

    elements.records.addEventListener(
      "click",
      event => {
        const record =
          event.target.closest(
            "[data-inspection-id]"
          );

        if (record) {
          openReport(
            record.dataset.inspectionId
          );
        }
      }
    );

    elements.pdfButton.addEventListener(
      "click",
      generatePdf
    );

    elements.pdfBackButton.addEventListener(
  "click",
  () => {
    elements.pdfPanel.hidden = true;
    elements.detailContent.hidden = false;

    elements.pdfFrame.removeAttribute(
      "src"
    );

    elements.pdfLoading.hidden = false;

    if (state.currentPdfUrl) {
      URL.revokeObjectURL(
        state.currentPdfUrl
      );

      state.currentPdfUrl = "";
    }
  }
);

    elements.closeButton.addEventListener(
      "click",
      closeReport
    );

    elements.modal.addEventListener(
      "click",
      event => {
        if (
          event.target ===
          elements.modal
        ) {
          closeReport();
        }
      }
    );

    document.addEventListener(
      "keydown",
      event => {
        if (
          event.key === "Escape" &&
          !elements.modal.hidden
        ) {
          closeReport();
        }
      }
    );


    loadRecords();
  </script>
</body>
