<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FarmVista • My Pre-Trips</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3B7E46" />

  <script src="/Farm-vista/js/theme-boot.js"></script>

  <link rel="manifest" href="/Farm-vista/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/Farm-vista/assets/icons/apple-touch-icon.png" />
  <link rel="icon" href="/Farm-vista/assets/icons/icon-192.png" />
  <link rel="stylesheet" href="/Farm-vista/assets/css/theme.css" />
  <link rel="stylesheet" href="/Farm-vista/assets/css/app.css" />

  <style>
    :root{
      --card-max:1000px;
      --page-bottom-gap:72px;
      --accent:#2F6C3C;
    }

    *{box-sizing:border-box;}
    html,body{margin:0;min-height:100%;}
    body{background:var(--app-bg,var(--surface));color:var(--text);}
    button,input,select{font:inherit;}
    [hidden]{display:none!important;}

    .wrap{
      max-width:var(--card-max);
      margin:0 auto;
      padding:clamp(14px,3vw,22px);
      padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--ftr-h,42px) + var(--page-bottom-gap))!important;
    }

    .hero{
      border:1px solid var(--border);
      border-radius:14px;
      background:var(--surface);
      box-shadow:var(--shadow,0 8px 20px rgba(0,0,0,.08));
      overflow:visible;
    }

    .hero-head{
      display:grid;
      grid-template-columns:36px 1fr;
      gap:12px;
      align-items:center;
      padding:14px 16px;
      background:linear-gradient(90deg,rgba(47,108,60,.12),transparent);
      border-bottom:1px solid var(--border);
    }

    .hero-head .icon{
      width:24px;
      height:24px;
      display:grid;
      place-items:center;
      color:var(--accent);
      font-size:22px;
    }

    .hero-head h1{
      margin:0;
      font-size:clamp(24px,4vw,32px);
      line-height:1.15;
    }

    .hero-head p{
      margin:4px 0 0;
      color:var(--muted,#67706B);
      line-height:1.4;
    }

    .body{padding:16px;display:grid;gap:14px;}

    .toolbar{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:flex-end;
      justify-content:space-between;
    }

    .toolbar-left{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:44px;
      min-width:120px;
      padding:10px 14px;
      border-radius:12px;
      border:1px solid var(--border);
      background:var(--card-surface,var(--surface));
      color:var(--text)!important;
      font-size:.9rem;
      font-weight:850;
      text-decoration:none;
      cursor:pointer;
      user-select:none;
      gap:6px;
    }

    .btn-primary{
      border-color:transparent;
      background:#2F6C3C;
      color:#fff!important;
    }

    .btn-quiet{min-width:auto;}
    .btn-small{min-width:auto;padding:8px 12px;font-size:.85rem;}

    .message{
      display:none;
      padding:12px 14px;
      border:1px solid var(--border);
      border-radius:12px;
      background:var(--surface);
      font-weight:750;
      line-height:1.4;
    }

    .message.show{display:block;}
    .message.error{border-color:rgba(180,35,24,.45);color:#b42318;}

    .filters{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(160px,200px);
      gap:10px;
    }

    .control{
      width:100%;
      min-height:46px;
      padding:10px 12px;
      border:1px solid var(--border);
      border-radius:11px;
      background:var(--surface);
      color:var(--text);
      outline:none;
    }

    .control:focus{
      border-color:#3B7E46;
      box-shadow:0 0 0 3px rgba(59,126,70,.14);
    }

    .summary{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:9px;
    }

    .summary-card{
      padding:12px;
      border:1px solid var(--border);
      border-radius:13px;
      background:var(--surface);
      text-align:center;
    }

    .summary-value{
      font-size:24px;
      font-weight:950;
      line-height:1;
    }

    .summary-label{
      margin-top:5px;
      color:var(--muted,#68716c);
      font-size:11px;
      font-weight:850;
      letter-spacing:.05em;
      text-transform:uppercase;
    }

    .records{display:grid;gap:10px;}

    .record{
      width:100%;
      padding:0;
      overflow:hidden;
      border:1px solid var(--border);
      border-radius:15px;
      background:var(--surface);
      color:var(--text);
      text-align:left;
      box-shadow:var(--shadow,0 8px 22px rgba(0,0,0,.06));
      cursor:pointer;
    }

    .record:hover{border-color:rgba(59,126,70,.45);}

    .record-main{
      display:grid;
      grid-template-columns:14px minmax(0,1fr) auto;
      gap:11px;
      align-items:center;
      padding:14px;
    }

    .status-dot{
      width:12px;
      height:12px;
      border-radius:999px;
      background:#98a2b3;
    }

    .record.good .status-dot{background:#3B7E46;}
    .record.defect .status-dot{background:#b42318;}

    .record-content{min-width:0;}
    .record-title{font-size:15px;font-weight:900;line-height:1.25;}

    .record-equipment{
      display:block;
      margin-top:3px;
      color:var(--muted,#68716c);
      font-size:12px;
      font-weight:700;
      line-height:1.4;
      white-space:normal;
      overflow-wrap:anywhere;
    }

    .record-meta{text-align:right;}
    .record-result{display:block;font-size:12px;font-weight:900;}
    .record.defect .record-result{color:#b42318;}

    .record-time{
      display:block;
      margin-top:3px;
      color:var(--muted,#68716c);
      font-size:11px;
      font-weight:700;
    }

    .empty-state{
      padding:28px 18px;
      border:1px dashed var(--border);
      border-radius:15px;
      background:var(--surface);
      color:var(--muted,#68716c);
      text-align:center;
      line-height:1.45;
    }

    .empty-state strong{display:block;color:var(--text);font-size:17px;margin-bottom:5px;}

    /* Inline detail panel — copied from the working report-page pattern */
    .detail-panel{
      display:none;
      flex-direction:column;
      gap:10px;
      margin-top:4px;
      padding:14px 16px;
      border:1px solid var(--border);
      border-radius:12px;
      background:var(--surface);
      box-shadow:var(--shadow-soft,var(--shadow));
      scroll-margin-top:90px;
    }

    .detail-panel.show{display:flex;}

    .detail-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
    }

    .detail-heading{min-width:0;}
    .detail-title{font-size:1rem;font-weight:900;}
    .detail-subtitle{margin-top:3px;color:var(--muted,#68716c);font-size:.82rem;font-weight:700;}

    .detail-actions{
      display:flex;
      flex:0 0 auto;
      gap:8px;
    }

    .detail-report{
      color:var(--text);
    }

    .report-heading{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:14px;
      align-items:start;
      margin-bottom:14px;
      padding-bottom:12px;
      border-bottom:3px solid #3B7E46;
    }

    .report-brand-row{display:flex;align-items:center;gap:10px;}

    .report-logo{
      display:grid;
      width:42px;
      height:42px;
      flex:0 0 auto;
      place-items:center;
      border-radius:11px;
      background:#3B7E46;
      color:#fff;
      font-size:22px;
    }

    .report-brand{font-size:22px;font-weight:950;line-height:1;}
    .report-name{margin-top:4px;font-size:14px;font-weight:850;}

    .report-status{
      padding:8px 11px;
      border:1px solid rgba(59,126,70,.25);
      border-radius:999px;
      background:rgba(59,126,70,.1);
      color:#2f6c3c;
      font-size:12px;
      font-weight:950;
      white-space:nowrap;
    }

    .report-status.defect{
      border-color:rgba(180,35,24,.3);
      background:rgba(180,35,24,.1);
      color:#b42318;
    }

    .report-meta{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
      margin-bottom:14px;
    }

    .meta-box{
      min-width:0;
      padding:9px 10px;
      border:1px solid var(--border);
      border-radius:10px;
      background:var(--surface-2,rgba(127,127,127,.05));
    }

    .meta-label{
      color:var(--muted,#68716c);
      font-size:9px;
      font-weight:900;
      letter-spacing:.06em;
      text-transform:uppercase;
    }

    .meta-value{
      margin-top:4px;
      overflow-wrap:anywhere;
      font-size:12px;
      font-weight:850;
      line-height:1.3;
    }

    .inspection-block{margin-top:14px;}

    .inspection-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin:0 0 7px;
      padding:7px 9px;
      border-left:4px solid #3B7E46;
      background:var(--surface-2,rgba(127,127,127,.05));
      font-size:14px;
      font-weight:950;
      line-height:1.2;
    }

    .inspection-count{
      color:var(--muted,#68716c);
      font-size:10px;
      font-weight:850;
      white-space:nowrap;
    }

    .inspection-table{
      width:100%;
      border:1px solid var(--border);
      border-collapse:collapse;
      table-layout:fixed;
    }

    .inspection-table col.result-column{width:105px;}

    .inspection-table th,
    .inspection-table td{
      padding:7px 9px;
      border:1px solid var(--border);
      font-size:11px;
      line-height:1.3;
      text-align:left;
      vertical-align:top;
    }

    .inspection-table th{
      background:var(--surface-2,rgba(127,127,127,.07));
      font-weight:950;
    }

    .inspection-item{font-weight:800;}
    .inspection-result{font-weight:950;white-space:nowrap;}
    .inspection-result.pass{color:#2f6c3c;}
    .inspection-result.defect{color:#b42318;}
    .inspection-result.na{color:#667085;}

    .inline-defect{
      margin-top:4px;
      padding:5px 7px;
      border-left:3px solid #b42318;
      background:rgba(180,35,24,.06);
      color:#b42318;
      font-weight:700;
      line-height:1.35;
    }

    .photo-link{
      display:inline-flex;
      margin-top:5px;
      color:#3B7E46;
      font-weight:850;
      text-decoration:none;
    }

    .defect-summary{display:grid;gap:8px;}

    .defect-card{
      padding:9px 10px;
      border:1px solid rgba(180,35,24,.35);
      border-radius:9px;
      background:rgba(180,35,24,.05);
    }

    .defect-card-title{color:#b42318;font-size:12px;font-weight:950;}
    .defect-card-note{margin-top:4px;font-size:11px;line-height:1.4;}

    .remarks-box{
      min-height:54px;
      padding:9px 10px;
      border:1px solid var(--border);
      border-radius:9px;
      background:var(--surface-2,rgba(127,127,127,.05));
      font-size:11px;
      line-height:1.4;
      white-space:pre-wrap;
    }

    .certification{
      margin-top:14px;
      padding:10px;
      border:1px solid var(--border);
      border-radius:9px;
      background:var(--surface-2,rgba(127,127,127,.05));
      font-size:10px;
      line-height:1.45;
    }

    .certification-grid{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:10px;
      margin-top:7px;
      padding-top:7px;
      border-top:1px solid var(--border);
    }

    .record-id{margin-top:7px;overflow-wrap:anywhere;}

    #fv-print-frame{
      position:fixed;
      right:0;
      bottom:0;
      width:0;
      height:0;
      border:0;
      visibility:hidden;
    }

    @media(max-width:650px){
      .toolbar{align-items:stretch;}
      .toolbar-left{width:100%;}
      .toolbar-left .btn{flex:1;}
      .filters{grid-template-columns:1fr;}
      .record-main{grid-template-columns:12px minmax(0,1fr);align-items:start;}
      .record-meta{grid-column:2;text-align:left;margin-top:6px;}
      .detail-header{flex-direction:column;}
      .detail-actions{width:100%;}
      .detail-actions .btn{flex:1;}
      .report-heading{grid-template-columns:1fr;}
      .report-status{justify-self:start;}
      .report-meta{grid-template-columns:repeat(2,minmax(0,1fr));}
      .inspection-table col.result-column{width:82px;}
      .inspection-table th,.inspection-table td{padding:7px;font-size:10px;}
      .certification-grid{grid-template-columns:1fr;}
    }
  </style>

  <script>
    (function(){
      if(!customElements.get('fv-shell')){
        const s=document.createElement('script');
        s.src='/Farm-vista/js/fv-shell.js';
        s.defer=true;
        document.head.appendChild(s);
      }
    })();
  </script>

  <script type="module">
    import {
      ready,
      getAuth,
      getFirestore,
      collection,
      getDocs
    } from "/Farm-vista/js/firebase-init.js";

    await ready;

    const COLLECTION = "logisticsInspections";
    const auth = getAuth();
    const db = getFirestore();

    const state = {
      user:null,
      rows:[],
      filteredRows:[],
      selectedId:null
    };

    const $ = (selector, root=document) => root.querySelector(selector);

    const elements = {
      message:$("#message"),
      searchInput:$("#searchInput"),
      statusFilter:$("#statusFilter"),
      totalCount:$("#totalCount"),
      passedCount:$("#passedCount"),
      defectCount:$("#defectCount"),
      records:$("#records"),
      detailPanel:$("#detailPanel"),
      detailTitle:$("#detailTitle"),
      detailSubtitle:$("#detailSubtitle"),
      detailReport:$("#detailReport"),
      printButton:$("#printButton"),
      closeButton:$("#closeButton")
    };

    function clean(value){
      return String(value ?? "").trim();
    }

    function normalized(value){
      return clean(value).toLowerCase();
    }

    function escapeHtml(value){
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      })[character]);
    }

    function toDate(value){
      if(!value) return null;
      if(value instanceof Date) return value;
      if(typeof value.toDate === "function") return value.toDate();
      if(typeof value.seconds === "number") return new Date(value.seconds * 1000);
      const parsed = new Date(value);
      return Number.isNaN(parsed.getTime()) ? null : parsed;
    }

    function formatDate(value){
      const raw=clean(value);
      if(!raw) return "Date not listed";
      const parts=raw.slice(0,10).split("-");
      if(parts.length===3){
        const date=new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2]));
        return new Intl.DateTimeFormat("en-US",{
          weekday:"short",
          month:"short",
          day:"numeric",
          year:"numeric"
        }).format(date);
      }
      return raw;
    }

    function formatDateTime(value){
      const date=toDate(value);
      if(!date) return "Time not listed";
      return new Intl.DateTimeFormat("en-US",{
        month:"short",
        day:"numeric",
        year:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }).format(date);
    }

    function formatNumber(value){
      const number=Number(value);
      return Number.isFinite(number) ? number.toLocaleString() : "Not listed";
    }

    function defectCount(row){
      const direct=Number(row.defectCount);
      if(Number.isFinite(direct)) return direct;
      return Array.isArray(row.responses)
        ? row.responses.filter(response => normalized(response.status)==="defect").length
        : 0;
    }

    function hasDefects(row){
      return row.hasDefects===true ||
        defectCount(row)>0 ||
        normalized(row.overallStatus)==="defectsreported";
    }

    function truckLabel(row){
      return clean(
        row.truckLabel ||
        row.truck?.label ||
        row.truckUnitId ||
        row.truck?.unitId ||
        "Truck not listed"
      );
    }

    function trailerLabel(row){
      if(row.trailerHookedOn===false || (!row.trailerId && !row.trailerLabel && !row.trailer)){
        return "No Trailer Hooked On";
      }
      return clean(
        row.trailerLabel ||
        row.trailer?.label ||
        row.trailerUnitId ||
        row.trailer?.unitId ||
        "Trailer not listed"
      );
    }

    function ownsInspection(row,user){
      if(!row || !user) return false;

      const userUid=clean(user.uid);
      const userEmail=normalized(user.email);

      const rowUid=clean(row.driverUid || row.submittedByUid || row.userUid);
      const rowEmail=normalized(row.driverEmail || row.submittedByEmail || row.userEmail);

      if(rowUid) return rowUid===userUid;
      return Boolean(rowEmail && userEmail && rowEmail===userEmail);
    }

    function statusLabel(status){
      const value=normalized(status);
      if(value==="pass") return "Good";
      if(value==="defect") return "Defect";
      if(value==="na") return "N/A";
      return clean(status) || "Not answered";
    }

    function sectionKey(response){
      return normalized(response?.section).includes("trailer") ? "trailer" : "truck";
    }

    function inspectionResponses(row,section){
      const responses=Array.isArray(row.responses) ? row.responses : [];
      return responses.filter(response => sectionKey(response)===section);
    }

    function showMessage(text,type=""){
      elements.message.textContent=text;
      elements.message.className=`message show ${type}`;
    }

    function clearMessage(){
      elements.message.textContent="";
      elements.message.className="message";
    }

    function waitForUser(){
      return new Promise(resolve => {
        let attempts=0;
        const check=()=>{
          attempts+=1;
          const user=auth?.currentUser || null;
          if(user || attempts>=40){
            resolve(user);
            return;
          }
          setTimeout(check,250);
        };
        check();
      });
    }

    function sortRows(rows){
      return rows.slice().sort((a,b)=>{
        const aTime=toDate(a.submittedAt || a.createdAt || a.updatedAt)?.getTime() || 0;
        const bTime=toDate(b.submittedAt || b.createdAt || b.updatedAt)?.getTime() || 0;
        if(aTime!==bTime) return bTime-aTime;
        return clean(b.inspectionDate).localeCompare(clean(a.inspectionDate));
      });
    }

    function updateSummary(){
      const total=state.rows.length;
      const defects=state.rows.filter(hasDefects).length;
      elements.totalCount.textContent=String(total);
      elements.passedCount.textContent=String(total-defects);
      elements.defectCount.textContent=String(defects);
    }

    function applyFilters(){
      const search=normalized(elements.searchInput.value);
      const status=elements.statusFilter.value;

      state.filteredRows=state.rows.filter(row=>{
        if(status==="satisfactory" && hasDefects(row)) return false;
        if(status==="defects" && !hasDefects(row)) return false;
        if(!search) return true;

        const haystack=normalized([
          row.inspectionDate,
          formatDate(row.inspectionDate),
          truckLabel(row),
          trailerLabel(row),
          row.odometerMiles,
          row.remarks
        ].join(" "));

        return haystack.includes(search);
      });

      renderRecords();
    }

    function renderRecords(){
      if(!state.filteredRows.length){
        elements.records.innerHTML=`
          <div class="empty-state">
            <strong>${state.rows.length ? "No matching pre-trips" : "No pre-trips found"}</strong>
            ${state.rows.length ? "Try changing your search or result filter." : "Your submitted inspections will appear here."}
          </div>
        `;
        return;
      }

      elements.records.innerHTML=state.filteredRows.map(row=>{
        const defects=defectCount(row);
        const defective=hasDefects(row);
        const equipment=[truckLabel(row),trailerLabel(row)].filter(Boolean).join(" • ");
        const submitted=formatDateTime(row.submittedAt || row.createdAt);

        return `
          <button class="record ${defective ? "defect" : "good"}"
                  type="button"
                  data-inspection-id="${escapeHtml(row.id)}">
            <span class="record-main">
              <span class="status-dot" aria-hidden="true"></span>
              <span class="record-content">
                <span class="record-title">${escapeHtml(formatDate(row.inspectionDate))}</span>
                <span class="record-equipment">${escapeHtml(equipment)}</span>
              </span>
              <span class="record-meta">
                <span class="record-result">
                  ${defective ? `${defects} defect${defects===1 ? "" : "s"}` : "Passed"}
                </span>
                <span class="record-time">${escapeHtml(submitted)}</span>
              </span>
            </span>
          </button>
        `;
      }).join("");
    }

    function renderInspectionTable(responses){
      if(!responses.length){
        return `<div class="remarks-box">No inspection items were saved for this section.</div>`;
      }

      return `
        <table class="inspection-table">
          <colgroup>
            <col>
            <col class="result-column">
          </colgroup>
          <thead>
            <tr>
              <th>Inspection Item</th>
              <th>Result</th>
            </tr>
          </thead>
          <tbody>
            ${responses.map(response=>{
              const status=normalized(response.status);
              return `
                <tr>
                  <td>
                    <div class="inspection-item">${escapeHtml(response.label || response.itemId || "Inspection item")}</div>
                    ${status==="defect" && response.note ? `<div class="inline-defect">${escapeHtml(response.note)}</div>` : ""}
                    ${response.photoUrl ? `<a class="photo-link" href="${escapeHtml(response.photoUrl)}" target="_blank" rel="noopener">View attached photo or file</a>` : ""}
                  </td>
                  <td><span class="inspection-result ${escapeHtml(status)}">${escapeHtml(statusLabel(response.status))}</span></td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      `;
    }

    function renderDefectSummary(row){
      const responses=Array.isArray(row.responses) ? row.responses : [];
      const defects=responses.filter(response => normalized(response.status)==="defect");
      if(!defects.length) return "";

      return `
        <section class="inspection-block">
          <h3 class="inspection-title">
            <span>Reported Defects</span>
            <span class="inspection-count">${defects.length} reported</span>

              <div class="defect-card">

          </div>

    }

    function buildScreenReport(row){
      const defective=hasDefects(row);
      const defects=defectCount(row);
      const truckResponses=inspectionResponses(row,"truck");
      const trailerResponses=inspectionResponses(row,"trailer");
      const submitted=formatDateTime(row.submittedAt || row.createdAt);
      const driverName=row.driverName || state.user?.displayName || state.user?.email || "FarmVista User";

      return `
        <section class="report-heading">
          <div class="report-brand-row">
            <div class="report-logo" aria-hidden="true">🚛</div>
            <div>
              <div class="report-brand">FarmVista</div>
              <div class="report-name">Driver Vehicle Pre-Trip Inspection Report</div>
            </div>
          </div>
          <div class="report-status ${defective ? "defect" : ""}">
            ${defective ? `${defects} Defect${defects===1 ? "" : "s"} Reported` : "Satisfactory"}
          </div>
        </section>

        <section class="report-meta">
          <div class="meta-box"><div class="meta-label">Driver</div><div class="meta-value">${escapeHtml(driverName)}</div></div>
          <div class="meta-box"><div class="meta-label">Inspection Date</div><div class="meta-value">${escapeHtml(formatDate(row.inspectionDate))}</div></div>
          <div class="meta-box"><div class="meta-label">Submitted</div><div class="meta-value">${escapeHtml(submitted)}</div></div>
          <div class="meta-box"><div class="meta-label">Truck / Semi</div><div class="meta-value">${escapeHtml(truckLabel(row))}</div></div>
          <div class="meta-box"><div class="meta-label">Trailer</div><div class="meta-value">${escapeHtml(trailerLabel(row))}</div></div>
          <div class="meta-box"><div class="meta-label">Odometer</div><div class="meta-value">${escapeHtml(formatNumber(row.odometerMiles))} miles</div></div>
        </section>

        <section class="inspection-block">
          <h3 class="inspection-title"><span>Truck / Semi Inspection</span><span class="inspection-count">${truckResponses.length} items</span></h3>
          ${renderInspectionTable(truckResponses)}
        </section>

        ${row.trailerHookedOn!==false ? `
          <section class="inspection-block">
            <h3 class="inspection-title"><span>Trailer Inspection</span><span class="inspection-count">${trailerResponses.length} items</span></h3>
            ${renderInspectionTable(trailerResponses)}
          </section>
        ` : ""}

        ${renderDefectSummary(row)}

        <section class="inspection-block">
          <h3 class="inspection-title"><span>Driver Remarks</span></h3>
          <div class="remarks-box">${escapeHtml(row.remarks || "No additional remarks.")}</div>
        </section>

        <section class="certification">
          <strong>Driver Certification</strong>
          <div>This inspection was electronically certified and submitted by the driver through FarmVista.</div>
          <div class="certification-grid">
            <div><strong>Driver:</strong> ${escapeHtml(driverName)}</div>
            <div><strong>Date:</strong> ${escapeHtml(formatDate(row.inspectionDate))}</div>
          </div>
          <div class="record-id"><strong>Inspection Record ID:</strong> ${escapeHtml(row.id)}</div>
        </section>
      `;
    }

    function openDetails(id){
      const row=state.rows.find(record => record.id===id);
      if(!row){
        showMessage("That inspection record could not be found.","error");
        return;
      }
      if(!ownsInspection(row,state.user)){
        showMessage("You do not have access to that inspection.","error");
        return;
      }

      state.selectedId=id;
      elements.detailTitle.textContent="Pre-Trip Inspection";
      elements.detailSubtitle.textContent=`${formatDate(row.inspectionDate)} • ${truckLabel(row)}`;
      elements.detailReport.innerHTML=buildScreenReport(row);
      elements.detailPanel.classList.add("show");

      const url=new URL(window.location.href);
      url.searchParams.set("id",id);
      history.replaceState({},"",url.pathname+url.search);

      requestAnimationFrame(()=>{
        elements.detailPanel.scrollIntoView({behavior:"smooth",block:"start"});
      });
    }

    function closeDetails(){
      elements.detailPanel.classList.remove("show");
      elements.detailReport.innerHTML="";
      state.selectedId=null;

      const url=new URL(window.location.href);
      url.searchParams.delete("id");
      history.replaceState({},"",url.pathname+url.search);
    }

    function buildPrintHtml(row){
      const defective=hasDefects(row);
      const defects=defectCount(row);
      const truckResponses=inspectionResponses(row,"truck");
      const trailerResponses=inspectionResponses(row,"trailer");
      const submitted=formatDateTime(row.submittedAt || row.createdAt);
      const driverName=row.driverName || state.user?.displayName || state.user?.email || "FarmVista User";

      function printTable(responses){
        if(!responses.length){
          return `<div class="empty-box">No inspection items were saved for this section.</div>`;
        }

        return `
          <table class="inspection-table">
            <colgroup><col><col class="result-column"></colgroup>
            <thead><tr><th>Inspection Item</th><th>Result</th></tr></thead>
            <tbody>
              ${responses.map(response=>{
                const status=normalized(response.status);
                return `
                  <tr>
                    <td>
                      <div class="item-name">${escapeHtml(response.label || response.itemId || "Inspection item")}</div>
                      ${status==="defect" && response.note ? `<div class="defect-note">${escapeHtml(response.note)}</div>` : ""}
                    </td>
                    <td class="result ${escapeHtml(status)}">${escapeHtml(statusLabel(response.status))}</td>
                  </tr>
                `;
              }).join("")}
            </tbody>
          </table>
        `;
      }

      return `<!doctype html>

<body>
  <div class="page">
    <header class="hdr">
      <div class="logo">🚛</div>

        <div class="brand">FarmVista</div>

      <div class="meta">

    <section class="meta-grid">

    function printSelected(){
      if(!state.selectedId) return;

      const row=state.rows.find(record => record.id===state.selectedId);
      if(!row) return;

      const html=buildPrintHtml(row);

      let iframe=document.getElementById("fv-print-frame");
      if(!iframe){
        iframe=document.createElement("iframe");
        iframe.id="fv-print-frame";
        document.querySelector(".wrap")?.appendChild(iframe);
      }

      const win=iframe.contentWindow || iframe.contentDocument;
      const docu=iframe.contentDocument || iframe.contentWindow.document;

      docu.open();
      docu.write(html);
      docu.close();

      setTimeout(()=>{
        try{
          win.focus();
          win.print();
        }catch(err){
          console.warn("[my-pre-trips] iframe print failed, falling back to window.print()",err);
          window.print();
        }
      },400);
    }

    async function loadRecords(){
      clearMessage();
      elements.records.innerHTML=`<div class="empty-state">Loading your pre-trip records…</div>`;

      state.user=await waitForUser();

      if(!state.user){
        showMessage("Your FarmVista account could not be loaded. Refresh the page or sign in again.","error");
        elements.records.innerHTML=`<div class="empty-state"><strong>Account not available</strong>Sign in again to view your records.</div>`;
        return;
      }

      try{
        const snapshot=await getDocs(collection(db,COLLECTION));
        const allRows=snapshot.docs.map(documentSnapshot=>({
          id:documentSnapshot.id,
          ...documentSnapshot.data()
        }));

        state.rows=sortRows(allRows.filter(row=>ownsInspection(row,state.user)));
        state.filteredRows=state.rows.slice();

        updateSummary();
        renderRecords();

        const requestedId=new URLSearchParams(window.location.search).get("id");
        if(requestedId) openDetails(requestedId);
      }catch(error){
        console.error("[My Pre-Trips] Records failed to load:",error);
        showMessage("FarmVista could not load your pre-trip records.","error");
        elements.records.innerHTML=`<div class="empty-state"><strong>Records unavailable</strong>Refresh the page and try again.</div>`;
      }
    }

    elements.searchInput.addEventListener("input",applyFilters);
    elements.statusFilter.addEventListener("change",applyFilters);

    elements.records.addEventListener("click",event=>{
      const card=event.target.closest("[data-inspection-id]");
      if(card) openDetails(card.dataset.inspectionId);
    });

    elements.closeButton.addEventListener("click",closeDetails);
    elements.printButton.addEventListener("click",printSelected);

    loadRecords();
  </script>
