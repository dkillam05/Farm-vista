<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FarmVista • Grain Inventory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3B7E46" />

  <script src="/Farm-vista/js/theme-boot.js"></script>
  <script src="/Farm-vista/js/grain-capacity.js"></script>

  <link rel="manifest" href="/Farm-vista/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/Farm-vista/assets/icons/apple-touch-icon.png" />
  <link rel="icon" href="/Farm-vista/assets/icons/icon-192.png" />

  <link rel="stylesheet" href="/Farm-vista/assets/css/theme.css" />
  <link rel="stylesheet" href="/Farm-vista/assets/css/app.css" />
  <link rel="stylesheet" href="/Farm-vista/assets/css/dashboard.css" />

  <script src="/Farm-vista/js/version.js" defer></script>
  <script src="/Farm-vista/js/core.js" defer></script>
  <script src="/Farm-vista/js/fv-shell.js" defer></script>

  <style>
    .page{
      max-width:1180px !important;
      margin:0 auto !important;
      padding:clamp(12px,2vw,24px) !important;
    }

    .sum-card{
      background:var(--surface);
      color:var(--text);
      border:1px solid var(--border);
      border-radius:14px;
      box-shadow:var(--shadow);
      padding:16px;
      margin:20px 0 0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
    }

    .sum-title{
      width:100%;
      font-weight:900;
      font-size:18px;
      margin:2px 0 8px;
    }

    .muted{
      color:var(--muted,#87908a);
    }

    .big{
      font-weight:900;
      font-size:clamp(22px,4.8vw,32px);
      line-height:1.15;
    }

    .selectors{
      display:flex;
      align-items:flex-start;
      gap:12px;
      flex-wrap:wrap;
    }

    .selectors > div{
      min-width:160px;
    }

    .selectors label{
      font-weight:700;
      color:var(--muted,#87908a);
    }

    select.select{
      appearance:none;
      border:1px solid var(--border);
      background:var(--surface);
      padding:8px 36px 8px 12px;
      border-radius:10px;
      font-weight:700;
      color:var(--text);
      width:100%;
      background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="8" viewBox="0 0 14 8"><path d="M1 1l6 6 6-6" fill="none" stroke="%2367706B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
      background-repeat:no-repeat;
      background-position:right 10px center;
      background-size:14px 8px;
    }

    .metrics{
      display:flex;
      align-items:center;
      gap:24px;
      flex-wrap:wrap;
    }

    .metric{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:200px;
    }

    .btn-report{
      margin-top:8px;
      padding:8px 14px;
      border-radius:10px;
      border:1px solid var(--border);
      background:var(--surface-2,rgba(255,255,255,.06));
      font-size:14px;
      font-weight:700;
      color:var(--text);
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    .btn-report:hover{
      border-color:var(--accent,#3B7E46);
      background:rgba(59,126,70,.12);
      box-shadow:var(--shadow-soft,var(--shadow));
    }

    .kpi-stamp{
      width:100%;
      font-size:12px;
      color:var(--muted,#87908a);
      margin-top:2px;
      user-select:text;
    }

    .perm-hidden{
      display:none !important;
    }

    @media(max-width:700px){
      .page{
        padding:10px 8px !important;
      }

      .sum-card{
        align-items:flex-start;
      }

      .selectors,
      .metrics{
        width:100%;
      }

      .selectors > div,
      .metric{
        width:100%;
        min-width:0;
      }
    }
  </style>
</head>

<body>
  <fv-shell>
    <div class="page container">
      <h1 class="page-title">Grain Inventory</h1>

      <p class="muted" style="margin:0 0 18px 0;">
        Current on-farm grain stored in bins and field bags.
      </p>

      <section class="sum-card" aria-label="Grain Bin Inventory summary" id="grain-bins-summary">
        <div class="sum-title">Grain Bin Inventory</div>

        <div class="selectors" role="group" aria-label="Bin selectors">
          <div>
            <label for="bin-crop">Crop</label><br/>
            <select id="bin-crop" class="select" aria-label="Select crop for bin summary">
              <option value="all" selected>All Crops</option>
              <option value="corn">Corn</option>
              <option value="soybeans">Soybeans</option>
            </select>
          </div>
        </div>

        <div class="metrics">
          <div class="metric">
            <div class="muted">Current Bushels On Hand</div>
            <div id="bin-bushels" class="big">— bu</div>
          </div>
        </div>

        <button
          type="button"
          class="btn-report"
          data-report-link="/Farm-vista/pages/reports/reports-grainbin-inventory.html"
        >
          <span>View Full Report</span>
        </button>
      </section>

      <section class="sum-card" aria-label="Grain Bag Inventory summary" id="grain-bags-summary">
        <div class="sum-title">Grain Bag Inventory (grain in field bags)</div>

        <div class="selectors" role="group" aria-label="Bag selectors">
          <div>
            <label for="bag-crop">Crop</label><br/>
            <select id="bag-crop" class="select" aria-label="Select crop for bag summary">
              <option value="all" selected>All Crops</option>
              <option value="corn">Corn</option>
              <option value="soybeans">Soybeans</option>
            </select>
          </div>
        </div>

        <div class="metrics">
          <div class="metric">
            <div class="muted">Bag Count (full + partial, in fields)</div>
            <div id="bag-count" class="big">—</div>
            <div id="bag-stamp" class="kpi-stamp">
              bagKPI: report-match v2 (products+movements+grain-capacity)
            </div>
          </div>

          <div class="metric">
            <div class="muted">Total Bushels In Field Bags</div>
            <div id="bag-bushels" class="big">— bu</div>
          </div>
        </div>

        <button
          type="button"
          class="btn-report"
          data-report-link="/Farm-vista/pages/reports/reports-grainbags-downinventory.html"
        >
          <span>View Full Report</span>
        </button>
      </section>
    </div>
  </fv-shell>

  <script type="module">
    import {
      ready,
      getAuth,
      onAuthStateChanged,
      getFirestore,
      doc,
      getDoc,
      collection,
      getDocs,
      query,
      where
    } from '/Farm-vista/js/firebase-init.js';

    (function(){
      "use strict";

      const KEY_GRAIN_KPI = "cap-kpi-grain";

      const els = {
        bins: document.getElementById("grain-bins-summary"),
        bags: document.getElementById("grain-bags-summary")
      };

      function hide(el){
        if (!el) return;
        el.classList.add("perm-hidden");
        el.setAttribute("aria-hidden","true");
      }

      function show(el){
        if (!el) return;
        el.classList.remove("perm-hidden");
        el.removeAttribute("aria-hidden");
      }

      function hasPermObj(p){
        return p && typeof p === "object" && (
          Object.prototype.hasOwnProperty.call(p,"view") ||
          Object.prototype.hasOwnProperty.call(p,"add") ||
          Object.prototype.hasOwnProperty.call(p,"edit") ||
          Object.prototype.hasOwnProperty.call(p,"delete")
        );
      }

      function canFromPermValue(val, action){
        if (val == null) return false;
        if (val === true) return true;
        if (val === false) return false;

        if (typeof val === "object"){
          if (typeof val.on === "boolean") return !!val.on;

          if (hasPermObj(val)){
            const a = (action || "view").toLowerCase();
            if (typeof val[a] === "boolean") return !!val[a];
            return !!(val.view || val.add || val.edit || val.delete);
          }
        }

        return false;
      }

      function makeCan(perms){
        return function(key, action){
          if (!key) return true;
          return canFromPermValue(perms ? perms[key] : null, action || "view");
        };
      }

      function deepClone(obj){
        try{
          return JSON.parse(JSON.stringify(obj || {}));
        }
        catch{
          return {};
        }
      }

      function mergePerms(base, overrides){
        const out = deepClone(base || {});
        const ov = (overrides && typeof overrides === "object") ? overrides : {};

        for (const k of Object.keys(ov)){
          out[k] = ov[k];
        }

        return out;
      }

      function extractEmployeeGroupAndOverrides(emp){
        const e = emp || {};
        const permissionGroup = (e.permissionGroup || "").toString().trim();

        const overrides =
          (e.overrides && e.overrides.perms && typeof e.overrides.perms === "object" ? e.overrides.perms : null) ||
          (e.overrides && typeof e.overrides === "object" ? e.overrides : null) ||
          (e.perms && typeof e.perms === "object" ? e.perms : null) ||
          {};

        return { permissionGroup, overrides };
      }

      async function readEmployeeByEmail(db, user){
        const email = (user?.email || "").toString().trim().toLowerCase();

        if (!email) return null;

        const ref = doc(db, "employees", email);
        const snap = await getDoc(ref);

        return snap.exists() ? (snap.data() || {}) : null;
      }

      async function readRolePermsByDocId(db, maybeId){
        if (!maybeId) return null;

        try{
          const ref = doc(db, "accountRoles", maybeId);
          const snap = await getDoc(ref);

          if (!snap.exists()) return null;

          const d = snap.data() || {};
          return (d.perms && typeof d.perms === "object") ? d.perms : {};
        }
        catch{
          return null;
        }
      }

      async function readRolePermsByName(db, roleName){
        if (!roleName) return null;

        try{
          const qy = query(
            collection(db, "accountRoles"),
            where("name", "==", roleName)
          );

          const ss = await getDocs(qy);
          let first = null;

          ss.forEach(d => {
            if (!first) first = d;
          });

          if (!first) return null;

          const d = first.data() || {};
          return (d.perms && typeof d.perms === "object") ? d.perms : {};
        }
        catch{
          return null;
        }
      }

      function applyVisibility(perms, permsKnown){
        if (!permsKnown){
          show(els.bins);
          show(els.bags);

          window.FV_GRAIN_PERMS = null;
          window.FV_GRAIN_CAN = null;

          document.dispatchEvent(
            new CustomEvent(
              "fv:grain-perms-ready",
              { detail:{ permsKnown:false } }
            )
          );

          return;
        }

        const can = makeCan(perms);
        const ok = can(KEY_GRAIN_KPI, "view");

        ok ? show(els.bins) : hide(els.bins);
        ok ? show(els.bags) : hide(els.bags);

        window.FV_GRAIN_PERMS = perms || {};
        window.FV_GRAIN_CAN = can;

        document.dispatchEvent(
          new CustomEvent(
            "fv:grain-perms-ready",
            { detail:{ permsKnown:true } }
          )
        );
      }

      async function init(){
        await ready;

        const auth = getAuth();
        const db = getFirestore();

        applyVisibility(null, false);

        onAuthStateChanged(auth, async user => {
          try{
            if (!user){
              applyVisibility(null, false);
              return;
            }

            const emp = await readEmployeeByEmail(db, user);

            if (!emp){
              console.warn("[grain] employees doc not found for:", user.email);
              applyVisibility(null, false);
              return;
            }

            const { permissionGroup, overrides } =
              extractEmployeeGroupAndOverrides(emp);

            let basePerms =
              await readRolePermsByDocId(db, permissionGroup);

            if (!basePerms){
              basePerms =
                await readRolePermsByName(db, permissionGroup);
            }

            if (!basePerms){
              console.warn(
                "[grain] accountRoles not found for permissionGroup:",
                permissionGroup
              );

              applyVisibility(null, false);
              return;
            }

            applyVisibility(
              mergePerms(basePerms, overrides),
              true
            );
          }
          catch(err){
            console.warn("[grain] perms resolver failed:", err);
            applyVisibility(null, false);
          }
        });
      }

      init();
    })();
  </script>

  <script type="module">
    import {
      ready,
      getFirestore,
      collection,
      getDocs
    } from '/Farm-vista/js/firebase-init.js';

    const num = value => {
      if (typeof value === "number"){
        return isFinite(value) ? value : null;
      }

      if (
        value === null ||
        value === undefined ||
        value === ""
      ){
        return null;
      }

      const n = parseFloat(value);
      return isFinite(n) ? n : null;
    };

    const fmtInt = value => {
      const n = num(value);
      if (n === null) return "—";
      return Math.round(n).toLocaleString("en-US");
    };

    const norm = value =>
      (value || "").toString().trim().toLowerCase();

    const isHidden = el =>
      !el ||
      el.classList.contains("perm-hidden") ||
      el.getAttribute("aria-hidden") === "true";

    function safeNum(value, def=0){
      const n = Number(value);
      return Number.isFinite(n) ? n : def;
    }

    function parseDocIdFromRef(ref){
      if (!ref) return "";

      try{
        if (typeof ref.id === "string" && ref.id){
          return ref.id;
        }
      }
      catch(_){}

      const parts =
        String(ref || "")
          .split("/")
          .filter(Boolean);

      return parts.length
        ? parts[parts.length - 1]
        : "";
    }

    function makeBagKey(brand, diameterFt, lengthFt){
      return `${norm(brand)}|${safeNum(diameterFt,0)}|${safeNum(lengthFt,0)}`;
    }

    function estimateBuPerFoot(diameterFt){
      const d = Number(diameterFt) || 0;

      if (d >= 12) return 60;
      if (d >= 11) return 50;
      if (d >= 10) return 39;
      if (d >= 9) return 30;
      if (d > 0) return 25;

      return 0;
    }

    function cropKeyFromAny(value){
      const c = norm(value);

      if (!c) return "";

      if (
        c === "soy" ||
        c === "soybean" ||
        c === "soybeans" ||
        c === "beans" ||
        c === "sb"
      ){
        return "soybeans";
      }

      if (
        c === "corn" ||
        c === "maize"
      ){
        return "corn";
      }

      return c;
    }

    function cropFactorFromCorn(cropType){
      try{
        const api =
          window.FVGrainCapacity || null;

        if (
          api &&
          typeof api.getFactor === "function"
        ){
          const factor =
            Number(api.getFactor(cropType));

          if (
            Number.isFinite(factor) &&
            factor > 0
          ){
            return factor;
          }
        }
      }
      catch(_){}

      return 1;
    }

    (async () => {
      await ready;

      const db = getFirestore();

      const binsSection =
        document.getElementById("grain-bins-summary");

      const bagsSection =
        document.getElementById("grain-bags-summary");

      const binBushelsEl =
        document.getElementById("bin-bushels");

      const binSelCrop =
        document.getElementById("bin-crop");

      const bagCountEl =
        document.getElementById("bag-count");

      const bagBushelsEl =
        document.getElementById("bag-bushels");

      const bagSelCrop =
        document.getElementById("bag-crop");

      document
        .querySelectorAll(".btn-report[data-report-link]")
        .forEach(btn => {
          btn.addEventListener("click", event => {
            event.stopPropagation();

            const href =
              btn.getAttribute("data-report-link");

            if (href){
              window.location.href = href;
            }
          });
        });

      async function loadBinSummary(){
        if (
          !binBushelsEl ||
          isHidden(binsSection)
        ){
          return;
        }

        binBushelsEl.textContent = "… bu";

        const cropFilter =
          cropKeyFromAny(binSelCrop.value);

        try{
          const snap =
            await getDocs(
              collection(db, "binSites")
            );

          let total = 0;

          snap.forEach(docSnap => {
            const data = docSnap.data() || {};
            const bins =
              Array.isArray(data.bins)
                ? data.bins
                : [];

            bins.forEach(bin => {
              const on =
                num(bin?.onHand);

              if (!on || on <= 0){
                return;
              }

              const binCrop =
                cropKeyFromAny(
                  bin?.lastCropType
                );

              if (
                cropFilter &&
                cropFilter !== "all" &&
                binCrop &&
                binCrop !== cropFilter
              ){
                return;
              }

              total += on;
            });
          });

          binBushelsEl.textContent =
            total
              ? `${fmtInt(total)} bu`
              : "— bu";
        }
        catch(err){
          console.error(
            "[grain] bin summary error",
            err
          );

          binBushelsEl.textContent = "— bu";
        }
      }

      async function loadBagSummary(){
        if (
          !bagCountEl ||
          !bagBushelsEl ||
          isHidden(bagsSection)
        ){
          return;
        }

        bagCountEl.textContent = "…";
        bagBushelsEl.textContent = "… bu";

        const cropFilter =
          cropKeyFromAny(bagSelCrop.value);

        try{
          const [
            eventSnapshot,
            movementSnapshot,
            productSnapshot
          ] = await Promise.all([
            getDocs(
              collection(
                db,
                "grain_bag_events"
              )
            ),
            getDocs(
              collection(
                db,
                "inventoryGrainBagMovements"
              )
            ),
            getDocs(
              collection(
                db,
                "productsGrainBags"
              )
            )
          ]);

          const productsById = new Map();

          productSnapshot.forEach(docSnap => {
            productsById.set(
              docSnap.id,
              docSnap.data() || {}
            );
          });

          const movementByKey = new Map();

          function keepBetter(existing, candidate){
            if (!existing) return candidate;

            const a =
              existing.updatedAt?.toDate
                ? existing.updatedAt.toDate().getTime()
                : safeNum(existing.updatedAt, 0);

            const b =
              candidate.updatedAt?.toDate
                ? candidate.updatedAt.toDate().getTime()
                : safeNum(candidate.updatedAt, 0);

            return b >= a
              ? candidate
              : existing;
          }

          movementSnapshot.forEach(docSnap => {
            const data = docSnap.data() || {};

            const key =
              makeBagKey(
                data.brand,
                data.diameterFt,
                data.lengthFt
              );

            if (
              !key ||
              key === "||0|0"
            ){
              return;
            }

            movementByKey.set(
              key,
              keepBetter(
                movementByKey.get(key),
                data
              )
            );
          });

          function resolveProductForSku(sku){
            const brand =
              sku?.brand || "";

            const diameterFt =
              safeNum(
                sku?.diameterFt,
                safeNum(
                  sku?.diameter,
                  0
                )
              );

            const lengthFt =
              safeNum(
                sku?.sizeFeet,
                safeNum(
                  sku?.lengthFt,
                  0
                )
              );

            const skuId =
              (sku?.id || "").toString();

            if (
              skuId &&
              productsById.has(skuId)
            ){
              return {
                productId:skuId,
                product:productsById.get(skuId),
                via:"products"
              };
            }

            const key =
              makeBagKey(
                brand,
                diameterFt,
                lengthFt
              );

            const movement =
              movementByKey.get(key);

            if (movement){
              const productId =
                parseDocIdFromRef(
                  movement.productRef
                );

              if (
                productId &&
                productsById.has(productId)
              ){
                return {
                  productId,
                  product:
                    productsById.get(productId),
                  via:"products"
                };
              }
            }

            return {
              productId:"",
              product:null,
              via:"fallback"
            };
          }

          function computeBushels({
            cropType,
            sku,
            counts,
            partialFeet
          }){
            const full =
              safeNum(counts?.full, 0);

            const partialCount =
              safeNum(counts?.partial, 0);

            const resolved =
              resolveProductForSku(
                sku || {}
              );

            const productLength =
              safeNum(
                resolved.product?.lengthFt,
                0
              );

            const eventLength =
              safeNum(
                sku?.sizeFeet,
                safeNum(
                  sku?.lengthFt,
                  0
                )
              );

            const lengthFt =
              productLength > 0
                ? productLength
                : eventLength;

            const cornBuPerBag =
              safeNum(
                resolved.product?.bushels,
                0
              );

            let cornBuPerFoot = 0;

            if (
              cornBuPerBag > 0 &&
              lengthFt > 0
            ){
              cornBuPerFoot =
                cornBuPerBag /
                lengthFt;
            }
            else{
              cornBuPerFoot =
                estimateBuPerFoot(
                  safeNum(
                    sku?.diameterFt,
                    safeNum(
                      sku?.diameter,
                      0
                    )
                  )
                );
            }

            const cropBuPerFoot =
              cornBuPerFoot *
              cropFactorFromCorn(
                cropType
              );

            let partialFeetTotal = 0;

            if (
              Array.isArray(partialFeet) &&
              partialFeet.length
            ){
              partialFeetTotal =
                partialFeet.reduce(
                  (sum, value) =>
                    sum +
                    safeNum(value, 0),
                  0
                );
            }
            else if (
              partialCount > 0 &&
              lengthFt > 0
            ){
              partialFeetTotal =
                partialCount *
                0.5 *
                lengthFt;
            }

            return {
              fullBags:full,
              partialBags:partialCount,
              onHandBu:
                Math.max(
                  0,
                  (
                    full *
                    (
                      cropBuPerFoot *
                      lengthFt
                    )
                  ) +
                  (
                    partialFeetTotal *
                    cropBuPerFoot
                  )
                )
            };
          }

          let totalFull = 0;
          let totalPartial = 0;
          let totalBu = 0;

          eventSnapshot.forEach(docSnap => {
            const event =
              docSnap.data() || {};

            if (
              event.type !== "putDown"
            ){
              return;
            }

            const cropKey =
              cropKeyFromAny(
                event.cropType ||
                event.crop ||
                ""
              );

            if (
              cropFilter &&
              cropFilter !== "all" &&
              cropKey &&
              cropKey !== cropFilter
            ){
              return;
            }

            const counts =
              event.counts || {};

            const full =
              safeNum(counts.full, 0);

            const partial =
              safeNum(counts.partial, 0);

            if (
              full + partial <= 0
            ){
              return;
            }

            const sku =
              event.bagSku || {};

            const partialFeet =
              Array.isArray(event.partialFeet)
                ? event.partialFeet
                : Array.isArray(
                    counts.partialFeet
                  )
                  ? counts.partialFeet
                  : [];

            const bushels =
              computeBushels({
                cropType:
                  event.cropType ||
                  event.crop ||
                  "",
                sku,
                counts,
                partialFeet
              });

            totalFull +=
              bushels.fullBags;

            totalPartial +=
              bushels.partialBags;

            if (
              bushels.onHandBu > 0
            ){
              totalBu +=
                bushels.onHandBu;
            }
          });

          const totalBags =
            totalFull +
            totalPartial;

          bagCountEl.textContent =
            totalBags
              ? fmtInt(totalBags)
              : "—";

          bagBushelsEl.textContent =
            totalBu
              ? `${fmtInt(totalBu)} bu`
              : "— bu";
        }
        catch(err){
          console.error(
            "[grain] bag summary error",
            err
          );

          bagCountEl.textContent = "—";
          bagBushelsEl.textContent = "— bu";
        }
      }

      function refreshAll(){
        loadBinSummary();
        loadBagSummary();
      }

      binSelCrop.addEventListener(
        "change",
        loadBinSummary
      );

      bagSelCrop.addEventListener(
        "change",
        loadBagSummary
      );

      document.addEventListener(
        "fv:grain-perms-ready",
        refreshAll
      );

      document.addEventListener(
        "fv:grain-inventory-posted",
        refreshAll
      );

      refreshAll();
    })();
  </script>

  <noscript>
    <div class="container">
      <div class="card">
        JavaScript is required for Grain Inventory.
      </div>
    </div>
  </noscript>
</body>
</html>
