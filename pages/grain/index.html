<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>

  <title>FarmVista • Grain</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta
    name="theme-color"
    content="#3B7E46"
  />


  <!-- =========================================================
       EARLY THEME BOOT
  ========================================================== -->

  <script src="/Farm-vista/js/theme-boot.js"></script>


  <!-- =========================================================
       APP / PWA
  ========================================================== -->

  <link
    rel="manifest"
    href="/Farm-vista/manifest.webmanifest"
  />

  <link
    rel="apple-touch-icon"
    href="/Farm-vista/assets/icons/apple-touch-icon.png"
  />

  <link
    rel="icon"
    href="/Farm-vista/assets/icons/icon-192.png"
  />


  <!-- =========================================================
       GLOBAL CSS
  ========================================================== -->

  <link
    rel="stylesheet"
    href="/Farm-vista/assets/css/theme.css"
  />

  <link
    rel="stylesheet"
    href="/Farm-vista/assets/css/app.css"
  />


  <!-- =========================================================
       FARMVISTA CORE
  ========================================================== -->

  <script
    src="/Farm-vista/js/version.js"
    defer>
  </script>

  <script
    src="/Farm-vista/js/core.js"
    defer>
  </script>

  <script
    src="/Farm-vista/js/fv-shell.js"
    defer>
  </script>


  <!-- =========================================================
       PAGE STYLES
  ========================================================== -->

  <style>

    .grain-section{
      margin-top:24px;
    }


    .grain-card{
      padding:18px;
    }


    .grain-card h2{
      margin:0 0 6px;
      font-size:1.2rem;
    }


    .grain-card p{
      margin:0;
      color:var(--muted, #6b7280);
      line-height:1.5;
    }


    .grain-placeholder{
      margin-top:16px;
      padding:20px;
      border-radius:12px;
      border:1px dashed rgba(0,0,0,.18);
      text-align:center;
      color:var(--muted, #6b7280);
    }


    @media (prefers-color-scheme: dark){

      .grain-placeholder{
        border-color:rgba(255,255,255,.18);
      }

    }

  </style>

</head>


<body>

  <fv-shell>

    <main class="page container">


      <!-- =====================================================
           PAGE HEADER
      ====================================================== -->

      <h1 class="page-title">
        Grain
      </h1>

      <p class="page-sub">
        Grain inventory and storage overview.
      </p>



      <!-- =====================================================
           GRAIN BIN INVENTORY
      ====================================================== -->

      <section class="grain-section">

        <div class="card grain-card">

          <h2>
            Grain Bin Inventory
          </h2>

          <p>
            Current grain stored in farm bins.
          </p>

          <div class="grain-placeholder">
            Grain bin inventory will appear here.
          </div>

        </div>

      </section>



      <!-- =====================================================
           GRAIN BAG INVENTORY
      ====================================================== -->

      <section class="grain-section">

        <div class="card grain-card">

          <h2>
            Grain Bag Inventory
          </h2>

          <p>
            Current grain stored in grain bags.
          </p>

          <div class="grain-placeholder">
            Grain bag inventory will appear here.
          </div>

        </div>

      </section>


    </main>

  </fv-shell>


  <noscript>

    <div class="container">

      <div class="card">
        JavaScript is required for FarmVista Grain.
      </div>

    </div>

  </noscript>


</body>
</html>
