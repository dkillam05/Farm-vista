<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>FarmVista • Add Grain Ticket</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#3B7E46"/>

  <script src="/Farm-vista/js/theme-boot.js"></script>

  <link rel="manifest" href="/Farm-vista/manifest.webmanifest"/>
  <link rel="apple-touch-icon" href="/Farm-vista/assets/icons/apple-touch-icon.png"/>
  <link rel="icon" href="/Farm-vista/assets/icons/icon-192.png"/>

  <link rel="stylesheet" href="/Farm-vista/assets/css/theme.css"/>
  <link rel="stylesheet" href="/Farm-vista/assets/css/app.css"/>

  <script src="/Farm-vista/js/version.js" defer></script>
  <script src="/Farm-vista/js/core.js" defer></script>
  <script src="/Farm-vista/js/fv-shell.js" defer></script>

  <style>
    .ticket-wrap{
      max-width:900px;
      margin:0 auto;
    }

    .ticket-card{
      background:var(--card-bg, #fff);
      border:1px solid var(--border-color, rgba(0,0,0,.12));
      border-radius:18px;
      padding:clamp(16px,3vw,26px);
      box-shadow:0 2px 12px rgba(0,0,0,.06);
    }

    .ticket-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:16px;
    }

    @media(min-width:700px){
      .ticket-grid.two{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

      .ticket-grid.three{
        grid-template-columns:repeat(3,minmax(0,1fr));
      }
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .field label{
      font-weight:700;
      font-size:.93rem;
    }

    .field input,
    .field select{
      width:100%;
      min-height:48px;
      border-radius:12px;
      border:1px solid var(--border-color, #cfcfcf);
      background:var(--input-bg, #fff);
      color:inherit;
      padding:10px 12px;
      font-size:16px;
      box-sizing:border-box;
    }

    .field input:focus,
    .field select:focus{
      outline:2px solid rgba(59,126,70,.30);
      border-color:#3B7E46;
    }

    .section-title{
      margin:24px 0 12px;
      font-size:1.08rem;
      font-weight:800;
    }

    .section-title:first-child{
      margin-top:0;
    }

    .weight-check{
      margin-top:10px;
      padding:10px 12px;
      border-radius:10px;
      font-size:.92rem;
      display:none;
    }

    .weight-check.good{
      display:block;
      background:rgba(59,126,70,.12);
    }

    .weight-check.bad{
      display:block;
      background:rgba(190,40,40,.12);
    }

    .driver-box{
      padding:12px 14px;
      border-radius:12px;
      background:rgba(59,126,70,.08);
      font-size:.95rem;
    }

    .actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:26px;
    }

    .btn{
      border:0;
      border-radius:12px;
      min-height:48px;
      padding:0 20px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
    }

    .btn-primary{
      background:#3B7E46;
      color:#fff;
      flex:1;
    }

    .btn-secondary{
      background:var(--card-bg, #fff);
      color:inherit;
      border:1px solid var(--border-color, #ccc);
    }

    .required{
      color:#b42318;
    }
  </style>
</head>

<body>
  <fv-shell>
    <div class="page container ticket-wrap">

      <h1 class="page-title">Add Grain Ticket</h1>
      <p class="page-sub">
        Enter the information exactly as shown on the grain ticket.
      </p>

      <form id="grainTicketForm" class="ticket-card" autocomplete="off">

        <!-- =========================
             BUYER / CUSTOMER
        ========================== -->

        <div class="section-title">Ticket Information</div>

        <div class="ticket-grid two">

          <div class="field">
            <label for="buyer">
              Buyer <span class="required">*</span>
            </label>
            <select id="buyer" required>
              <option value="">Select buyer</option>
            </select>
          </div>

          <div class="field">
            <label for="deliveryLocation">
              Delivery Location
            </label>
            <select id="deliveryLocation" disabled>
              <option value="">Select delivery location</option>
            </select>
          </div>

          <div class="field">
            <label for="customerVendor">
              Customer / Vendor
            </label>
            <input
              id="customerVendor"
              type="text"
              placeholder="Example: John C Dowson"
            />
          </div>

          <div class="field">
            <label for="ticketNumber">
              Ticket Number <span class="required">*</span>
            </label>
            <input
              id="ticketNumber"
              type="text"
              inputmode="numeric"
              required
            />
          </div>

          <div class="field">
            <label for="crop">
              Crop <span class="required">*</span>
            </label>
            <select id="crop" required>
              <option value="">Select crop</option>
              <option value="Corn">Corn</option>
              <option value="Soybeans">Soybeans</option>
              <option value="Wheat">Wheat</option>
            </select>
          </div>

          <div class="field">
            <label for="ticketDate">
              Ticket Date <span class="required">*</span>
            </label>
            <input
              id="ticketDate"
              type="date"
              required
            />
          </div>

        </div>


        <!-- =========================
             WEIGHTS
        ========================== -->

        <div class="section-title">Weights</div>

        <div class="ticket-grid three">

          <div class="field">
            <label for="grossWeight">
              Gross Weight <span class="required">*</span>
            </label>
            <input
              id="grossWeight"
              type="text"
              inputmode="numeric"
              placeholder="0"
              required
            />
          </div>

          <div class="field">
            <label for="tareWeight">
              Empty / Tare Weight <span class="required">*</span>
            </label>
            <input
              id="tareWeight"
              type="text"
              inputmode="numeric"
              placeholder="0"
              required
            />
          </div>

          <div class="field">
            <label for="netWeight">
              Net Weight <span class="required">*</span>
            </label>
            <input
              id="netWeight"
              type="text"
              inputmode="numeric"
              placeholder="0"
              required
            />
          </div>

        </div>

        <div id="weightCheck" class="weight-check"></div>


        <!-- =========================
             GRADE FACTORS
        ========================== -->

        <div class="section-title">Grade Factors</div>

        <div class="ticket-grid two">

          <div class="field">
            <label for="testWeight">
              Test Weight (TW)
            </label>
            <input
              id="testWeight"
              type="number"
              step="0.01"
              inputmode="decimal"
            />
          </div>

          <div class="field">
            <label for="moisture">
              Moisture (MO)
            </label>
            <input
              id="moisture"
              type="number"
              step="0.01"
              inputmode="decimal"
            />
          </div>

          <div class="field">
            <label for="damage">
              Damage (DM)
            </label>
            <input
              id="damage"
              type="number"
              step="0.01"
              inputmode="decimal"
            />
          </div>

          <div class="field">
            <label for="foreignMaterial">
              Foreign Material / BCFM
            </label>
            <input
              id="foreignMaterial"
              type="number"
              step="0.01"
              inputmode="decimal"
            />
          </div>

        </div>


        <!-- =========================
             BUSHELS
        ========================== -->

        <div class="section-title">Bushels</div>

        <div class="ticket-grid two">

          <div class="field">
            <label for="netBushels">
              Net Bushels <span class="required">*</span>
            </label>
            <input
              id="netBushels"
              type="number"
              step="0.01"
              inputmode="decimal"
              required
            />
          </div>

        </div>


        <!-- =========================
             DRIVER
        ========================== -->

        <div class="section-title">Driver</div>

        <div class="driver-box">
          <strong>Driver:</strong>
          <span id="driverName">Loading signed-in user...</span>
        </div>


        <!-- =========================
             ACTIONS
        ========================== -->

        <div class="actions">

          <button
            type="button"
            class="btn btn-secondary"
            id="cancelBtn">
            Cancel
          </button>

          <button
            type="submit"
            class="btn btn-primary"
            id="saveBtn">
            Save Ticket
          </button>

        </div>

      </form>

    </div>
  </fv-shell>

  <noscript>
    <div class="container">
      <div class="card">JavaScript is required for Grain Tickets.</div>
    </div>
  </noscript>


  <script>
    (function(){
      "use strict";

      const form = document.getElementById("grainTicketForm");

      const grossInput = document.getElementById("grossWeight");
      const tareInput  = document.getElementById("tareWeight");
      const netInput   = document.getElementById("netWeight");

      const weightCheck = document.getElementById("weightCheck");

      const cancelBtn = document.getElementById("cancelBtn");
      const saveBtn   = document.getElementById("saveBtn");


      /* =========================================
         NUMBER HELPERS
      ========================================== */

      function cleanNumber(value){
        if(value === null || value === undefined) return null;

        const cleaned = String(value)
          .replace(/,/g, "")
          .replace(/[^\d.-]/g, "");

        if(cleaned === "") return null;

        const number = Number(cleaned);

        return Number.isFinite(number) ? number : null;
      }


      function formatWholeNumber(value){
        const number = cleanNumber(value);

        if(number === null) return "";

        return Math.round(number).toLocaleString("en-US");
      }


      function handleWeightBlur(input){
        const number = cleanNumber(input.value);

        if(number !== null){
          input.value = formatWholeNumber(number);
        }

        checkWeights();
      }


      grossInput.addEventListener("blur", ()=>{
        handleWeightBlur(grossInput);
      });

      tareInput.addEventListener("blur", ()=>{
        handleWeightBlur(tareInput);
      });

      netInput.addEventListener("blur", ()=>{
        handleWeightBlur(netInput);
      });


      /* =========================================
         WEIGHT VALIDATION
      ========================================== */

      function checkWeights(){

        const gross = cleanNumber(grossInput.value);
        const tare  = cleanNumber(tareInput.value);
        const net   = cleanNumber(netInput.value);

        weightCheck.className = "weight-check";
        weightCheck.textContent = "";

        if(gross === null || tare === null || net === null){
          return true;
        }

        const calculatedNet = gross - tare;

        if(calculatedNet === net){

          weightCheck.classList.add("good");

          weightCheck.textContent =
            "✓ Weight check passed — Gross minus Empty equals Net.";

          return true;
        }

        weightCheck.classList.add("bad");

        weightCheck.textContent =
          "Weight check failed. Gross minus Empty equals " +
          calculatedNet.toLocaleString("en-US") +
          " lb, but Net Weight is " +
          net.toLocaleString("en-US") +
          " lb.";

        return false;
      }


      /* =========================================
         CANCEL
      ========================================== */

      cancelBtn.addEventListener("click", ()=>{
        window.location.href =
          "/Farm-vista/pages/grain/grain-tickets.html";
      });


      /* =========================================
         TEMPORARY SUBMIT

         Firestore wiring comes next.
      ========================================== */

      form.addEventListener("submit", (event)=>{

        event.preventDefault();

        if(!form.reportValidity()){
          return;
        }

        if(!checkWeights()){
          alert(
            "Gross Weight minus Empty/Tare Weight must equal Net Weight."
          );
          return;
        }

        const ticket = {

          buyerId:
            document.getElementById("buyer").value || null,

          deliveryLocationId:
            document.getElementById("deliveryLocation").value || null,

          customerVendor:
            document.getElementById("customerVendor").value.trim() || null,

          ticketNumber:
            document.getElementById("ticketNumber").value.trim(),

          crop:
            document.getElementById("crop").value,

          ticketDate:
            document.getElementById("ticketDate").value,

          grossWeight:
            cleanNumber(grossInput.value),

          tareWeight:
            cleanNumber(tareInput.value),

          netWeight:
            cleanNumber(netInput.value),

          testWeight:
            cleanNumber(
              document.getElementById("testWeight").value
            ),

          moisture:
            cleanNumber(
              document.getElementById("moisture").value
            ),

          damage:
            cleanNumber(
              document.getElementById("damage").value
            ),

          foreignMaterial:
            cleanNumber(
              document.getElementById("foreignMaterial").value
            ),

          netBushels:
            cleanNumber(
              document.getElementById("netBushels").value
            )

        };

        console.log("[FarmVista] Grain Ticket:", ticket);

        alert(
          "Form is working. Next we will connect this to Firestore."
        );

      });

    })();
  </script>

</body>
</html>
