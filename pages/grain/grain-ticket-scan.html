<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>FarmVista • Grain Ticket Scan</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center}.fv-loader{text-align:center;padding:24px}.fv-spin{width:38px;height:38px;margin:0 auto 14px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:fvspin .8s linear infinite}@keyframes fvspin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="fv-loader"><div class="fv-spin"></div><div>Opening Grain Ticket Scanner…</div></div>
  <script>
  (() => {
    'use strict';

    const CORE_URL = '/pages/grain/grain-ticket-scan-core.html?v=20260911-3';

    function replaceRequired(text, oldValue, newValue, label) {
      if (!text.includes(oldValue)) throw new Error(`Scanner patch marker missing: ${label}`);
      return text.replace(oldValue, newValue);
    }

    async function boot() {
      const response = await fetch(CORE_URL, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Scanner core request failed (${response.status})`);
      let html = await response.text();

      const landscapeCss = `

/* ============================================================
   LANDSCAPE CAMERA LAYOUT
============================================================ */
@media (orientation: landscape) and (max-height: 700px) {
  .camera-page {
    display:flex !important;
    flex-direction:column !important;
    width:100vw !important;
    height:100dvh !important;
    overflow:hidden !important;
  }
  .camera-header {
    position:relative !important;
    flex:0 0 auto !important;
    width:100% !important;
    min-height:0 !important;
    box-sizing:border-box !important;
    padding:calc(env(safe-area-inset-top,0px) + 2px) calc(env(safe-area-inset-right,0px) + 16px) 2px calc(env(safe-area-inset-left,0px) + 16px) !important;
    background:#000 !important;
  }
  .camera-title{font-size:15px !important;line-height:1.05 !important;margin:0 !important}
  .camera-subtitle{font-size:10px !important;line-height:1.05 !important;margin-top:1px !important}
  .close-btn{padding:5px 8px !important;font-size:15px !important}
  .camera-view {
    position:relative !important;
    inset:auto !important;
    flex:1 1 auto !important;
    min-height:0 !important;
    width:100vw !important;
    max-width:none !important;
    height:auto !important;
    margin:0 !important;
    padding:0 !important;
    overflow:hidden !important;
  }
  .ticket-frame {
    position:absolute !important;
    left:50vw !important;
    right:auto !important;
    top:50% !important;
    bottom:auto !important;
    margin:0 !important;
    transform:translate(-50%,-50%) !important;
    width:min(70vw,900px) !important;
    height:min(92%,470px) !important;
    max-width:calc(100vw - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px) - 110px) !important;
    max-height:calc(100% - 14px) !important;
    box-sizing:border-box !important;
    border:3px solid #fff !important;
    border-radius:12px !important;
    box-shadow:0 0 0 1px rgba(0,0,0,.18) !important;
  }
  .ticket-frame.good,.ticket-frame.ready,.ticket-frame.focus-good,.ticket-frame.is-good,.ticket-frame[data-ready="true"]{border-color:#fff !important}
  .camera-tip{display:none !important;visibility:hidden !important;opacity:0 !important;pointer-events:none !important}
  .camera-footer {
    position:relative !important;
    left:auto !important;
    right:auto !important;
    bottom:auto !important;
    flex:0 0 auto !important;
    width:100% !important;
    box-sizing:border-box !important;
    min-height:62px !important;
    padding:4px calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 4px) calc(env(safe-area-inset-left,0px) + 16px) !important;
    background:#000 !important;
  }
  .capture-btn{width:52px !important;height:52px !important;border-width:3px !important}
  .capture-btn::before{width:40px !important;height:40px !important}
  .torch-btn,.fallback-btn{padding:6px 10px !important;font-size:10px !important}
}
`;
      html = replaceRequired(html, '</style>', landscapeCss + '\n</style>', 'landscape camera layout');

      const oldAlias = `  if (\n    ocrName\n  ) {\n\n    const alias =\n      findLearnedAlias(\n        "customer",\n        ocrName\n      );\n\n\n    if (\n      alias?.targetId\n    ) {\n\n      const customer =\n        candidates.find(\n          item =>\n            item.id ===\n            alias.targetId\n        );\n\n\n      if (\n        customer\n      ) {\n\n        return {\n          matched:\n            true,\n\n          matchType:\n            "learned_alias",\n\n          customer\n        };\n\n      }\n\n    }\n\n  }\n`;
      const newAlias = `  /* Learned Sold Under aliases prefer the elevator customer/account ID. */\n  const learnedCustomerAlias =\n    (ocrAccount ? findLearnedAlias("customer", ocrAccount) : null) ||\n    (ocrName ? findLearnedAlias("customer", ocrName) : null);\n\n  if (learnedCustomerAlias?.targetId) {\n    const customer = candidates.find(item => String(item.id) === String(learnedCustomerAlias.targetId));\n    if (customer) {\n      return { matched:true, matchType:"learned_alias", customer };\n    }\n  }\n`;
      html = replaceRequired(html, oldAlias, newAlias, 'customer alias lookup');

      const oldHaulingJobCustomerId = `function haulingJobCustomerId(\n  job\n) {\n\n  return String(\n    job?.customerId ||\n    job?.grainCustomerId ||\n    ""\n  ).trim();\n\n}\n`;
      const newHaulingJobCustomerId = `function haulingJobCustomerId(\n  job\n) {\n\n  return String(\n    job?.customerId ||\n    job?.soldUnderId ||\n    job?.grainCustomerId ||\n    ""\n  ).trim();\n\n}\n`;
      html = replaceRequired(html, oldHaulingJobCustomerId, newHaulingJobCustomerId, 'hauling job sold under id normalization');

      const oldKnownJobCustomerMarker = `  if (\n    haulingJob?.id\n  ) {\n\n    contracts.forEach(\n`;
      const newKnownJobCustomerMarker = `  if (\n    haulingJob?.id\n  ) {\n\n    const directHaulingJobCustomerId = haulingJobCustomerId(haulingJob);\n    if (directHaulingJobCustomerId) {\n      ids.add(directHaulingJobCustomerId);\n    }\n\n    contracts.forEach(\n`;
      html = replaceRequired(html, oldKnownJobCustomerMarker, newKnownJobCustomerMarker, 'driver assist direct hauling job sold under');

      const oldCandidateReturn = `  return ids;\n\n}\n\n\nfunction findCustomerBlockClues(\n`;
      const newCandidateReturn = `  haulingJobs\n    .filter(haulingJobIsActive)\n    .forEach(job => {\n      const jobCrop = normalizeMatchText(job?.crop || job?.commodity);\n      if (crop && jobCrop && crop !== jobCrop) return;\n\n      const jobLocationId = String(job?.deliveryLocationId || job?.locationId || job?.destinationId || "").trim();\n      if (locationId && jobLocationId && jobLocationId !== locationId) return;\n\n      const jobBuyerId = String(job?.buyerId || job?.grainBuyerId || job?.elevatorId || "").trim();\n      if (buyerId && jobBuyerId && jobBuyerId !== buyerId) return;\n\n      const jobCustomerId = haulingJobCustomerId(job);\n      if (jobCustomerId) ids.add(jobCustomerId);\n    });\n\n  return ids;\n\n}\n\n\nfunction findCustomerBlockClues(\n`;
      html = replaceRequired(html, oldCandidateReturn, newCandidateReturn, 'simple hauling job sold under customer candidates');

      const oldSoldUnderJobFilter = `  /*\n    Sold Under and Hauling Job work in both directions.\n    Once Sold Under is known, keep only jobs with an OPEN linked\n    contract for that customer and crop.\n  */\n  if (customerId) {\n    matches =\n      matches.filter(\n        job =>\n          contracts.some(\n            contract => {\n              if (!contractIsAvailableForDriverAssist(contract)) {\n                return false;\n              }\n\n              const contractJobId =\n                String(\n                  contract?.haulingJobId ||\n                  ""\n                ).trim();\n\n              const contractCustomerId =\n                String(\n                  firstExistingValue(\n                    contract,\n                    ["customerId", "grainCustomerId"]\n                  ) ||\n                  ""\n                ).trim();\n\n              const contractCrop =\n                normalizeScannedCrop(\n                  firstExistingValue(\n                    contract,\n                    ["crop", "commodity"]\n                  )\n                );\n\n              const contractLocationId =\n                String(\n                  firstExistingValue(\n                    contract,\n                    [\n                      "deliveryLocationId",\n                      "locationId",\n                      "destinationId"\n                    ]\n                  ) ||\n                  ""\n                ).trim();\n\n              const contractBuyerId =\n                String(\n                  firstExistingValue(\n                    contract,\n                    ["buyerId", "elevatorId"]\n                  ) ||\n                  ""\n                ).trim();\n\n              return (\n                contractJobId === String(job.id || "").trim() &&\n                contractCustomerId === customerId &&\n                (!contractCrop || contractCrop === crop) &&\n                (\n                  !matchedLocationId ||\n                  !contractLocationId ||\n                  contractLocationId === matchedLocationId\n                ) &&\n                (\n                  !matchedBuyerId ||\n                  !contractBuyerId ||\n                  contractBuyerId === matchedBuyerId\n                )\n              );\n            }\n          )\n      );\n  }\n`;
      const newSoldUnderJobFilter = `  /* Sold Under can come directly from the hauling job (simple) or a linked contract (detailed). */\n  if (customerId) {\n    matches = matches.filter(job => {\n      const directJobCustomerId = haulingJobCustomerId(job);\n      if (directJobCustomerId && directJobCustomerId === customerId) return true;\n\n      return contracts.some(contract => {\n        if (!contractIsAvailableForDriverAssist(contract)) return false;\n\n        const contractJobId = String(contract?.haulingJobId || "").trim();\n        const contractCustomerId = String(firstExistingValue(contract,["customerId","grainCustomerId"]) || "").trim();\n        const contractCrop = normalizeScannedCrop(firstExistingValue(contract,["crop","commodity"]));\n        const contractLocationId = String(firstExistingValue(contract,["deliveryLocationId","locationId","destinationId"]) || "").trim();\n        const contractBuyerId = String(firstExistingValue(contract,["buyerId","elevatorId"]) || "").trim();\n\n        return (\n          contractJobId === String(job.id || "").trim() &&\n          contractCustomerId === customerId &&\n          (!contractCrop || contractCrop === crop) &&\n          (!matchedLocationId || !contractLocationId || contractLocationId === matchedLocationId) &&\n          (!matchedBuyerId || !contractBuyerId || contractBuyerId === matchedBuyerId)\n        );\n      });\n    });\n  }\n`;
      html = replaceRequired(html, oldSoldUnderJobFilter, newSoldUnderJobFilter, 'sold under hauling-job matching');

      const oldAutoJob = `function automaticHaulingJobForTicket(\n  grainTicket,\n  customer = null,\n  locationOverride = null,\n  buyerOverride = null\n) {\n  const matches =\n    matchingActiveHaulingJobsForTicket(\n      grainTicket,\n      customer,\n      locationOverride,\n      buyerOverride\n    );\n\n  return matches.length === 1\n    ? matches[0]\n    : null;\n}\n`;
      const newAutoJob = `function haulingJobCreatedMillis(job) {\n  const created = job?.createdAt || job?.created || null;\n  if (created?.toMillis) return created.toMillis();\n  if (created?.toDate) return created.toDate().getTime();\n  const parsed = new Date(created || 0).getTime();\n  return Number.isFinite(parsed) ? parsed : Number.MAX_SAFE_INTEGER;\n}\n\nfunction haulingJobOldestFirst(a,b) {\n  const aStart = normalizedTicketDateISO(a?.deliveryStartDate || a?.startDate) || "9999-12-31";\n  const bStart = normalizedTicketDateISO(b?.deliveryStartDate || b?.startDate) || "9999-12-31";\n  if (aStart !== bStart) return aStart.localeCompare(bStart);\n  const createdDifference = haulingJobCreatedMillis(a) - haulingJobCreatedMillis(b);\n  if (createdDifference) return createdDifference;\n  return String(a?.id || "").localeCompare(String(b?.id || ""));\n}\n\nfunction automaticHaulingJobForTicket(\n  grainTicket,\n  customer = null,\n  locationOverride = null,\n  buyerOverride = null\n) {\n  if (!customer?.id) return null;\n\n  const matches = matchingActiveHaulingJobsForTicket(\n    grainTicket,\n    customer,\n    locationOverride,\n    buyerOverride\n  );\n\n  const oldest = [...matches].sort(haulingJobOldestFirst)[0] || null;\n\n  if (oldest) {\n    console.log("[Grain Ticket] Auto-assigned oldest matching hauling job:",{\n      ticketNumber:grainTicket?.ticketNumber || null,\n      haulingJobId:oldest.id,\n      remainingBefore:haulingJobRemainingBushels(oldest),\n      ticketBushels:Number(grainTicket?.netBushels || 0) || 0,\n      matchingJobCount:matches.length\n    });\n  }\n\n  return oldest;\n}\n`;
      html = replaceRequired(html, oldAutoJob, newAutoJob, 'oldest hauling-job auto assignment');

      const assistMarker = `async function runDriverAssistQuestions(\n  grainTicket,\n  ocrResult,\n  matching\n) {`;
      const aliasHelpers = `function customerAliasEvidence(grainTicket) {\n  return Array.from(new Set([\n    String(grainTicket?.customerAccountText || "").trim(),\n    String(grainTicket?.customerText || "").trim()\n  ].filter(Boolean)));\n}\n\nasync function saveDriverCustomerAliases(grainTicket,customer) {\n  if (!customer?.id) return;\n  const targetId = String(customer.id);\n  const targetName = getCustomerName(customer);\n\n  for (const ocrText of customerAliasEvidence(grainTicket)) {\n    const normalizedText = normalizeAliasText(ocrText);\n    if (!normalizedText) continue;\n\n    const aliasId = `customer_${normalizedText}`.replace(/[^a-z0-9_-]+/g,"_").slice(0,180);\n    const payload = {\n      type:"customer",ocrText,normalizedText,targetId,targetName:targetName || null,\n      source:"driver_confirmation",active:true,updatedAt:serverTimestamp()\n    };\n\n    try {\n      await setDoc(doc(db,ALIAS_COLLECTION,aliasId),payload,{merge:true});\n      const existingIndex = ocrAliases.findIndex(alias =>\n        String(alias.type || "") === "customer" &&\n        normalizeAliasText(alias.normalizedText || alias.ocrText) === normalizedText\n      );\n      const localAlias = {id:aliasId,...payload};\n      if (existingIndex >= 0) ocrAliases[existingIndex] = localAlias;\n      else ocrAliases.push(localAlias);\n    } catch (error) {\n      console.warn("[Grain Ticket] Could not save Sold Under alias:",error);\n    }\n  }\n}\n\n`;
      html = replaceRequired(html, assistMarker, aliasHelpers + assistMarker, 'driver assist insertion');

      const oldCustomerBranch = `    if (eligibleCustomers.length === 1) {\n      customer = eligibleCustomers[0];\n    }\n    else if (eligibleCustomers.length > 1) {\n      const selectedCustomer =\n`;
      const newCustomerBranch = `    const eligibleCustomerIds = new Set(eligibleCustomers.map(item => String(item.id)));\n    const soldUnderCustomers = [\n      ...eligibleCustomers,\n      ...customers.filter(item => !eligibleCustomerIds.has(String(item.id)))\n    ];\n\n    if (soldUnderCustomers.length) {\n      const selectedCustomer =\n`;
      html = replaceRequired(html, oldCustomerBranch, newCustomerBranch, 'sold under verification branch');
      html = replaceRequired(html, '            ...eligibleCustomers.map(\n', '            ...soldUnderCustomers.map(\n', 'sold under customer list');
      html = html.replace('              : `Choose the Sold Under customer for this ${grainTicket.crop} delivery.`,', '              : `OCR could not confidently link the Sold Under customer. Choose who this ${grainTicket.crop} load is sold under.`,' );

      const correctionBlock = `        ocrResult.manualCorrections = {\n          ...(ocrResult.manualCorrections || {}),\n          customer: {\n            originalValue: originalEvidence || null,\n            selectedId: selectedCustomer.id,\n            selectedValue: getCustomerName(selectedCustomer),\n            source: "driver_selection",\n            learningEligible: Boolean(originalEvidence),\n            learningReason:\n              originalEvidence\n                ? "ocr_evidence_confirmed"\n                : "driver_supplied_missing_value"\n          }\n        };\n`;
      html = replaceRequired(html, correctionBlock, correctionBlock + `\n        await saveDriverCustomerAliases(grainTicket,selectedCustomer);\n`, 'sold under alias learning');

      /*
        FINAL SAVE-TIME SAFETY NET
        The scanner can have all five pieces correct in memory (crop,
        destination, Sold Under, source, buyer) but still carry a stale
        hauling_job_not_auto_assigned result from an earlier pass. Re-run
        the hauling-job resolver immediately before duplicate check/save so
        the Firestore ticket itself receives haulingJobId on the first save.
      */
      const oldPostAssist = `  matching =\n    await runDriverAssistQuestions(\n      grainTicket,\n      ocrResult,\n      matching\n    );\n\n\n  /*\n    DUPLICATE PROTECTION\n`;
      const newPostAssist = `  matching =\n    await runDriverAssistQuestions(\n      grainTicket,\n      ocrResult,\n      matching\n    );\n\n\n  if (\n    !matching?.haulingJob &&\n    matching?.grainSource &&\n    matching?.customerMatch?.customer?.id &&\n    matching?.locationMatch?.location?.id &&\n    matching?.buyerMatch?.buyer?.id\n  ) {\n    const finalHaulingJob =\n      automaticHaulingJobForTicket(\n        grainTicket,\n        matching.customerMatch.customer,\n        matching.locationMatch.location,\n        matching.buyerMatch.buyer\n      );\n\n    if (finalHaulingJob) {\n      const remainingReasons =\n        (Array.isArray(matching.reviewReasons) ? matching.reviewReasons : [])\n          .filter(reason =>\n            reason !== "hauling_job_not_assigned" &&\n            reason !== "hauling_job_not_auto_assigned"\n          );\n\n      matching =\n        rebuildMatchingAfterDriverAssist(\n          grainTicket,\n          finalHaulingJob,\n          matching.locationMatch.location,\n          matching.buyerMatch.buyer,\n          matching.customerMatch.customer,\n          matching.grainSource,\n          matching,\n          remainingReasons\n        );\n\n      ocrResult.driverContext = {\n        ...(ocrResult.driverContext || {}),\n        haulingJob: {\n          id: finalHaulingJob.id,\n          name: haulingJobDisplayLabel(finalHaulingJob).label,\n          source: "final_save_reconciliation"\n        }\n      };\n\n      console.log("[Grain Ticket] Final save-time hauling job reconciliation:",{\n        ticketNumber:grainTicket?.ticketNumber || null,\n        haulingJobId:finalHaulingJob.id,\n        validationStatus:matching.validationStatus\n      });\n    }\n  }\n\n\n  /*\n    DUPLICATE PROTECTION\n`;
      html = replaceRequired(html, oldPostAssist, newPostAssist, 'final save hauling job reconciliation');

      const landscapeRuntime = `
<script>
(() => {
  const applyLandscapeTipRule = () => {
    const tip = document.querySelector('.camera-tip');
    if (!tip) return;
    if (window.innerWidth > window.innerHeight) {
      tip.style.setProperty('display','none','important');
      tip.style.setProperty('visibility','hidden','important');
      tip.style.setProperty('opacity','0','important');
      tip.setAttribute('aria-hidden','true');
    } else {
      tip.style.removeProperty('display');
      tip.style.removeProperty('visibility');
      tip.style.removeProperty('opacity');
      tip.removeAttribute('aria-hidden');
    }
  };
  applyLandscapeTipRule();
  window.addEventListener('resize',applyLandscapeTipRule,{passive:true});
  window.addEventListener('orientationchange',()=>setTimeout(applyLandscapeTipRule,100),{passive:true});
})();
<\/script>`;
      html = replaceRequired(html, '</body>', landscapeRuntime + '\n</body>', 'landscape helper runtime');

      document.open();
      document.write(html);
      document.close();
    }

    boot().catch(error => {
      console.error('[FarmVista] Grain ticket scanner could not start:', error);
      document.body.innerHTML = '<div class="fv-loader"><strong>Grain Ticket Scanner could not start.</strong><br><br>Please close this screen and try again.</div>';
    });
  })();
  </script>
</body>
</html>
