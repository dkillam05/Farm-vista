<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>FarmVista • Grain Ticket Scan</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center}.fv-loader{text-align:center;padding:24px}.fv-spin{width:38px;height:38px;margin:0 auto 14px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:fvspin .8s linear infinite}@keyframes fvspin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="fv-loader"><div class="fv-spin"></div><div>Opening Grain Ticket Scanner…</div></div>
  <script>
  (() => {
    'use strict';

    const CORE_URL = '/pages/grain/grain-ticket-scan-core.html?v=20260909-4';

    function replaceRequired(text, oldValue, newValue, label) {
      if (!text.includes(oldValue)) throw new Error(`Scanner patch marker missing: ${label}`);
      return text.replace(oldValue, newValue);
    }

    async function boot() {
      const response = await fetch(CORE_URL, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Scanner core request failed (${response.status})`);
      let html = await response.text();

      html = replaceRequired(
        html,
        '/js/grain-ticket-ocr-grade-normalizer.js?v=20260909-5',
        '/js/grain-ticket-ocr-grade-normalizer.js?v=20260909-5',
        'grade normalizer version'
      );

      const oldAlias = `  if (\n    ocrName\n  ) {\n\n    const alias =\n      findLearnedAlias(\n        "customer",\n        ocrName\n      );\n\n\n    if (\n      alias?.targetId\n    ) {\n\n      const customer =\n        candidates.find(\n          item =>\n            item.id ===\n            alias.targetId\n        );\n\n\n      if (\n        customer\n      ) {\n\n        return {\n          matched:\n            true,\n\n          matchType:\n            "learned_alias",\n\n          customer\n        };\n\n      }\n\n    }\n\n  }\n`;

      const newAlias = `  /* Learned Sold Under aliases prefer the elevator customer/account ID. */\n  const learnedCustomerAlias =\n    (ocrAccount ? findLearnedAlias("customer", ocrAccount) : null) ||\n    (ocrName ? findLearnedAlias("customer", ocrName) : null);\n\n\n  if (\n    learnedCustomerAlias?.targetId\n  ) {\n\n    const customer =\n      candidates.find(\n        item =>\n          String(item.id) ===\n            String(learnedCustomerAlias.targetId)\n      );\n\n\n    if (\n      customer\n    ) {\n\n      return {\n        matched:\n          true,\n\n        matchType:\n          "learned_alias",\n\n        customer\n      };\n\n    }\n\n  }\n`;

      html = replaceRequired(html, oldAlias, newAlias, 'customer alias lookup');

      const assistMarker = `async function runDriverAssistQuestions(\n  grainTicket,\n  ocrResult,\n  matching\n) {`;

      const aliasHelpers = `function customerAliasEvidence(\n  grainTicket\n) {\n\n  return Array.from(\n    new Set(\n      [\n        String(grainTicket?.customerAccountText || "").trim(),\n        String(grainTicket?.customerText || "").trim()\n      ].filter(Boolean)\n    )\n  );\n\n}\n\n\nasync function saveDriverCustomerAliases(\n  grainTicket,\n  customer\n) {\n\n  if (!customer?.id) return;\n\n  const targetId = String(customer.id);\n  const targetName = getCustomerName(customer);\n\n  for (const ocrText of customerAliasEvidence(grainTicket)) {\n    const normalizedText = normalizeAliasText(ocrText);\n    if (!normalizedText) continue;\n\n    const aliasId =\n      \`customer_\${normalizedText}\`\n        .replace(/[^a-z0-9_-]+/g, "_")\n        .slice(0, 180);\n\n    const payload = {\n      type: "customer",\n      ocrText,\n      normalizedText,\n      targetId,\n      targetName: targetName || null,\n      source: "driver_confirmation",\n      active: true,\n      updatedAt: serverTimestamp()\n    };\n\n    try {\n      await setDoc(\n        doc(db, ALIAS_COLLECTION, aliasId),\n        payload,\n        { merge: true }\n      );\n\n      const existingIndex = ocrAliases.findIndex(\n        alias =>\n          String(alias.type || "") === "customer" &&\n          normalizeAliasText(alias.normalizedText || alias.ocrText) === normalizedText\n      );\n\n      const localAlias = { id: aliasId, ...payload };\n      if (existingIndex >= 0) ocrAliases[existingIndex] = localAlias;\n      else ocrAliases.push(localAlias);\n\n      console.log("[Grain Ticket] Learned Sold Under alias:", { ocrText, targetId, targetName });\n    }\n    catch (error) {\n      /* Learning must never prevent the driver's ticket from saving. */\n      console.warn("[Grain Ticket] Could not save Sold Under alias:", error);\n    }\n  }\n}\n\n\n`;

      html = replaceRequired(html, assistMarker, aliasHelpers + assistMarker, 'driver assist insertion');

      const oldCustomerBranch = `    if (eligibleCustomers.length === 1) {\n      customer = eligibleCustomers[0];\n    }\n    else if (eligibleCustomers.length > 1) {\n      const selectedCustomer =\n`;

      const newCustomerBranch = `    const eligibleCustomerIds =\n      new Set(\n        eligibleCustomers.map(\n          item => String(item.id)\n        )\n      );\n\n    /*\n      If OCR cannot confidently link Sold Under, the driver verifies it.\n      Contract-valid customers are listed first, followed by every existing\n      FarmVista customer. No customer creation is available here.\n    */\n    const soldUnderCustomers = [\n      ...eligibleCustomers,\n      ...customers.filter(\n        item => !eligibleCustomerIds.has(String(item.id))\n      )\n    ];\n\n    if (soldUnderCustomers.length) {\n      const selectedCustomer =\n`;

      html = replaceRequired(html, oldCustomerBranch, newCustomerBranch, 'sold under verification branch');
      html = replaceRequired(
        html,
        '            ...eligibleCustomers.map(\n',
        '            ...soldUnderCustomers.map(\n',
        'sold under customer list'
      );
      html = html.replace(
        '              : `Choose the Sold Under customer for this ${grainTicket.crop} delivery.`,',
        '              : `OCR could not confidently link the Sold Under customer. Choose who this ${grainTicket.crop} load is sold under.`,',
      );

      const correctionBlock = `        ocrResult.manualCorrections = {\n          ...(ocrResult.manualCorrections || {}),\n          customer: {\n            originalValue: originalEvidence || null,\n            selectedId: selectedCustomer.id,\n            selectedValue: getCustomerName(selectedCustomer),\n            source: "driver_selection",\n            learningEligible: Boolean(originalEvidence),\n            learningReason:\n              originalEvidence\n                ? "ocr_evidence_confirmed"\n                : "driver_supplied_missing_value"\n          }\n        };\n`;

      html = replaceRequired(
        html,
        correctionBlock,
        correctionBlock + `\n        await saveDriverCustomerAliases(\n          grainTicket,\n          selectedCustomer\n        );\n`,
        'sold under alias learning'
      );

      document.open();
      document.write(html);
      document.close();
    }

    boot().catch(error => {
      console.error('[FarmVista] Grain ticket scanner could not start:', error);
      document.body.innerHTML = '<div class="fv-loader"><strong>Grain Ticket Scanner could not start.</strong><br><br>Please close this screen and try again.</div>';
    });
  })();
  </script>
</body>
</html>
