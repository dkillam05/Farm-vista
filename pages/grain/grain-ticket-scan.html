<!doctype html>

<body>
  <div class="fv-loader"><div class="fv-spin"></div><div>Opening Grain Ticket Scanner…</div></div>
  <script>
  (() => {
    'use strict';

    const CORE_URL = '/pages/grain/grain-ticket-scan-core.html?v=20260911-4';

    function replaceRequired(text, oldValue, newValue, label) {
      if (!text.includes(oldValue)) throw new Error(`Scanner patch marker missing: ${label}`);
      return text.replace(oldValue, newValue);
    }

    async function boot() {
      const response = await fetch(CORE_URL, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Scanner core request failed (${response.status})`);
      let html = await response.text();

      const landscapeCss = `

/* ============================================================
   LANDSCAPE CAMERA LAYOUT
   Grain-ticket proportion: centered white guide, slightly
   shorter left/right, tall enough for the full ticket, and no
   helper/status pill covering the bottom edge of the frame.
============================================================ */
@media (orientation: landscape) and (max-height: 700px) {
  .camera-page {
    display: flex !important;
    flex-direction: column !important;
    width: 100vw !important;
    height: 100dvh !important;
    overflow: hidden !important;
  }

  .camera-header {
    position: relative !important;
    flex: 0 0 auto !important;
    width: 100% !important;
    min-height: 0 !important;
    box-sizing: border-box !important;
    padding:
      calc(env(safe-area-inset-top, 0px) + 2px)
      calc(env(safe-area-inset-right, 0px) + 16px)
      2px
      calc(env(safe-area-inset-left, 0px) + 16px) !important;
    background: #000 !important;
  }

  .camera-title { font-size: 15px !important; line-height: 1.05 !important; margin: 0 !important; }
  .camera-subtitle { font-size: 10px !important; line-height: 1.05 !important; margin-top: 1px !important; }
  .close-btn { padding: 5px 8px !important; font-size: 15px !important; }

  .camera-view {
    position: relative !important;
    inset: auto !important;
    flex: 1 1 auto !important;
    min-height: 0 !important;
    width: 100vw !important;
    max-width: none !important;
    height: auto !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
  }

  .ticket-frame {
    position: absolute !important;
    left: 50vw !important;
    right: auto !important;
    top: 50% !important;
    bottom: auto !important;
    margin: 0 !important;
    transform: translate(-50%, -50%) !important;
    width: min(70vw, 900px) !important;
    height: min(92%, 470px) !important;
    max-width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px) - 110px) !important;
    max-height: calc(100% - 14px) !important;
    box-sizing: border-box !important;
    border: 3px solid #fff !important;
    border-radius: 12px !important;
    box-shadow: 0 0 0 1px rgba(0,0,0,.18) !important;
  }

  .ticket-frame.good,
  .ticket-frame.ready,
  .ticket-frame.focus-good,
  .ticket-frame.is-good,
  .ticket-frame[data-ready="true"] {
    border-color: #fff !important;
  }

  .camera-tip {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }

  .camera-footer {
    position: relative !important;
    left: auto !important;
    right: auto !important;
    bottom: auto !important;
    flex: 0 0 auto !important;
    width: 100% !important;
    box-sizing: border-box !important;
    min-height: 62px !important;
    padding:
      4px
      calc(env(safe-area-inset-right, 0px) + 16px)
      calc(env(safe-area-inset-bottom, 0px) + 4px)
      calc(env(safe-area-inset-left, 0px) + 16px) !important;
    background: #000 !important;
  }

    width: 52px !important;
    height: 52px !important;
    border-width: 3px !important;
  }

  .capture-btn::before {
    width: 40px !important;
    height: 40px !important;
  }

  .torch-btn,
  .fallback-btn {
    padding: 6px 10px !important;
    font-size: 10px !important;
  }
}
`;

      html = replaceRequired(html, '</style>', landscapeCss + '\n</style>', 'landscape camera layout');
      html = replaceRequired(html, '/js/grain-ticket-ocr-grade-normalizer.js?v=20260909-6', '/js/grain-ticket-ocr-grade-normalizer.js?v=20260911-7', 'grade normalizer version');

      const oldAlias = `  if (\n    ocrName\n  ) {\n\n    const alias =\n      findLearnedAlias(\n        "customer",\n        ocrName\n      );\n\n\n    if (\n      alias?.targetId\n    ) {\n\n      const customer =\n        candidates.find(\n          item =>\n            item.id ===\n            alias.targetId\n        );\n\n\n      if (\n        customer\n      ) {\n\n        return {\n          matched:\n            true,\n\n          matchType:\n            "learned_alias",\n\n          customer\n        };\n\n      }\n\n    }\n\n  }\n`;

      /* ============================================================
         SEPT 11, 2026 — SIMPLE/DETAILED SOLD UNDER NORMALIZATION

         Hauling jobs created by different FarmVista generations may store

      const oldHaulingJobCustomerId = `function haulingJobCustomerId(\n  job\n) {\n\n  return String(\n    job?.customerId ||\n    job?.grainCustomerId ||\n    ""\n  ).trim();\n\n}\n`;

      const newHaulingJobCustomerId = `function haulingJobCustomerId(\n  job\n) {\n\n  return String(\n    job?.customerId ||\n    job?.soldUnderId ||\n    job?.grainCustomerId ||\n    ""\n  ).trim();\n\n}\n`;

      const oldKnownJobCustomerMarker = `  if (\n    haulingJob?.id\n  ) {\n\n    contracts.forEach(\n`;

      html = replaceRequired(html, oldKnownJobCustomerMarker, newKnownJobCustomerMarker, 'driver assist direct hauling job sold under');

      const oldCandidateReturn = `  return ids;\n\n}\n\n\nfunction findCustomerBlockClues(\n`;

      const newCandidateReturn = `  /*\n    SIMPLE grain tracking may have no contract at all. Add Sold Under from\n    active hauling jobs that match this crop/destination/buyer so OCR customer\n    matching uses the same operational truth as auto-assignment.\n  */\n  haulingJobs\n    .filter(haulingJobIsActive)\n    .forEach(\n      job => {\n        const jobCrop =\n          normalizeMatchText(\n            job?.crop ||\n            job?.commodity\n          );\n\n        if (\n          crop &&\n          jobCrop &&\n          crop !== jobCrop\n        ) {\n          return;\n        }\n\n        const jobLocationId =\n          String(\n            job?.deliveryLocationId ||\n            job?.locationId ||\n            job?.destinationId ||\n            ""\n          ).trim();\n\n        if (\n          locationId &&\n          jobLocationId &&\n          jobLocationId !== locationId\n        ) {\n          return;\n        }\n\n        const jobBuyerId =\n          String(\n            job?.buyerId ||\n            job?.grainBuyerId ||\n            job?.elevatorId ||\n            ""\n          ).trim();\n\n        if (\n          buyerId &&\n          jobBuyerId &&\n          jobBuyerId !== buyerId\n        ) {\n          return;\n        }\n\n        const jobCustomerId =\n          haulingJobCustomerId(\n            job\n          );\n\n        if (\n          jobCustomerId\n        ) {\n          ids.add(\n            jobCustomerId\n          );\n        }\n      }\n    );\n\n\n  return ids;\n\n}\n\n\nfunction findCustomerBlockClues(\n`;

      html = replaceRequired(html, oldCandidateReturn, newCandidateReturn, 'simple hauling job sold under customer candidates');

      /* ============================================================
         SEPT 11, 2026 — SCAN AUTO-ASSIGNMENT ORDER

         A scanned ticket can auto-assign only after FarmVista has a crop,
         destination, Sold Under customer, and valid grain source. When more
         than one hauling job matches, fill the oldest eligible job first.
         A ticket that crosses a job boundary stays whole on that oldest job;
         FarmVista does not split the elevator ticket automatically.
      ============================================================ */
      const oldSoldUnderJobFilter = `  /*\n    Sold Under and Hauling Job work in both directions.\n    Once Sold Under is known, keep only jobs with an OPEN linked\n    contract for that customer and crop.\n  */\n  if (customerId) {\n    matches =\n      matches.filter(\n        job =>\n          contracts.some(\n            contract => {\n              if (!contractIsAvailableForDriverAssist(contract)) {\n                return false;\n              }\n\n              const contractJobId =\n                String(\n                  contract?.haulingJobId ||\n                  ""\n                ).trim();\n\n              const contractCustomerId =\n                String(\n                  firstExistingValue(\n                    contract,\n                    ["customerId", "grainCustomerId"]\n                  ) ||\n                  ""\n                ).trim();\n\n              const contractCrop =\n                normalizeScannedCrop(\n                  firstExistingValue(\n                    contract,\n                    ["crop", "commodity"]\n                  )\n                );\n\n              const contractLocationId =\n                String(\n                  firstExistingValue(\n                    contract,\n                    [\n                      "deliveryLocationId",\n                      "locationId",\n                      "destinationId"\n                    ]\n                  ) ||\n                  ""\n                ).trim();\n\n              const contractBuyerId =\n                String(\n                  firstExistingValue(\n                    contract,\n                    ["buyerId", "elevatorId"]\n                  ) ||\n                  ""\n                ).trim();\n\n              return (\n                contractJobId === String(job.id || "").trim() &&\n                contractCustomerId === customerId &&\n                (!contractCrop || contractCrop === crop) &&\n                (\n                  !matchedLocationId ||\n                  !contractLocationId ||\n                  contractLocationId === matchedLocationId\n                ) &&\n                (\n                  !matchedBuyerId ||\n                  !contractBuyerId ||\n                  contractBuyerId === matchedBuyerId\n                )\n              );\n            }\n          )\n      );\n  }\n`;

      const newSoldUnderJobFilter = `  /*\n    Sold Under and Hauling Job work in both directions.\n\n    SIMPLE grain tracking stores Sold Under directly on the hauling job.\n    DETAILED grain tracking may derive Sold Under from an open linked\n    contract. Accept either source, but never guess across customers.\n  */\n  if (customerId) {\n    matches =\n      matches.filter(\n        job => {\n          const directJobCustomerId =\n            haulingJobCustomerId(job);\n\n          if (\n            directJobCustomerId &&\n            directJobCustomerId === customerId\n          ) {\n            return true;\n          }\n\n          return contracts.some(\n            contract => {\n              if (!contractIsAvailableForDriverAssist(contract)) {\n                return false;\n              }\n\n              const contractJobId =\n                String(\n                  contract?.haulingJobId ||\n                  ""\n                ).trim();\n\n              const contractCustomerId =\n                String(\n                  firstExistingValue(\n                    contract,\n                    ["customerId", "grainCustomerId"]\n                  ) ||\n                  ""\n                ).trim();\n\n              const contractCrop =\n                normalizeScannedCrop(\n                  firstExistingValue(\n                    contract,\n                    ["crop", "commodity"]\n                  )\n                );\n\n              const contractLocationId =\n                String(\n                  firstExistingValue(\n                    contract,\n                    [\n                      "deliveryLocationId",\n                      "locationId",\n                      "destinationId"\n                    ]\n                  ) ||\n                  ""\n                ).trim();\n\n              const contractBuyerId =\n                String(\n                  firstExistingValue(\n                    contract,\n                    ["buyerId", "elevatorId"]\n                  ) ||\n                  ""\n                ).trim();\n\n              return (\n                contractJobId === String(job.id || "").trim() &&\n                contractCustomerId === customerId &&\n                (!contractCrop || contractCrop === crop) &&\n                (\n                  !matchedLocationId ||\n                  !contractLocationId ||\n                  contractLocationId === matchedLocationId\n                ) &&\n                (\n                  !matchedBuyerId ||\n                  !contractBuyerId ||\n                  contractBuyerId === matchedBuyerId\n                )\n              );\n            }\n          );\n        }\n      );\n  }\n`;

      html = replaceRequired(html, oldSoldUnderJobFilter, newSoldUnderJobFilter, 'sold under hauling-job matching');

      const oldAutoJob = `function automaticHaulingJobForTicket(\n  grainTicket,\n  customer = null,\n  locationOverride = null,\n  buyerOverride = null\n) {\n  const matches =\n    matchingActiveHaulingJobsForTicket(\n      grainTicket,\n      customer,\n      locationOverride,\n      buyerOverride\n    );\n\n  return matches.length === 1\n    ? matches[0]\n    : null;\n}\n`;

      const newAutoJob = `function haulingJobCreatedMillis(job) {\n  const created =\n    job?.createdAt ||\n    job?.created ||\n    null;\n\n  if (created?.toMillis) {\n    return created.toMillis();\n  }\n\n  if (created?.toDate) {\n    return created.toDate().getTime();\n  }\n\n  const parsed =\n    new Date(created || 0).getTime();\n\n  return Number.isFinite(parsed)\n    ? parsed\n    : Number.MAX_SAFE_INTEGER;\n}\n\n\nfunction haulingJobOldestFirst(a, b) {\n  const aStart =\n    normalizedTicketDateISO(\n      a?.deliveryStartDate ||\n      a?.startDate\n    ) ||\n    "9999-12-31";\n\n  const bStart =\n    normalizedTicketDateISO(\n      b?.deliveryStartDate ||\n      b?.startDate\n    ) ||\n    "9999-12-31";\n\n  if (aStart !== bStart) {\n    return aStart.localeCompare(bStart);\n  }\n\n  const createdDifference =\n    haulingJobCreatedMillis(a) -\n    haulingJobCreatedMillis(b);\n\n  if (createdDifference) {\n    return createdDifference;\n  }\n\n  return String(a?.id || "").localeCompare(\n    String(b?.id || "")\n  );\n}\n\n\nfunction automaticHaulingJobForTicket(\n  grainTicket,\n  customer = null,\n  locationOverride = null,\n  buyerOverride = null\n) {\n  /*\n    Never auto-assign without Sold Under. Crop and destination are already\n    mandatory inside matchingActiveHaulingJobsForTicket. Grain Source is\n    separately required by rebuildMatchingAfterDriverAssist before a ticket\n    can become verified.\n  */\n  if (!customer?.id) {\n    return null;\n  }\n\n  const matches =\n    matchingActiveHaulingJobsForTicket(\n      grainTicket,\n      customer,\n      locationOverride,\n      buyerOverride\n    );\n\n  const oldest =\n    [...matches]\n      .sort(haulingJobOldestFirst)[0] ||\n    null;\n\n  if (oldest) {\n    console.log(\n      "[Grain Ticket] Auto-assigned oldest matching hauling job:",\n      {\n        ticketNumber: grainTicket?.ticketNumber || null,\n        haulingJobId: oldest.id,\n        remainingBefore: haulingJobRemainingBushels(oldest),\n        ticketBushels: Number(grainTicket?.netBushels || 0) || 0,\n        matchingJobCount: matches.length\n      }\n    );\n  }\n\n  return oldest;\n}\n`;

      html = replaceRequired(html, oldAutoJob, newAutoJob, 'oldest hauling-job auto assignment');

      const assistMarker = `async function runDriverAssistQuestions(\n  grainTicket,\n  ocrResult,\n  matching\n) {`;

      const aliasHelpers = `function customerAliasEvidence(\n  grainTicket\n) {\n\n  return Array.from(\n    new Set(\n      [\n        String(grainTicket?.customerAccountText || "").trim(),\n        String(grainTicket?.customerText || "").trim()\n      ].filter(Boolean)\n    )\n  );\n\n}\n\n\nasync function saveDriverCustomerAliases(\n  grainTicket,\n  customer\n) {\n\n  if (!customer?.id) return;\n\n  const targetId = String(customer.id);\n  const targetName = getCustomerName(customer);\n\n  for (const ocrText of customerAliasEvidence(grainTicket)) {\n    const normalizedText = normalizeAliasText(ocrText);\n    if (!normalizedText) continue;\n\n    const aliasId =\n      \`customer_\${normalizedText}\`\n        .replace(/[^a-z0-9_-]+/g, "_")\n        .slice(0, 180);\n\n    const payload = {\n      type: "customer",\n      ocrText,\n      normalizedText,\n      targetId,\n      targetName: targetName || null,\n      source: "driver_confirmation",\n      active: true,\n      updatedAt: serverTimestamp()\n    };\n\n    try {\n      await setDoc(\n        doc(db, ALIAS_COLLECTION, aliasId),\n        payload,\n        { merge: true }\n      );\n\n      const existingIndex = ocrAliases.findIndex(\n        alias =>\n          String(alias.type || "") === "customer" &&\n          normalizeAliasText(alias.normalizedText || alias.ocrText) === normalizedText\n      );\n\n      const localAlias = { id: aliasId, ...payload };\n      if (existingIndex >= 0) ocrAliases[existingIndex] = localAlias;\n      else ocrAliases.push(localAlias);\n\n      console.log("[Grain Ticket] Learned Sold Under alias:", { ocrText, targetId, targetName });\n    }\n    catch (error) {\n      console.warn("[Grain Ticket] Could not save Sold Under alias:", error);\n    }\n  }\n}\n\n\n`;

      html = replaceRequired(html, assistMarker, aliasHelpers + assistMarker, 'driver assist insertion');

      const oldCustomerBranch = `    if (eligibleCustomers.length === 1) {\n      customer = eligibleCustomers[0];\n    }\n    else if (eligibleCustomers.length > 1) {\n      const selectedCustomer =\n`;

      const newCustomerBranch = `    const eligibleCustomerIds =\n      new Set(\n        eligibleCustomers.map(\n          item => String(item.id)\n        )\n      );\n\n    const soldUnderCustomers = [\n      ...eligibleCustomers,\n      ...customers.filter(\n        item => !eligibleCustomerIds.has(String(item.id))\n      )\n    ];\n\n    if (soldUnderCustomers.length) {\n      const selectedCustomer =\n`;

      html = replaceRequired(html, oldCustomerBranch, newCustomerBranch, 'sold under verification branch');
      html = replaceRequired(html, '            ...eligibleCustomers.map(\n', '            ...soldUnderCustomers.map(\n', 'sold under customer list');
      html = html.replace('              : `Choose the Sold Under customer for this ${grainTicket.crop} delivery.`,', '              : `OCR could not confidently link the Sold Under customer. Choose who this ${grainTicket.crop} load is sold under.`,');

      const correctionBlock = `        ocrResult.manualCorrections = {\n          ...(ocrResult.manualCorrections || {}),\n          customer: {\n            originalValue: originalEvidence || null,\n            selectedId: selectedCustomer.id,\n            selectedValue: getCustomerName(selectedCustomer),\n            source: "driver_selection",\n            learningEligible: Boolean(originalEvidence),\n            learningReason:\n              originalEvidence\n                ? "ocr_evidence_confirmed"\n                : "driver_supplied_missing_value"\n          }\n        };\n`;

      html = replaceRequired(html, correctionBlock, correctionBlock + `\n        await saveDriverCustomerAliases(\n          grainTicket,\n          selectedCustomer\n        );\n`, 'sold under alias learning');

      /* ============================================================
         SEPT 11, 2026 — ADM DECATUR DESTINATION TEMPLATE

         ADM Processing receipts identify the destination in the header with
         Archer Daniels Midland / ADM Processing plus Decatur, IL and the
         facility address. Treat that combination as authoritative when it
         resolves to one FarmVista Decatur ADM delivery location.
      ============================================================ */
      const destinationFunctionMarker = `function findDeliveryLocationMatch(\n  grainTicket\n) {\n`;

      const destinationTemplateLogic = `function findDeliveryLocationMatch(\n  grainTicket\n) {\n\n  const rawDestinationText =\n    normalizeMatchText(\n      grainTicket?.rawText ||\n      ""\n    );\n\n  const isAdmDecaturReceipt =\n    (\n      rawDestinationText.includes("adm processing") ||\n      rawDestinationText.includes("archer daniels midland")\n    ) &&\n    rawDestinationText.includes("decatur il") &&\n    (\n      rawDestinationText.includes("62522") ||\n      rawDestinationText.includes("4666 fairies parkway")\n    );\n\n  if (isAdmDecaturReceipt) {\n    const admDecaturLocations =\n      deliveryLocations.filter(\n        location => {\n          const city = normalizeMatchText(getLocationCity(location));\n          const state = normalizeMatchText(getLocationState(location));\n          const identity = normalizeMatchText(\n            [\n              getLocationName(location),\n              location?.buyerName || ""\n            ].join(" ")\n          );\n\n          return (\n            city === "decatur" &&\n            (!state || state === "il" || state === "illinois") &&\n            (\n              identity.includes("adm") ||\n              identity.includes("archer daniels midland")\n            )\n          );\n        }\n      );\n\n    const namedDecatur =\n      admDecaturLocations.filter(\n        location =>\n          normalizeMatchText(\n            getLocationName(location)\n          ).includes("decatur")\n      );\n\n    const location =\n      admDecaturLocations.length === 1\n        ? admDecaturLocations[0]\n        : namedDecatur.length === 1\n          ? namedDecatur[0]\n          : null;\n\n    if (location) {\n      console.log(\n        "[Grain Ticket] ADM Decatur template matched destination:",\n        { id: location.id, name: getLocationName(location) }\n      );\n\n      return {\n        matched: true,\n        matchType: "adm_decatur_template",\n        location\n      };\n    }\n  }\n`;

      html = replaceRequired(html, destinationFunctionMarker, destinationTemplateLogic, 'ADM Decatur destination template');

      /* ============================================================
         SEPT 11, 2026 — VENDOR IS SOLD UNDER

         On ADM receipts, CARRIER is the hauler and must never decide Sold
         Under. VENDOR account/name is the authoritative Sold Under evidence.
      ============================================================ */
      const customerResultMarker = `  const result = {\n    account:\n      String(\n        grainTicket?.customerAccountText ||\n        ""\n      ).trim(),\n\n    name:\n      String(\n        grainTicket?.customerText ||\n        ""\n      ).trim(),\n\n    nearbyText:\n      ""\n  };\n`;

      const customerResultWithVendor = customerResultMarker + `\n\n  const vendorIndex =\n    lines.findIndex(\n      line => /^\\s*vendor\\s*:/i.test(String(line || ""))\n    );\n\n  if (vendorIndex >= 0) {\n    const vendorLine = String(lines[vendorIndex] || "").trim();\n    const vendorValue = vendorLine.replace(/^\\s*vendor\\s*:\\s*/i, "").trim();\n    const accountMatch = vendorValue.match(/[A-Z0-9]*\\d[A-Z0-9-]*/i);\n    const vendorAccount = String(accountMatch?.[0] || "").trim();\n    const inlineName = vendorAccount\n      ? vendorValue.replace(vendorAccount, "").trim()\n      : "";\n    const nextLine = String(lines[vendorIndex + 1] || "").trim();\n    const nextLooksLikeLabel = /^(carrier|plate(?:\\s+id)?|vehicle|truck|ticket|weigh|gross|tare|net|scale|grade|farm\\s+name)\\s*:/i.test(nextLine);\n    const vendorName = inlineName || (!nextLooksLikeLabel ? nextLine : "");\n\n    if (vendorAccount) result.account = vendorAccount;\n    if (vendorName) result.name = vendorName;\n\n    result.nearbyText =\n      lines\n        .slice(vendorIndex, Math.min(lines.length, vendorIndex + 4))\n        .join(" ");\n\n    console.log(\n      "[Grain Ticket] Using VENDOR as Sold Under evidence:",\n      { account: result.account || null, name: result.name || null }\n    );\n\n    return result;\n  }\n`;

      html = replaceRequired(html, customerResultMarker, customerResultWithVendor, 'vendor sold under evidence');

      const landscapeRuntime = `
<script>

  window.addEventListener('resize', applyLandscapeTipRule, { passive: true });
  window.addEventListener('orientationchange', () => setTimeout(applyLandscapeTipRule, 100), { passive: true });
})();
