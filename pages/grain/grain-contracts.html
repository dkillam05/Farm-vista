<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>FarmVista • Grain Operations</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#3B7E46"/>
  <script src="/js/app/theme-boot.js"></script>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"/>
  <link rel="icon" href="/assets/icons/icon-192.png"/>
  <link rel="stylesheet" href="/assets/css/theme.css"/>
  <link rel="stylesheet" href="/assets/css/app.css"/>
  <link rel="stylesheet" href="/js/grain/operations/ui/grain-operations.css?v=20260918-14"/>
  <link rel="stylesheet" href="/js/grain/operations/ui/hauling-ticket-workspace.css?v=20260918-4"/>
  <script src="/js/app/version.js" defer></script>
  <script src="/js/app/core.js" defer></script>
  <script src="/js/app/fv-shell.js" defer></script>
</head>
<body>
  <fv-shell>
    <main class="page container contracts-page">
      <div id="grain-operations-central"><div style="padding:24px;text-align:center">Loading Grain Operations…</div></div>
    </main>
  </fv-shell>
  <script type="module">
    import {installLandscapeLock} from '/js/grain/operations/ui/landscape-lock.js?v=20260917-2';
    import {mountGrainOperations} from '/js/grain/operations/ui/workspace-renderer.js?v=20260917-15';
    import {getWorkspaceModel} from '/js/grain/operations/ui/workspace-controller.js?v=20260917-2';
    import {openContractForm} from '/js/grain/operations/ui/form-dialogs.js?v=20260917-2';
    import {installHaulingTicketWorkspace} from '/js/grain/operations/ui/hauling-ticket-workspace.js?v=20260918-14';
    installLandscapeLock();
    const root=document.getElementById('grain-operations-central');
    mountGrainOperations(root).then(()=>{
      installHaulingTicketWorkspace(root);
      const params=new URLSearchParams(location.search);
      const editId=params.get('contractId')||params.get('id')||params.get('edit');
      if(!editId)return;
      const contract=getWorkspaceModel()?.contracts?.find(item=>String(item?.id||'')===String(editId));
      if(contract){openContractForm(root,contract);history.replaceState(null,'',location.pathname)}
    }).catch(error=>{
      console.error('[FarmVista Grain Operations]',error);
      if(root)root.innerHTML='<div style="padding:24px;color:#9d241e;font-weight:800">Grain Operations could not load. Please refresh and try again.</div>';
    });
  </script>
</body>
</html>
