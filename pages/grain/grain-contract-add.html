<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>FarmVista • Add Grain Contract</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#3B7E46"/>

  <!-- Early theme boot -->
  <script src="/Farm-vista/js/theme-boot.js"></script>

  <link rel="manifest" href="/Farm-vista/manifest.webmanifest"/>
  <link
    rel="apple-touch-icon"
    href="/Farm-vista/assets/icons/apple-touch-icon.png"
  />
  <link
    rel="icon"
    href="/Farm-vista/assets/icons/icon-192.png"
  />

  <!-- Global CSS -->
  <link rel="stylesheet" href="/Farm-vista/assets/css/theme.css"/>
  <link rel="stylesheet" href="/Farm-vista/assets/css/app.css"/>

  <!-- Core -->
  <script src="/Farm-vista/js/version.js" defer></script>
  <script src="/Farm-vista/js/core.js" defer></script>
  <script src="/Farm-vista/js/fv-shell.js" defer></script>

  <!-- Page JS -->
  <script
    src="/Farm-vista/js/grain-contract-add.js"
    defer>
  </script>

  <style>
    .contract-wrap{
      max-width:900px;
      margin:0 auto;
    }

    .contract-card{
      margin-top:16px;
      padding:clamp(16px,3vw,24px);
    }

    .contract-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:16px;
    }

    @media(min-width:700px){
      .contract-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

      .span-2{
        grid-column:1 / -1;
      }
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .field label{
      font-weight:700;
    }

    .field input,
    .field select,
    .field textarea{
      width:100%;
      min-height:46px;
      padding:10px 12px;
      border:1px solid var(--border, #ccc);
      border-radius:10px;
      background:var(--surface, #fff);
      color:inherit;
      font:inherit;
      box-sizing:border-box;
    }

    .field textarea{
      min-height:100px;
      resize:vertical;
    }

    .import-box{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:12px;
      margin-top:16px;
      padding:16px;
      border:1px dashed var(--border, #bbb);
      border-radius:12px;
    }

    .import-text{
      flex:1 1 260px;
    }

    .import-title{
      font-weight:800;
      margin-bottom:4px;
    }

    .import-sub{
      font-size:.9rem;
      opacity:.75;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      gap:10px;
      margin-top:20px;
    }

    .btn{
      min-height:44px;
      padding:10px 18px;
      border:0;
      border-radius:10px;
      font:inherit;
      font-weight:700;
      cursor:pointer;
    }

    .btn-primary{
      background:#3B7E46;
      color:#fff;
    }

    .btn-secondary{
      background:var(--surface-2, #eee);
      color:inherit;
    }

    .required{
      color:#b3261e;
    }

    #contract-file{
      display:none;
    }

    .import-status{
      width:100%;
      font-size:.9rem;
      opacity:.8;
    }
  </style>
</head>

<body>
  <fv-shell>
    <div class="page container contract-wrap">

      <h1 class="page-title">Add Grain Contract</h1>

      <p class="page-sub">
        Enter the grain contract information below or import the original
        contract to prefill the form.
      </p>

      <!-- IMPORT -->
      <div class="card import-box">
        <div class="import-text">
          <div class="import-title">Import Contract</div>
          <div class="import-sub">
            Upload a PDF, image, spreadsheet, or other supported contract file.
          </div>
        </div>

        <button
          type="button"
          class="btn btn-secondary"
          id="import-contract-btn">
          Import Contract
        </button>

        <input
          id="contract-file"
          type="file"
          accept=".pdf,.png,.jpg,.jpeg,.csv,.xlsx,.xls"
        />

        <div
          id="import-status"
          class="import-status"
          hidden>
        </div>
      </div>


      <!-- FORM -->
      <form id="grain-contract-form">

        <div class="card contract-card">

          <div class="contract-grid">

            <div class="field">
              <label for="contract-number">
                Contract Number
                <span class="required">*</span>
              </label>

              <input
                id="contract-number"
                name="contractNumber"
                type="text"
                autocomplete="off"
                required
              />
            </div>


            <div class="field">
              <label for="buyer">
                Buyer / Elevator
                <span class="required">*</span>
              </label>

              <input
                id="buyer"
                name="buyer"
                type="text"
                autocomplete="organization"
                required
              />
            </div>


            <div class="field">
              <label for="crop">
                Crop
                <span class="required">*</span>
              </label>

              <select
                id="crop"
                name="crop"
                required>
                <option value="">Select crop</option>
                <option value="Corn">Corn</option>
                <option value="Soybeans">Soybeans</option>
                <option value="Wheat">Wheat</option>
              </select>
            </div>


            <div class="field">
              <label for="crop-year">
                Crop Year
                <span class="required">*</span>
              </label>

              <input
                id="crop-year"
                name="cropYear"
                type="number"
                min="2020"
                max="2100"
                required
              />
            </div>


            <div class="field">
              <label for="quantity">
                Contract Bushels
                <span class="required">*</span>
              </label>

              <input
                id="quantity"
                name="quantityBu"
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
                required
              />
            </div>


            <div class="field">
              <label for="price">
                Contract Price
              </label>

              <input
                id="price"
                name="price"
                type="number"
                min="0"
                step="0.0001"
                inputmode="decimal"
                placeholder="0.0000"
              />
            </div>


            <div class="field">
              <label for="contract-type">
                Contract Type
              </label>

              <select
                id="contract-type"
                name="contractType">
                <option value="">Select type</option>
                <option value="Cash">Cash</option>
                <option value="Forward Contract">
                  Forward Contract
                </option>
                <option value="Basis">Basis</option>
                <option value="HTA">HTA</option>
                <option value="Futures Fixed">
                  Futures Fixed
                </option>
                <option value="Other">Other</option>
              </select>
            </div>


            <div class="field">
              <label for="delivery-location">
                Delivery Location
              </label>

              <input
                id="delivery-location"
                name="deliveryLocation"
                type="text"
                autocomplete="off"
              />
            </div>


            <div class="field">
              <label for="delivery-start">
                Delivery Start
              </label>

              <input
                id="delivery-start"
                name="deliveryStart"
                type="date"
              />
            </div>


            <div class="field">
              <label for="delivery-end">
                Delivery End
              </label>

              <input
                id="delivery-end"
                name="deliveryEnd"
                type="date"
              />
            </div>


            <div class="field">
              <label for="contract-date">
                Contract Date
              </label>

              <input
                id="contract-date"
                name="contractDate"
                type="date"
              />
            </div>


            <div class="field">
              <label for="status">
                Status
              </label>

              <select
                id="status"
                name="status">
                <option value="Open">Open</option>
                <option value="Complete">Complete</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </div>


            <div class="field span-2">
              <label for="notes">
                Notes
              </label>

              <textarea
                id="notes"
                name="notes"
                placeholder="Optional contract notes..."></textarea>
            </div>

          </div>


          <div class="actions">

            <button
              type="button"
              class="btn btn-secondary"
              id="cancel-btn">
              Cancel
            </button>

            <button
              type="submit"
              class="btn btn-primary"
              id="save-btn">
              Save Contract
            </button>

          </div>

        </div>

      </form>

    </div>
  </fv-shell>

  <noscript>
    <div class="container">
      <div class="card">
        JavaScript is required for Grain Contracts.
      </div>
    </div>
  </noscript>

</body>
</html>
