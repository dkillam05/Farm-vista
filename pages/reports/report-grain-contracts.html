  <style>
    :root{

      --page-bottom-gap:80px;

    *{ box-sizing:border-box; }

    body{
      background:var(--app-bg,var(--surface));

    .wrap{
      max-width:var(--card-max);
      margin:0 auto;

    /* =========================================================
       BUTTONS
    ========================================================= */

    .btn{

      align-items:center;
      justify-content:center;
      gap:6px;

      min-width:120px;
      min-height:42px;

      padding:9px 14px;

      border-radius:11px;
      border:1px solid var(--border);

      background:var(--card-surface,var(--surface));
      color:var(--text) !important;

      font-size:.9rem;
      font-weight:800;

      cursor:pointer;
      user-select:none;

    .btn-quiet{
      min-width:auto;
    }

    .btn-primary{
      border-color:transparent;
      background:var(--fv-green-dark);
      color:#fff !important;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero{
      border:1px solid var(--border);
      border-radius:14px;
      background:var(--surface);
      box-shadow:var(--shadow,0 8px 20px rgba(0,0,0,.08));
      overflow:hidden;
    }

    .hero-head{
      display:grid;
      grid-template-columns:36px 1fr;
      gap:12px;
      align-items:center;

      padding:14px 16px;

      background:

          90deg,
          rgba(47,108,60,.12),
          transparent

      border-bottom:1px solid var(--border);
    }

    .hero-head .icon{
      width:28px;
      height:28px;
      display:grid;
      place-items:center;
      font-size:23px;
    }

    .hero-head h1{
      margin:0;
      font-size:clamp(20px,3.2vw,27px);
      line-height:1.2;
    }

    .hero-head p{
      margin:4px 0 0;
      line-height:1.4;
    }

    .muted{
      color:var(--muted,#67706B);
    }

    .body{
      padding:16px;
      display:grid;
      gap:16px;
    }

    /* =========================================================
       TOOLBAR
    ========================================================= */

    .toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .toolbar-left{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .page-count{
      font-size:.88rem;
      opacity:.75;
      font-weight:700;
    }

    /* =========================================================
       FILTERS
    ========================================================= */

    .filters{
      display:grid;
      grid-template-columns:
        minmax(170px,1fr)
        minmax(170px,1fr)
        minmax(170px,1fr)
        minmax(230px,1.4fr)

      gap:10px;
      align-items:end;

    .filter-field{

      display:flex;
      flex-direction:column;
      gap:5px;
    }

    .filter-label{

      text-transform:uppercase;
      letter-spacing:.07em;

        grid-template-columns:repeat(2,minmax(0,1fr));

    @media(max-width:520px){

        grid-template-columns:1fr;
      }

      #filterClear{

      flex-wrap:wrap;

    .legend-title{
      font-weight:900;

    .legend-item{

      align-items:center;

      font-weight:700;

      border-radius:50%;

    .legend-dot.good{

    .legend-dot.severe{

      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:10px;

    .summary-card{

    @media(max-width:700px){

    /* =========================================================
       CONTRACT LIST
    ========================================================= */

    .contract-list{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .empty-state{
      padding:22px;

      border:1px dashed var(--border);

      opacity:.75;

    .contract-card{
      border:1px solid var(--border);
      border-radius:13px;
      background:var(--card-surface,var(--surface));
      box-shadow:var(--shadow-soft,var(--shadow));
      overflow:hidden;
    }

    .contract-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;

      padding:14px 16px;

      background:
        linear-gradient(
          90deg,
          rgba(59,126,70,.08),
          transparent

      border-bottom:1px solid var(--border);

    .contract-head-main{
      min-width:0;

    .contract-number{

      font-weight:900;
    }

    .contract-sub{

    .status-pill{

      color:var(--fv-orange-text);

    .status-completed{
      background:var(--fv-blue-bg);
      color:#1d5bbf;
    }

    .status-voided{
      background:var(--fv-red-bg);
      color:#9d241e;

    /* =========================================================
       CONTRACT INFORMATION
    ========================================================= */

    .contract-info{

      grid-template-columns:repeat(6,minmax(0,1fr));

    .info-value{

    /* =========================================================
       CONTRACT GRADE AVERAGES
    ========================================================= */

    .grade-section{
      padding:13px 16px;
      border-bottom:1px solid var(--border);
    }

    .section-label{
      margin-bottom:9px;

      font-size:.76rem;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.07em;
      opacity:.72;
    }

    .grade-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:9px;
    }

    .grade-card{
      min-width:0;
      padding:10px 12px;

      border:1px solid var(--border);
      border-radius:10px;

      background:var(--surface);
    }

    .grade-card.warning{
      border-color:rgba(230,126,34,.45);
      background:var(--fv-orange-bg);
      color:var(--fv-orange-text);
    }

    .grade-card.severe{
      border-color:rgba(179,38,30,.50);
      background:var(--fv-red-bg);
      color:#9d241e;
    }

    .grade-label{
      font-size:.7rem;
      text-transform:uppercase;
      letter-spacing:.07em;
      font-weight:900;
      opacity:.72;
    }

    .grade-value{
      margin-top:3px;
      font-size:1.18rem;
      font-weight:950;
      font-variant-numeric:tabular-nums;
    }

    .grade-note{
      margin-top:2px;

    /* =========================================================
       TICKETS
    ========================================================= */

    .ticket-section{
      padding:13px 16px 16px;
    }

    .ticket-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:9px;
    }

    .ticket-header-title{
      font-size:.78rem;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.07em;
      opacity:.72;
    }

    .ticket-count{
      font-size:.76rem;
      opacity:.65;
      font-weight:800;
    }

    .ticket-table-wrap{
      width:100%;
      overflow-x:auto;

      border:1px solid var(--border);

    .ticket-table{
      width:100%;
      min-width:900px;

    .ticket-table th{

    .ticket-table td{
      padding:9px 10px;
      border-bottom:1px solid var(--border);

      font-size:.82rem;

    .ticket-table tbody tr:last-child td{

    .ticket-number-cell{

    .number-cell{

    .grade-cell{

    .grade-cell.warning{

    .grade-cell.severe{

    .no-tickets{

      border:1px dashed var(--border);

    /* =========================================================
       PRINT
    ========================================================= */

    #fv-print-frame{
      position:fixed;
      right:0;
      bottom:0;
      width:0;
      height:0;
      border:0;
      visibility:hidden;

    .bottom-actions{
      display:flex;
      justify-content:flex-end;
      margin-top:4px;

  <script type="module">
    import {
      ready,
      getFirestore,
      collection,
      getDocs,
      doc,
      getDoc
    } from "/js/firebase-init.js";

    import { NAV_MENU } from "/js/menu.js";

    await ready;

    const db = getFirestore();

    const CONTRACT_COLLECTION = "grain_contracts";
    const TICKET_COLLECTION = "grain_tickets";

    const $ = (selector, root = document) =>
      root.querySelector(selector);

    const state = {
      contracts: [],
      tickets: [],
      filteredContracts: [],
      company: null
    };

    /* =========================================================
       BASIC HELPERS
    ========================================================= */

    function clean(value){
      return String(value ?? "").trim();
    }

    function numberOrNull(value){
      if(
        value === null ||
        value === undefined ||
        value === ""
      ){
        return null;
      }

      const n = Number(value);

      return Number.isFinite(n)
        ? n
        : null;
    }

    function numberValue(value){
      const n = Number(value);
      return Number.isFinite(n) ? n : 0;
    }

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function formatBushels(value){
      const n = Number(value);

      if(!Number.isFinite(n)){
        return "—";
      }

      return n.toLocaleString(
        "en-US",
        {
          maximumFractionDigits:2
        }
      );
    }

    function formatGrade(value){
      const n = Number(value);

      if(!Number.isFinite(n)){
        return "—";
      }

      return n.toFixed(2);
    }

    function formatPrice(value){
      const n = Number(value);

      if(!Number.isFinite(n)){
        return "—";
      }

      return n.toLocaleString(
        "en-US",
        {
          style:"currency",
          currency:"USD",
          minimumFractionDigits:2,
          maximumFractionDigits:4
        }
      );
    }

    function formatDate(value){
      if(!value){
        return "—";
      }

      if(
        typeof value === "string" &&
        /^\d{4}-\d{2}-\d{2}$/.test(value)
      ){
        const [y,m,d] = value.split("-");

        return `${Number(m)}/${Number(d)}/${y}`;
      }

      try{
        let date = null;

        if(value?.toDate){
          date = value.toDate();
        }
        else{
          date = new Date(value);
        }

        if(
          !date ||
          !Number.isFinite(date.getTime())
        ){
          return clean(value) || "—";
        }

        return date.toLocaleDateString();
      }
      catch{
        return clean(value) || "—";
      }
    }

    function formatDateTime(date){
      try{
        return date.toLocaleString();
      }
      catch{
        return "";
      }
    }

    function normalizeCrop(crop){
      const value =
        clean(crop).toLowerCase();

      if(value.includes("soy")){
        return "soybeans";
      }

      if(value.includes("corn")){
        return "corn";
      }

      return value;
    }

    function normalizeStatus(status){
      const value =
        clean(status).toLowerCase();

      if(value.includes("void")){
        return "voided";
      }

      if(value.includes("complete")){
        return "completed";
      }

      if(value.includes("pending")){
        return "pending";
      }

      return "open";
    }

    function statusLabel(status){
      const value = normalizeStatus(status);

      if(value === "completed"){
        return "Completed";
      }

      if(value === "pending"){
        return "Pending";
      }

      if(value === "voided"){
        return "Voided";
      }

      return "Open";
    }

    function statusClass(status){
      return `status-${normalizeStatus(status)}`;
    }

    /* =========================================================
       TICKET ALLOCATIONS
    ========================================================= */

    function getTicketAllocations(ticket){
      if(
        !ticket ||
        ticket.voided
      ){
        return [];
      }

      if(
        Array.isArray(ticket.contractAllocations)
      ){
        return ticket.contractAllocations
          .map(allocation => ({
            contractId:
              clean(allocation?.contractId),

            contractNumber:
              clean(allocation?.contractNumber),

            bushels:
              numberValue(allocation?.bushels)
          }))
          .filter(allocation =>
            allocation.contractId &&
            allocation.bushels > 0
          );
      }

      /*
        Legacy whole-ticket assignment.
      */
      if(clean(ticket.contractId)){
        return [{
          contractId:
            clean(ticket.contractId),

          contractNumber:
            clean(ticket.contractNumber),

          bushels:
            numberValue(ticket.netBushels)
        }];
      }

      return [];
    }

    function getAllocationToContract(
      ticket,
      contractId
    ){
      return getTicketAllocations(ticket)
        .find(allocation =>
          clean(allocation.contractId) ===
          clean(contractId)
        ) || null;
    }

    function getAllocationBushels(
      ticket,
      contractId
    ){
      return numberValue(
        getAllocationToContract(
          ticket,
          contractId
        )?.bushels
      );
    }

    function getContractTickets(contract){
      return state.tickets
        .filter(ticket =>
          !ticket.voided &&
          getAllocationBushels(
            ticket,
            contract.id
          ) > 0
        )
        .sort((a,b) => {
          const dateCompare =
            clean(a.ticketDate)
              .localeCompare(
                clean(b.ticketDate)
              );

          if(dateCompare){
            return dateCompare;
          }

          return clean(a.ticketNumber)
            .localeCompare(
              clean(b.ticketNumber),
              undefined,
              {
                numeric:true,
                sensitivity:"base"
              }
            );
        });
    }

    /* =========================================================
       GRADE COLOR RULES

       GOOD:
       Damage 0–5
       FM     0–3
       Corn moisture under 15.5
       Soy moisture under 13.0

       WARNING / ORANGE:
       Damage >5 through 9
       FM     >3 through 8
       Corn   15.5 through 18
       Soy    13 through 15.5

       SEVERE / RED:
       Damage >9
       FM     >8
       Corn   >18
       Soy    >15.5
    ========================================================= */

    function gradeSeverity(
      type,
      value,
      crop
    ){
      const n = Number(value);

      if(!Number.isFinite(n)){
        return "";
      }

      if(type === "damage"){
        if(n > 9){
          return "severe";
        }

        if(n > 5){
          return "warning";
        }

        return "";
      }

      if(type === "fm"){
        if(n > 8){
          return "severe";
        }

        if(n > 3){
          return "warning";
        }

        return "";
      }

      if(type === "moisture"){
        const cropType =
          normalizeCrop(crop);

        if(cropType === "soybeans"){
          if(n > 15.5){
            return "severe";
          }

          if(n >= 13){
            return "warning";
          }

          return "";
        }

        /*
          Corn default.
        */
        if(n > 18){
          return "severe";
        }

        if(n >= 15.5){
          return "warning";
        }

        return "";
      }

      return "";
    }

    function gradeDescription(
      type,
      crop
    ){
      if(type === "damage"){
        return "Good ≤ 5 • Orange > 5–9 • Red > 9";
      }

      if(type === "fm"){
        return "Good ≤ 3 • Orange > 3–8 • Red > 8";
      }

      if(
        type === "moisture" &&
        normalizeCrop(crop) === "soybeans"
      ){
        return "Good < 13 • Orange 13–15.5 • Red > 15.5";
      }

      return "Good < 15.5 • Orange 15.5–18 • Red > 18";
    }

    /* =========================================================
       WEIGHTED CONTRACT AVERAGES
    ========================================================= */

    function weightedAverage(
      contract,
      field
    ){
      const tickets =
        getContractTickets(contract);

      let weightedTotal = 0;
      let bushelTotal = 0;

      tickets.forEach(ticket => {
        const value =
          numberOrNull(ticket[field]);

        if(value === null){
          return;
        }

        const allocatedBushels =
          getAllocationBushels(
            ticket,
            contract.id
          );

        if(!(allocatedBushels > 0)){
          return;
        }

        weightedTotal +=
          value * allocatedBushels;

        bushelTotal +=
          allocatedBushels;
      });

      if(!(bushelTotal > 0)){
        return null;
      }

      return weightedTotal / bushelTotal;
    }

    function getContractStats(contract){
      const tickets =
        getContractTickets(contract);

      const delivered =
        tickets.reduce(
          (sum,ticket) =>
            sum +
            getAllocationBushels(
              ticket,
              contract.id
            ),
          0
        );

      const contracted =
        numberValue(
          contract.contractBushels
        );

      return {
        tickets,

        delivered,

        remaining:
          Math.max(
            0,
            contracted - delivered
          ),

        moisture:
          weightedAverage(
            contract,
            "moisture"
          ),

        damage:
          weightedAverage(
            contract,
            "damage"
          ),

        fm:
          weightedAverage(
            contract,
            "foreignMaterial"
          )
      };
    }

    /* =========================================================
       LOAD DATA
    ========================================================= */

    async function loadData(){
      const [
        contractSnap,
        ticketSnap
      ] = await Promise.all([
        getDocs(
          collection(
            db,
            CONTRACT_COLLECTION
          )
        ),

        getDocs(
          collection(
            db,
            TICKET_COLLECTION
          )
        )
      ]);

      state.contracts =
        contractSnap.docs
          .map(snap => ({
            id:snap.id,
            ...(snap.data() || {})
          }))
          .sort((a,b) => {
            const dateCompare =
              clean(b.contractDate)
                .localeCompare(
                  clean(a.contractDate)
                );

            if(dateCompare){
              return dateCompare;
            }

            return clean(a.contractNumber)
              .localeCompare(
                clean(b.contractNumber),
                undefined,
                {
                  numeric:true,
                  sensitivity:"base"
                }
              );
          });

      state.tickets =
        ticketSnap.docs.map(snap => ({
          id:snap.id,
          ...(snap.data() || {})
        }));
    }

    /* =========================================================
       FILTER OPTIONS
    ========================================================= */

    function uniqueSorted(values){
      return [
        ...new Set(
          values
            .map(clean)
            .filter(Boolean)
        )
      ].sort((a,b) =>
        a.localeCompare(
          b,
          undefined,
          {
            numeric:true,
            sensitivity:"base"
          }
        )
      );
    }

    function fillSelect(
      element,
      values,
      firstLabel
    ){
      const current =
        element.value;

      element.innerHTML =
        `<option value="all">${escapeHtml(firstLabel)}</option>` +
        values
          .map(value =>
            `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`
          )
          .join("");

      const exists =
        [...element.options]
          .some(option =>
            option.value === current
          );

      element.value =
        exists
          ? current
          : "all";
    }

    function populateFilters(){
      fillSelect(
        $("#filterCrop"),
        uniqueSorted(
          state.contracts.map(
            contract => contract.crop
          )
        ),
        "All crops"
      );

      fillSelect(
        $("#filterBuyer"),
        uniqueSorted(
          state.contracts.map(
            contract => contract.buyerName
          )
        ),
        "All buyers"
      );
    }

    /* =========================================================
       FILTERING
    ========================================================= */

    function applyFilters(){
      const crop =
        $("#filterCrop").value;

      const buyer =
        $("#filterBuyer").value;

      const status =
        $("#filterStatus").value;

      const q =
        clean(
          $("#filterSearch").value
        ).toLowerCase();

      state.filteredContracts =
        state.contracts.filter(contract => {

          if(
            crop !== "all" &&
            clean(contract.crop) !== crop
          ){
            return false;
          }

          if(
            buyer !== "all" &&
            clean(contract.buyerName) !== buyer
          ){
            return false;
          }

          if(
            status !== "all" &&
            normalizeStatus(
              contract.status
            ) !== status
          ){
            return false;
          }

          if(q){
            const haystack = [
              contract.contractNumber,
              contract.buyerName,
              contract.customerName,
              contract.crop,
              contract.contractType,
              contract.deliveryLocationName,
              contract.deliveryCity,
              contract.deliveryState
            ]
              .join(" ")
              .toLowerCase();

            if(!haystack.includes(q)){
              return false;
            }
          }

          return true;
        });

      render();
    }

    /* =========================================================
       CONTRACT GRADE CARD
    ========================================================= */

    function renderGradeCard(
      label,
      type,
      value,
      crop
    ){
      const severity =
        gradeSeverity(
          type,
          value,
          crop
        );

      return `
        <div class="grade-card ${severity}">
          <div class="grade-label">
            ${escapeHtml(label)}
          </div>

          <div class="grade-value">
            ${
              value === null

                : `${formatGrade(value)}%`

          </div>

          <div class="grade-note">
            ${escapeHtml(
              gradeDescription(
                type,
                crop
              )
            )}
          </div>
        </div>
      `;
    }

    /* =========================================================

    function renderTicketRow(

      const moisture =

          contract.crop
        );

      const fmClass =
        gradeSeverity(
          "fm",
          fm,
          contract.crop
        );

      const allocated =
        getAllocationBushels(
          ticket,

      const grainSource =
        clean(

          ticket.grainSourceSiteName ||
          ticket.grainSourceFieldName

      return `

          </td>

          <td>

          </td>

          <td>
            ${escapeHtml(
              grainSource || "—"

          <td>
            ${escapeHtml(
              ticket.driverName ||
              ticket.submittedByName ||

            )}
          </td>

          <td class="number-cell">
            ${formatBushels(
              ticket.netBushels
            )}
          </td>

          <td class="number-cell">
            ${formatBushels(

          </td>

          <td class="number-cell grade-cell ${moistureClass}">
            ${

          <td class="number-cell grade-cell ${damageClass}">

            }

          <td class="number-cell grade-cell ${fmClass}">

    /* =========================================================
       PAGE SUMMARY
    ========================================================= */

    function renderSummary(){
      const contracts =
        state.filteredContracts;

      let contracted = 0;
      let delivered = 0;
      let loads = 0;

      contracts.forEach(contract => {
        const stats =
          getContractStats(contract);

        contracted +=
          numberValue(
            contract.contractBushels
          );

        delivered +=
          stats.delivered;

        loads +=
          stats.tickets.length;
      });

      $("#summaryContracts").textContent =
        contracts.length.toLocaleString();

      $("#summaryContracted").textContent =
        `${formatBushels(contracted)} bu`;

      $("#summaryDelivered").textContent =
        `${formatBushels(delivered)} bu`;

      $("#summaryLoads").textContent =
        loads.toLocaleString();

      $("#contractCount").textContent =
        `${contracts.length} contract${
          contracts.length === 1
            ? ""
            : "s"
        }`;
    }

    /* =========================================================
       RENDER
    ========================================================= */

    function render(){
      const list =
        $("#contractList");

      renderSummary();

      if(
        !state.filteredContracts.length
      ){
        list.innerHTML = `
          <div class="empty-state">
            No grain contracts match the current filters.
          </div>
        `;

        return;
      }

      list.innerHTML =
        state.filteredContracts
          .map(renderContractCard)
          .join("");
    }

      try{
        const snap =
          await getDoc(
            doc(

            )

        const data =
          snap.exists()
            ? snap.data() || {}
            : {};

        state.company = {
          name:
            data.name || "",

          address:[
            data.addressStreet || "",
            [
              data.addressCity,
              data.addressState
            ]
              .filter(Boolean)
              .join(", "),
            data.addressZip || ""
          ]
            .filter(Boolean)
            .join(" · "),

          phone:
            data.phone || "",

          email:
            data.email || "",

          logoUrl:
            data?.logo?.url ||
            data?.logoUrl ||
            ""

        console.warn(

          name:"",

    Contract delivery summary with weighted grade averages
    and individual allocated grain tickets.
  </p>

  <div class="contract-list">
    ${contractHtml}
  </div>

  <footer class="print-footer">

    <div>
      Grade averages are weighted by bushels allocated
      to each contract.
    </div>

    <div>
      FarmVista • Grain Contract Report
    </div>

  </footer>

</div>

</body>
</html>
      `;

      let iframe =
        document.getElementById(
          "fv-print-frame"
        );

      if(!iframe){
        iframe =
          document.createElement(
            "iframe"
          );

        iframe.id =
          "fv-print-frame";

        document.body.appendChild(
          iframe
        );
      }

      const docu =
        iframe.contentDocument ||
        iframe.contentWindow.document;

      const win =
        iframe.contentWindow;

      docu.open();
      docu.write(html);
      docu.close();

      setTimeout(() => {
        try{
          win.focus();
          win.print();
        }
        catch(error){
          console.warn(
            "[grain-contract-report] Print failed",
            error
          );

          window.print();
        }
      },500);
    }

    /* =========================================================
       EVENTS
    ========================================================= */

    function wireEvents(){

      $("#btnBack")
        .addEventListener(
          "click",
          () => {
            location.href =
              "/pages/reports/reports-predefined.html";
          }
        );

      $("#btnPrint")
        .addEventListener(
          "click",
          printReport
        );

      $("#btnPrintBottom")
        .addEventListener(
          "click",
          printReport
        );

      [
        "#filterCrop",
        "#filterBuyer",
        "#filterStatus"
      ].forEach(selector => {
        $(selector)
          .addEventListener(
            "change",
            applyFilters
          );
      });

      $("#filterSearch")
        .addEventListener(
          "input",
          applyFilters
        );

      $("#filterClear")
        .addEventListener(
          "click",
          () => {

            $("#filterCrop").value =
              "all";

            $("#filterBuyer").value =
              "all";

            $("#filterStatus").value =
              "all";

            $("#filterSearch").value =
              "";

            applyFilters();
          }
        );
    }

    /* =========================================================
       START
    ========================================================= */

    async function start(){

      const shell =
        document.querySelector(
          "fv-shell"
        );

      if(shell){
        shell.nav =
          NAV_MENU;
      }

      wireEvents();

      try{
        await loadData();

        populateFilters();

        state.filteredContracts =
          [...state.contracts];

        render();
      }
      catch(error){
        console.error(
          "[grain-contract-report] Load failed:",
          error
        );

        $("#contractList").innerHTML = `
          <div class="empty-state">
            Unable to load grain contracts.
            Check Firestore permissions and the browser console.
          </div>
        `;
      }
    }

    start();

  </script>
</head>

<body>

  <fv-shell>

    <div class="wrap">

      <section class="hero">

        <header class="hero-head">

          <div
            class="icon"
            aria-hidden="true"
          >
            🌾
          </div>

          <div>

            <h1>
              Grain Contract Report
            </h1>

            <p class="muted">
              Contract delivery progress, weighted grain
              quality averages, and individual loads
              allocated to each contract.
            </p>

          </div>

        </header>

        <div class="body">

          <!-- TOOLBAR -->

          <div class="toolbar">

            <div class="toolbar-left">

              <button
                id="btnBack"
                type="button"
                class="btn btn-quiet"
              >
                ← Back to Reports
              </button>

              <button
                id="btnPrint"
                type="button"
                class="btn btn-primary"
              >
                Print / Save PDF
              </button>

            </div>

            <div
              id="contractCount"
              class="page-count"
            >
              0 contracts
            </div>

          </div>

          <!-- FILTERS -->

          <div class="filters">

            <div class="filter-field">

              <label
                class="filter-label"
                for="filterCrop"
              >
                Crop
              </label>

              <select
                id="filterCrop"
                class="filter-select"
              >
                <option value="all">
                  All crops
                </option>
              </select>

            </div>

            <div class="filter-field">

              <label
                class="filter-label"
                for="filterBuyer"
              >
                Buyer
              </label>

              <select
                id="filterBuyer"
                class="filter-select"
              >
                <option value="all">
                  All buyers
                </option>
              </select>

            </div>

            <div class="filter-field">

              <label
                class="filter-label"
                for="filterStatus"
              >
                Status
              </label>

              <select
                id="filterStatus"
                class="filter-select"
              >
                <option value="all">
                  All statuses
                </option>

                <option value="open">
                  Open
                </option>

                <option value="pending">
                  Pending
                </option>

                <option value="completed">
                  Completed
                </option>

                <option value="voided">
                  Voided
                </option>

              </select>

            </div>

            <div class="filter-field filter-search">

              <label
                class="filter-label"
                for="filterSearch"
              >
                Search
              </label>

              <input
                id="filterSearch"
                class="filter-input"
                type="search"
                placeholder="Contract #, buyer, customer, destination…"
                autocomplete="off"
              >

            </div>

            <button
              id="filterClear"
              type="button"
              class="btn btn-quiet"
            >
              Clear
            </button>

          </div>

          <!-- COLOR LEGEND -->

          <div class="grade-legend">

            <span class="legend-title">
              Grade Colors
            </span>

            <span class="legend-item">
              <span class="legend-dot good"></span>
              Normal
            </span>

            <span class="legend-item">
              <span class="legend-dot warning"></span>
              Trending High
            </span>

            <span class="legend-item">
              <span class="legend-dot severe"></span>
              Severe
            </span>

          </div>

          <!-- SUMMARY -->

          <div class="summary-grid">

            <div class="summary-card">
              <div class="summary-label">
                Contracts
              </div>
              <div
                id="summaryContracts"
                class="summary-value"
              >
                0
              </div>
            </div>

            <div class="summary-card">
              <div class="summary-label">
                Contracted
              </div>
              <div
                id="summaryContracted"
                class="summary-value"
              >
                0 bu
              </div>
            </div>

            <div class="summary-card">
              <div class="summary-label">
                Delivered
              </div>
              <div
                id="summaryDelivered"
                class="summary-value"
              >
                0 bu
              </div>
            </div>

            <div class="summary-card">
              <div class="summary-label">
                Loads
              </div>
              <div
                id="summaryLoads"
                class="summary-value"
              >
                0
              </div>
            </div>

          </div>

          <!-- CONTRACTS -->

          <section
            id="contractList"
            class="contract-list"
            aria-label="Grain contracts"
          >

            <div class="empty-state">
              Loading grain contracts…
            </div>

          </section>

          <div class="bottom-actions">

            <button
              id="btnPrintBottom"
              type="button"
              class="btn btn-primary"
            >
              Print / Save PDF
            </button>

          </div>

        </div>

      </section>

      <iframe id="fv-print-frame"></iframe>

    </div>

  </fv-shell>

</body>
</html>
