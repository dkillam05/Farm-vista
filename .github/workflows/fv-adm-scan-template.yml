# Triggered 2026-09-11
name: FarmVista ADM scan template

on:
  push:
    paths:
      - '.github/workflows/fv-adm-scan-template.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Wire ADM Decatur grade template into scanner
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('pages/grain/grain-ticket-scan.html')
          s = p.read_text()

          old = "const CORE_URL = '/pages/grain/grain-ticket-scan-core.html?v=20260911-3';"
          new = "const CORE_URL = '/pages/grain/grain-ticket-scan-core.html?v=20260911-4';"
          assert old in s, 'scanner core version marker not found'
          s = s.replace(old, new, 1)

          marker = "      html = replaceRequired(html, '/js/grain-ticket-ocr-grade-normalizer.js?v=20260909-6', '/js/grain-ticket-ocr-grade-normalizer.js?v=20260909-6', 'grade normalizer version');\n"
          addition = marker + "\n      /* ADM Processing — Decatur uses stable right-side row codes:\n         AC=TW, GN=MO, OP=DM, IF=HD, CO=FM, SR=SP. Load this BEFORE\n         the scanner module so it can correct the OCR JSON before the\n         generic grade normalizer sees it. */\n      html = replaceRequired(\n        html,\n        '<script type=\"module\">',\n        '<script src=\"/js/grain-ticket-adm-decatur-grade-fix.js?v=20260911-2\"></script>\\n<script type=\"module\">',\n        'ADM Decatur grade template loader'\n      );\n"
          assert marker in s, 'grade normalizer wrapper marker not found'
          if 'ADM Decatur grade template loader' not in s:
              s = s.replace(marker, addition, 1)

          p.write_text(s)
          PY

      - name: Validate scanner wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('pages/grain/grain-ticket-scan.html').read_text()
          for script in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.mjs', delete=False) as f:
                  f.write(script)
                  name = f.name
              result = subprocess.run(['node', '--check', name], capture_output=True, text=True)
              if result.returncode:
                  print(result.stderr)
                  raise SystemExit(result.returncode)
          PY

      - name: Commit scanner template wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/grain/grain-ticket-scan.html
          git diff --cached --quiet && exit 0
          git commit -m 'Load ADM Decatur OCR grade template before scan parsing'
          git push
