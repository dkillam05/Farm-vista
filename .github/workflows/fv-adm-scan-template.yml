name: FarmVista ADM scan template

on:
  push:
    paths:
      - '.github/workflows/fv-adm-scan-template.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Harden ADM Decatur fixed grade grid
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('js/grain-ticket-adm-decatur-grade-fix.js')
          s = p.read_text()

          old = '''  function patchAdm(data) {
    const root = responseRoot(data);
    if (!root?.grainTicket) return false;
    const text = documentText(data, root);
    if (!isAdmDecatur(root,text)) return false;
    let changed = false;
    changed = patchField(root,'testWeight',valueBeforeAnchor(text,'AC')) || changed;
    changed = patchField(root,'moisture',valueBeforeAnchor(text,'GN')) || changed;
    changed = patchField(root,'damage',valueBeforeAnchor(text,'OP')) || changed;
    changed = patchField(root,'foreignMaterial',valueBeforeAnchor(text,'CO')) || changed;
    return changed;
  }
'''

          new = r'''  /*
    ADM DECATUR FIXED GRADE GRID

    ADM prints more grade rows than FarmVista currently tracks. Do NOT treat
    the first four grade values as TW/MO/DM/FM. The stable printed row order is:

      TW  <value>  AC ... MU ...   -> FarmVista Test Weight
      MO  <value>  GN ... PR ...   -> FarmVista Moisture
      DM  <value>  OP ... FU ...   -> FarmVista Damage
      HD  <value>  IF ...          -> recognized/ignored
      FM  <value>  CO ...          -> FarmVista Foreign Material
      SP  <value>  SR ...          -> recognized/ignored

    The right-side codes are useful anchors when OCR damages the tiny left-side
    labels. Poor cameras can also damage a right-side code (for example OP may
    OCR as 60). In that case we may recover DM only from its known position
    BETWEEN the MO/GN row and the ignored HD/IF row. We never collapse the
    ignored rows, so HD or SP cannot slide into DM/FM.
  */
  function admGradeBlock(text) {
    const source = String(text || '').replace(/\r/g,'\n');
    const start = source.search(/Grade\s+U\.?S\.?/i);
    if (start < 0) return null;
    let block = source.slice(start, start + 1200);
    const stop = block.search(/(?:other\s+factors|graded\s+by|\*{2,})/i);
    if (stop > 0) block = block.slice(0, stop);

    const direct = {
      testWeight: valueBeforeAnchor(block,'AC'),
      moisture: valueBeforeAnchor(block,'GN'),
      damage: valueBeforeAnchor(block,'OP'),
      foreignMaterial: valueBeforeAnchor(block,'CO')
    };

    const labeled = label => {
      const m = block.match(new RegExp('(?:^|\\n|\\s)' + label + '\\s*[:=-]?\\s*([0-9]{1,3}(?:\\.[0-9]{1,2})?)\\b','i'));
      const n = m ? Number(m[1]) : NaN;
      return Number.isFinite(n) ? n : null;
    };

    if (!Number.isFinite(direct.testWeight)) direct.testWeight = labeled('TW');
    if (!Number.isFinite(direct.moisture)) direct.moisture = labeled('MO');
    if (!Number.isFinite(direct.damage)) direct.damage = labeled('DM');
    if (!Number.isFinite(direct.foreignMaterial)) direct.foreignMaterial = labeled('FM');

    // Last-resort DM recovery for a damaged DM/OP row. The ignored HD row is
    // deliberately retained as the lower boundary so grade positions cannot shift.
    if (!Number.isFinite(direct.damage)) {
      const gn = block.search(/\bGN\b/i);
      const ifRow = block.search(/\bIF\b/i);
      if (gn >= 0 && ifRow > gn) {
        const between = block.slice(gn, ifRow);
        const nums = [...between.matchAll(/(?:^|\s)(\d{1,2}\.\d{1,2})(?=\s|$)/g)]
          .map(m => Number(m[1]))
          .filter(Number.isFinite);
        // ADM auxiliary columns in this interval are normally 0.0. A single
        // non-zero grade-sized value is therefore the damaged DM-row value.
        const candidates = nums.filter(n => n > 0 && n <= 20);
        if (candidates.length === 1) direct.damage = candidates[0];
      }
    }

    return direct;
  }

  function patchAdm(data) {
    const root = responseRoot(data);
    if (!root?.grainTicket) return false;
    const text = documentText(data, root);
    if (!isAdmDecatur(root,text)) return false;
    const grades = admGradeBlock(text) || {};
    let changed = false;
    changed = patchField(root,'testWeight',grades.testWeight) || changed;
    changed = patchField(root,'moisture',grades.moisture) || changed;
    changed = patchField(root,'damage',grades.damage) || changed;
    changed = patchField(root,'foreignMaterial',grades.foreignMaterial) || changed;
    console.log('[Grain Ticket] ADM Decatur FIXED-GRID template:', {
      TW:grades.testWeight, MO:grades.moisture, DM:grades.damage, FM:grades.foreignMaterial
    });
    return changed;
  }
'''

          if old not in s:
              raise SystemExit('ADM patch block not found; refusing unsafe edit')
          s = s.replace(old, new, 1)
          s = s.replace('__FV_ADM_DECATUR_GRADE_FIX_20260911', '__FV_ADM_DECATUR_GRADE_FIX_20260915', 2)
          p.write_text(s)

          scan = Path('pages/grain/grain-ticket-scan.html')
          t = scan.read_text()
          t = t.replace('/js/grain-ticket-adm-decatur-grade-fix.js?v=20260911-3',
                        '/js/grain-ticket-adm-decatur-grade-fix.js?v=20260915-1')
          scan.write_text(t)
          PY

      - name: Validate ADM helper JavaScript
        run: node --check js/grain-ticket-adm-decatur-grade-fix.js

      - name: Commit ADM template update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/grain-ticket-adm-decatur-grade-fix.js pages/grain/grain-ticket-scan.html
          if git diff --cached --quiet; then
            echo 'No ADM template changes required.'
            exit 0
          fi
          git commit -m 'Harden ADM Decatur fixed grade grid parsing'
          git push
