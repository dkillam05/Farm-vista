name: FarmVista ADM scan template

on:
  push:
    paths:
      - '.github/workflows/fv-adm-scan-template.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Load ADM Decatur grade parser in scanner
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('pages/grain/grain-ticket-scan.html')
          s = p.read_text()

          s = s.replace(
              "const CORE_URL = '/pages/grain/grain-ticket-scan-core.html?v=20260911-3';",
              "const CORE_URL = '/pages/grain/grain-ticket-scan-core.html?v=20260911-4';",
              1,
          )

          old = "html = replaceRequired(html, '/js/grain-ticket-ocr-grade-normalizer.js?v=20260909-6', '/js/grain-ticket-ocr-grade-normalizer.js?v=20260909-6', 'grade normalizer version');"
          new = "html = replaceRequired(html, '/js/grain-ticket-ocr-grade-normalizer.js?v=20260909-6', '/js/grain-ticket-ocr-grade-normalizer.js?v=20260911-7', 'grade normalizer version');"
          if old in s:
              s = s.replace(old, new, 1)

          loader = '''
      /* ADM Processing — Decatur ticket template. The stable right-side row
         codes are AC=TW, GN=MO, OP=DM, IF=HD, CO=FM, SR=SP. */
      if (!html.includes('/js/grain-ticket-adm-decatur-grade-fix.js')) {
        html = html.replace(
          '<script type="module">',
          '<script src="/js/grain-ticket-adm-decatur-grade-fix.js?v=20260911-3"></script>\\n<script type="module">'
        );
      }
'''
          marker = "      const oldAlias = `"
          if 'ADM Processing — Decatur ticket template' not in s:
              assert marker in s, 'scanner insertion marker not found'
              s = s.replace(marker, loader + '\n' + marker, 1)

          p.write_text(s)
          PY

      - name: Validate wrapper JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('pages/grain/grain-ticket-scan.html').read_text()
          for script in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.mjs', delete=False) as f:
                  f.write(script)
                  name = f.name
              result = subprocess.run(['node', '--check', name], capture_output=True, text=True)
              if result.returncode:
                  print(result.stderr)
                  raise SystemExit(result.returncode)
          PY

      - name: Commit scanner wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/grain/grain-ticket-scan.html
          if git diff --cached --quiet; then
            echo 'No scanner changes required.'
            exit 0
          fi
          git commit -m 'Activate ADM Decatur grade template in scanner'
          git push
