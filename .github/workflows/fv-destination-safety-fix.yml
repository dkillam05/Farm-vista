name: FarmVista destination safety fix

on:
  push:
    paths:
      - '.github/workflows/fv-destination-safety-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply destination safety patch
        run: python3 .github/scripts/fv_destination_safety_patch.py

      - name: Validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for filename in ['pages/grain/grain-ticket-detail.html','pages/grain/grain-ticket-scan-core.html','pages/grain/grain-ticket-scan.html']:
              text = Path(filename).read_text()
              scripts = re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', text, re.I)
              for i, script in enumerate(scripts):
                  if not script.strip():
                      continue
                  path = Path(tempfile.gettempdir()) / f'fv-{Path(filename).stem}-{i}.mjs'
                  path.write_text(script)
                  subprocess.run(['node','--check',str(path)], check=True)
          subprocess.run(['node','--check','js/version.js'], check=True)
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/grain/grain-ticket-detail.html pages/grain/grain-ticket-scan-core.html pages/grain/grain-ticket-scan.html js/version.js
          git commit -m 'Prevent destination guesses across conflicting elevator locations [skip auto-version]'
          git pull --rebase origin main
          git push
