name: FarmVista hauling crop force binding
on:
  push:
    paths: ['.github/workflows/fv-hauling-crop-force-bind.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch hauling crop binding and cache bust
        shell: python
        run: |
          from pathlib import Path
          import re

          js = Path('js/grain-hauling-jobs.js')
          s = js.read_text()

          # Strengthen the already-existing crop selector so the selected OPTION
          # itself is marked, not only select.value.
          old = '''  select.value =\n    match?.value ||\n    "";\n\n}\n\n\nfunction setJobModalMode('''
          new = '''  Array.from(\n    select.options\n  ).forEach(\n    option => {\n      option.selected =\n        option === match;\n    }\n  );\n\n\n  select.value =\n    match?.value ||\n    "";\n\n\n  select.dataset.fvExpectedCrop =\n    desired;\n\n}\n\n\nfunction setJobModalMode('''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'select.dataset.fvExpectedCrop' not in s:
              raise SystemExit('setJobCropSelectValue end marker not found')

          # Re-apply the row's saved crop after the modal is visible and again
          # after the compatibility helper finishes its delayed select refresh.
          old = '''  $(\n    "hauling-job-modal"\n  )\n    ?.classList\n    .add(\n      "open"\n    );\n\n\n  document.body.style\n    .overflow =\n      "hidden";\n\n}\n\n\nfunction closeJobModal()'''
          new = '''  $(\n    "hauling-job-modal"\n  )\n    ?.classList\n    .add(\n      "open"\n    );\n\n\n  requestAnimationFrame(\n    () =>\n      setJobCropSelectValue(\n        job\n      )\n  );\n\n\n  setTimeout(\n    () =>\n      setJobCropSelectValue(\n        job\n      ),\n    950\n  );\n\n\n  document.body.style\n    .overflow =\n      "hidden";\n\n}\n\n\nfunction closeJobModal()'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'setTimeout(\n    () =>\n      setJobCropSelectValue(' not in s:
              raise SystemExit('openEditJob modal marker not found')

          js.write_text(s)

          html = Path('pages/grain/grain-contracts.html')
          h = html.read_text()
          h2, count = re.subn(
              r'<script type="module" src="/js/grain-hauling-jobs\.js(?:\?v=[^"]*)?"></script>',
              '<script type="module" src="/js/grain-hauling-jobs.js?v=20260909-1131"></script>',
              h,
              count=1
          )
          if count != 1:
              raise SystemExit('grain-hauling-jobs script tag not found')
          html.write_text(h2)

      - name: Validate JavaScript
        run: node --check js/grain-hauling-jobs.js
      - name: Commit fix
        run: |
          rm -f .github/workflows/fv-hauling-crop-force-bind.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/grain-hauling-jobs.js pages/grain/grain-contracts.html .github/workflows/fv-hauling-crop-force-bind.yml
          git commit -m 'Force saved crop into hauling job edit dropdown [skip auto-version]'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
