name: FarmVista ticket status repair

on:
  push:
    paths:
      - '.github/workflows/farmvista-ticket-status-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair grain ticket status and source labels
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          dashboard = Path('pages/grain/grain-ticket.html')
          text = dashboard.read_text()

          old_job_check = '''function ticketHasHaulingJob(\n    ticket\n  ) {\n\n    return !!String(\n      ticket?.haulingJobId ||\n      ticket?.grainHaulingJobId ||\n      ""\n    ).trim();\n\n  }'''
          new_job_check = '''function ticketHasHaulingJob(\n    ticket\n  ) {\n\n    return !!String(\n      ticket?.haulingJobId ||\n      ticket?.grainHaulingJobId ||\n      ticket?._linkedHaulingJobId ||\n      ""\n    ).trim();\n\n  }'''
          if old_job_check not in text:
              raise SystemExit('Dashboard hauling-job check pattern was not found.')
          text = text.replace(old_job_check, new_job_check, 1)

          old_loop = '''      for (\n        const ticket of tickets\n      ) {\n\n        if (\n          !ticketIsVerifiedForPosting(\n            ticket\n          )\n        ) {\n\n          continue;\n\n        }\n\n\n        if (\n          ticketAlreadyPosted(\n            ticket\n          )\n        ) {\n\n          continue;\n\n        }\n\n\n        const load =\n          postingFindLinkedLoad(\n            ticket,\n            loads\n          );\n\n\n        if (\n          !load\n        ) {\n\n          continue;\n\n        }'''
          new_loop = '''      for (\n        const ticket of tickets\n      ) {\n\n        /*\n          A ticket linked to a FarmVista load inherits that load's\n          hauling job for dashboard status, even when an older scan\n          record did not copy haulingJobId onto the ticket document.\n\n          This keeps the dashboard, KPI counts, and detail page in\n          agreement without requiring the driver to re-save the ticket.\n        */\n        const load =\n          postingFindLinkedLoad(\n            ticket,\n            loads\n          );\n\n\n        if (\n          load &&\n          !ticketHasHaulingJob(\n            ticket\n          )\n        ) {\n\n          const linkedHaulingJobId =\n            postingClean(\n              load.haulingJobId\n            );\n\n\n          if (\n            linkedHaulingJobId\n          ) {\n\n            ticket._linkedHaulingJobId =\n              linkedHaulingJobId;\n\n          }\n\n        }\n\n\n        if (\n          !ticketIsVerifiedForPosting(\n            ticket\n          )\n        ) {\n\n          continue;\n\n        }\n\n\n        if (\n          ticketAlreadyPosted(\n            ticket\n          )\n        ) {\n\n          continue;\n\n        }\n\n\n        if (\n          !load\n        ) {\n\n          continue;\n\n        }'''
          if old_loop not in text:
              raise SystemExit('Dashboard posting loop pattern was not found.')
          text = text.replace(old_loop, new_loop, 1)
          dashboard.write_text(text)

          detail = Path('pages/grain/grain-ticket-detail.html')
          text = detail.read_text()
          old_source = '''    elements.sourcePill.textContent =\n      clean(ticket.entryMethod) === "ocr_scan"\n        ? "OCR Scan"\n        : "Manual Entry";'''
          new_source = '''    const entryMethod =\n      clean(\n        ticket.entryMethod\n      )\n        .toLowerCase();\n\n\n    elements.sourcePill.textContent =\n      entryMethod === "ocr_scan"\n        ? "OCR Scan"\n        : entryMethod === "guest_sms_scan"\n          ? "SMS Scan"\n          : entryMethod === "manual_entry" ||\n            entryMethod === "manual"\n            ? "Manual Entry"\n            : entryMethod\n              ? entryMethod\n                  .replace(/_/g," ")\n                  .replace(/\\b\\w/g,char => char.toUpperCase())\n              : "Unknown";'''
          if old_source not in text:
              raise SystemExit('Detail entry-method label pattern was not found.')
          text = text.replace(old_source, new_source, 1)
          detail.write_text(text)
          PY

          git diff --check
          git diff -- pages/grain/grain-ticket.html pages/grain/grain-ticket-detail.html

      - name: Commit repair and remove temporary runner
        shell: bash
        run: |
          git config user.name 'FarmVista Repair'
          git config user.email 'farmvista-repair@users.noreply.github.com'
          git rm .github/workflows/farmvista-ticket-status-repair.yml
          git add pages/grain/grain-ticket.html pages/grain/grain-ticket-detail.html
          git commit -m 'Fix grain ticket hauling-job status and scan label'
          git push origin HEAD:main
