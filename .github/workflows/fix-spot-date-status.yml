name: Fix spot date window statuses

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-spot-date-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch hauling and contract spot statuses
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Hauling jobs: zero-bushel Spot Loads are date-window driven.
          p = Path('js/grain-hauling-jobs-core.js')
          s = p.read_text()
          old = '''  if (\n    end &&\n    end <\n    localISO() &&\n    jobRemainingBushels(\n      job\n    ) > 0.005\n  ) {\n\n    return \"past_due\";\n\n  }'''
          new = '''  if (\n    end &&\n    end <\n    localISO()\n  ) {\n\n    // Zero-bushel hauling jobs are Spot Loads. Their status is driven\n    // only by the delivery window: Upcoming before, Active during,\n    // Completed after. Regular unfilled jobs remain Past Due.\n    if (\n      jobStartingBushels(\n        job\n      ) <= 0.005\n    ) {\n\n      return \"complete\";\n\n    }\n\n\n    if (\n      jobRemainingBushels(\n        job\n      ) > 0.005\n    ) {\n\n      return \"past_due\";\n\n    }\n\n\n    return \"complete\";\n\n  }'''
          if old not in s:
              raise SystemExit('Hauling status target not found')
          p.write_text(s.replace(old, new, 1))

          # Contracts: zero-bushel Spot contracts follow their date window too.
          p = Path('js/grain-contracts.js')
          s = p.read_text()
          marker = '''function getContractStatus(\n  contract\n) {\n  if (contract?.manualClosed === true) {\n    return \"complete\";\n  }'''
          insert = '''function getContractStatus(\n  contract\n) {\n  if (contract?.manualClosed === true) {\n    return \"complete\";\n  }\n\n  // Zero-bushel contracts are Spot contracts. Keep them Pending before\n  // the delivery window, Open during it, and Completed after it.\n  const spotContractBushels =\n    numberValue(\n      contract?.contractBushels ??\n      contract?.bushels ??\n      contract?.quantity ??\n      contract?.totalBushels\n    );\n\n  if (spotContractBushels <= EPSILON) {\n    const now = new Date();\n    const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, \"0\")}-${String(now.getDate()).padStart(2, \"0\")}`;\n    const start = clean(\n      contract?.deliveryStart ??\n      contract?.deliveryStartDate ??\n      contract?.startDate\n    );\n    const end = clean(\n      contract?.deliveryEnd ??\n      contract?.deliveryEndDate ??\n      contract?.endDate\n    );\n\n    if (start && start > today) {\n      return \"pending\";\n    }\n\n    if (end && end < today) {\n      return \"complete\";\n    }\n\n    return \"open\";\n  }'''
          if marker not in s:
              raise SystemExit('Contract status target not found')
          p.write_text(s.replace(marker, insert, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'FarmVista Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/grain-hauling-jobs-core.js js/grain-contracts.js
          git diff --cached --quiet && exit 0
          git commit -m 'Make spot jobs and contracts date-window status aware'
          git push
