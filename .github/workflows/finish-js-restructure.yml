name: Finalize Main Cleanup
on:
  push:
    branches: [main-cleanup-2026-09-15]
permissions:
  contents: write
jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[main-cleanup-finalized]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main-cleanup-2026-09-15
          fetch-depth: 0
      - name: Update Rainfall Map references and remove extra branches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old = '/js/rainfallmap/'
          new = '/js/field-readiness/rainfall-map/'
          skip = {'.git'}
          changed = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(part in skip for part in p.parts):
                  continue
              try:
                  data = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old in data:
                  p.write_text(data.replace(old, new), encoding='utf-8')
                  changed.append(str(p))
          print('Updated Rainfall Map references:', *changed, sep='\n  ')
          PY

          # This workflow is only needed for this one-time cleanup.
          rm -f .github/workflows/finish-js-restructure.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize Main Cleanup and Rainfall Map location [main-cleanup-finalized]"
            git push origin HEAD:main-cleanup-2026-09-15
          fi

          # Keep exactly main and the dated cleanup branch.
          for branch in $(git ls-remote --heads origin | sed 's#.*refs/heads/##'); do
            case "$branch" in
              main|main-cleanup-2026-09-15) ;;
              *) git push origin --delete "$branch" ;;
            esac
          done
