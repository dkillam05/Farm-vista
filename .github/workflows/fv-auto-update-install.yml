name: FarmVista automatic PWA update install

on:
  push:
    paths:
      - '.github/workflows/fv-auto-update-install.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install automatic update loader and bump app version
        run: python .github/scripts/fv_auto_update_install.py

      - name: Validate JavaScript
        run: |
          node --check js/version.js
          node --check js/fv-auto-update.js

      - name: Commit automatic updater
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/version.js js/fv-auto-update.js
          git commit -m 'Auto-refresh FarmVista when a new version deploys'
          git push
