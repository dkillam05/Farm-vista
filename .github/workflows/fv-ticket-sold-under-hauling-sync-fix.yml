name: FarmVista Sold Under hauling sync one-shot

on:
  push:
    paths:
      - '.github/workflows/fv-ticket-sold-under-hauling-sync-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Sold Under hauling sync patch
        run: python .github/scripts/fv_ticket_sold_under_job_patch.py

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check js/grain-hauling-jobs.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('pages/grain/grain-ticket-detail.html')
          scripts = re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', html.read_text(), re.I)
          for i, script in enumerate(scripts):
              if not script.strip():
                  continue
              path = Path(tempfile.gettempdir()) / f'fv-detail-{i}.mjs'
              path.write_text(script)
              subprocess.run(['node', '--check', str(path)], check=True)
          PY

      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/fv-ticket-sold-under-hauling-sync-fix.yml
          rm -f .github/scripts/fv_ticket_sold_under_job_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/grain/grain-ticket-detail.html pages/grain/grain-contracts.html js/grain-hauling-jobs.js .github/workflows/fv-ticket-sold-under-hauling-sync-fix.yml .github/scripts/fv_ticket_sold_under_job_patch.py
          git commit -m 'Keep hauling job when Sold Under is learned from ticket [skip auto-version]'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
