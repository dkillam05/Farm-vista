name: FarmVista driver patch
on:
  push:
    paths:
      - '.github/workflows/fv-driver-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Could not find expected text in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          loadout = 'pages/grain/grain-ticket.html'
          replace_once(loadout, '<label for="loadout-subdriver-first">First Name</label>', '<label for="loadout-subdriver-first">First Name / Nickname *</label>')
          replace_once(loadout, '<label for="loadout-subdriver-cell">Cell Number</label>', '<label for="loadout-subdriver-cell">Phone Number *</label>')
          replace_once(loadout,
'''    if (!firstName || !lastName || !phone) {
      loShowMessage(
        "Enter the subcontractor driver's first name, last name, and a valid 10-digit cell number.",
        "error"
      );
      return;
    }''',
'''    if (!firstName || !phone) {
      loShowMessage(
        "Enter the subcontractor driver's first name / nickname and a valid 10-digit phone number.",
        "error"
      );
      return;
    }''')
          replace_once(loadout, '      name:`${firstName} ${lastName}`,', '      name:[firstName,lastName].filter(Boolean).join(" "),')

          contractor = 'pages/office/teams-and-partners/contractors-buttons/contractors-edit.html'
          replace_once(contractor, '<label for="driverFirst">First Name<span class="req">*</span></label>', '<label for="driverFirst">First Name / Nickname<span class="req">*</span></label>')
          replace_once(contractor, '<label for="driverLast">Last Name<span class="req">*</span></label>', '<label for="driverLast">Last Name</label>')
          replace_once(contractor, '<label for="driverCell">Cell Number<span class="req">*</span></label>', '<label for="driverCell">Phone Number<span class="req">*</span></label>')
          replace_once(contractor,
'''      if(!firstName || !lastName){
        alert("Enter the driver's first and last name.");
        return;
      }''',
'''      if(!firstName){
        alert("Enter the driver's first name / nickname.");
        $("driverFirst").focus();
        return;
      }''')
          replace_once(contractor, '        name:`${firstName} ${lastName}`,', '        name:[firstName,lastName].filter(Boolean).join(" "),')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/grain/grain-ticket.html pages/office/teams-and-partners/contractors-buttons/contractors-edit.html
          git commit -m "Make subcontractor driver last name optional"
          git push
