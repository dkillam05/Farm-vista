name: FarmVista force Scoular scanner bridge refresh

on:
  push:
    paths:
      - '.github/workflows/fv-force-scoular-cache-bump.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Force bridge cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('js/version.js')
          s=p.read_text()
          s,n=re.subn(r"/js/grain-ticket-adm-decatur-grade-fix\.js\?v=[^']+", "/js/grain-ticket-adm-decatur-grade-fix.js?v=20260916-10", s)
          if n != 1:
              raise SystemExit(f'Expected exactly one scanner bridge URL, found {n}')
          p.write_text(s)
          PY
      - name: Commit cache bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/version.js
          git commit -m 'Force fresh Scoular scanner template bridge [skip auto-version]'
          git push
