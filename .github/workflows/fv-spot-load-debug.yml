name: FarmVista spot load diagnostic
on:
  push:
    paths:
      - '.github/workflows/fv-spot-load-debug.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract ticket-detail spot-load code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('pages/grain/grain-ticket-detail.html').read_text()
          markers=[
            'No active hauling job is available for this crop, destination, and ticket date.',
            'hauling_job_not_assigned',
            'selectedContract.id',
            'deliveryLocationId:',
            'buyerId:',
            'customerId:',
            'contractId:',
            'haulingJobId:'
          ]
          out=[]
          for m in markers:
            out.append('\n===== '+m+' =====\n')
            pos=0
            n=0
            while True:
              i=s.find(m,pos)
              if i<0: break
              n+=1
              out.append(s[max(0,i-1800):min(len(s),i+3000)])
              pos=i+len(m)
              if n>=6: break
          Path('.github/spot-load-debug.txt').write_text('\n'.join(out))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/spot-load-debug.txt
          git commit -m 'Capture spot load diagnostic [skip auto-version]'
          git pull --rebase origin main
          git push
