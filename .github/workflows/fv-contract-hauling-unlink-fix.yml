name: Fix contract hauling-job unlink behavior

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fv-contract-hauling-unlink-fix.yml'

permissions:
  contents: write

jobs:
  patch-unlink:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch hauling-job unlink and contract void behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # -------------------------------------------------------
          # 1) Hauling Jobs DND: make the Unlinked Contracts list
          #    itself a valid unlink target on desktop and touch.
          # -------------------------------------------------------
          path = Path('js/grain-hauling-jobs.js')
          text = path.read_text()

          start = text.find('function setupUnassignDrop() {')
          end = text.find('function beginPointerHold(', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate setupUnassignDrop block')

          replacement = r'''function setupUnassignDrop() {

  const targets = [
    $("hauling-unassign-drop"),
    $("hauling-unlinked-contract-list")
  ].filter(Boolean);

  targets.forEach(
    target => {

      if (
        target.dataset.haulingUnassignBound ===
          "1"
      ) {
        return;
      }

      target.dataset.haulingUnassignBound =
        "1";

      target.addEventListener(
        "dragover",
        event => {

          const contract =
            state.contracts.find(
              item =>
                item.id ===
                state.draggingContractId
            );

          if (
            !contract ||
            !clean(
              contract?.haulingJobId
            )
          ) {
            return;
          }

          event.preventDefault();
          clearDndHighlights();
          target.classList.add(
            "drag-over"
          );
        }
      );

      target.addEventListener(
        "dragleave",
        event => {
          if (
            !event.relatedTarget ||
            !target.contains(
              event.relatedTarget
            )
          ) {
            target.classList.remove(
              "drag-over"
            );
          }
        }
      );

      target.addEventListener(
        "drop",
        async event => {

          event.preventDefault();

          const contractId =
            state.draggingContractId ||
            clean(
              event.dataTransfer
                ?.getData(
                  "text/plain"
                )
            );

          clearDndHighlights();

          if (
            contractId
          ) {
            await unlinkContract(
              contractId
            );
          }
        }
      );
    }
  );
}


'''

          text = text[:start] + replacement + text[end:]

          old_touch = '''  const unassign =\n    targetElement.closest(\n      "#hauling-unassign-drop"\n    );'''
          new_touch = '''  const unassign =\n    targetElement.closest(\n      "#hauling-unassign-drop, #hauling-unlinked-contract-list"\n    );'''
          if old_touch not in text:
              raise SystemExit('Could not locate touch unassign selector')
          text = text.replace(old_touch, new_touch, 1)

          text = text.replace(
              'Drag a contract from the left onto the correct hauling job. Location is checked when you drop it.',
              'Drag an unlinked contract onto the correct hauling job. To undo a link, drag the linked contract back into Unlinked Contracts. Location is checked when you drop it.'
          )

          path.write_text(text)

          # -------------------------------------------------------
          # 2) Main Grain Contracts page: voiding an empty contract
          #    must remove its hauling-job planning link atomically.
          # -------------------------------------------------------
          path = Path('js/grain-contracts.js')
          text = path.read_text()

          marker = '''            voidedOpenBushels:\n              numberValue(\n                latest.openBushels\n              ),\n\n            updatedAt:\n              serverTimestamp()'''
          insert = '''            voidedOpenBushels:\n              numberValue(\n                latest.openBushels\n              ),\n\n            haulingJobId:\n              null,\n\n            haulingJobName:\n              null,\n\n            haulingJobLinkedAt:\n              null,\n\n            haulingJobLinkedByUid:\n              null,\n\n            haulingJobLinkedByName:\n              null,\n\n            haulingJobLinkedByEmail:\n              null,\n\n            updatedAt:\n              serverTimestamp()'''
          if marker not in text:
              raise SystemExit('Could not locate main contract void payload')
          text = text.replace(marker, insert, 1)

          local_marker = '''    contract.voided = true;\n    contract.voidReason = reason;'''
          local_insert = '''    contract.voided = true;\n    contract.voidReason = reason;\n    contract.haulingJobId = null;\n    contract.haulingJobName = null;'''
          if local_marker not in text:
              raise SystemExit('Could not locate main contract local void update')
          text = text.replace(local_marker, local_insert, 1)
          path.write_text(text)

          # -------------------------------------------------------
          # 3) Legacy contract-list page: apply the same rule there.
          # -------------------------------------------------------
          path = Path('js/grain-contract-list.js')
          text = path.read_text()

          marker = '''      voidedOpenBushels:\n        numberValue(\n          activeContract.openBushels\n        ),\n\n      updatedAt:\n        serverTimestamp()'''
          insert = '''      voidedOpenBushels:\n        numberValue(\n          activeContract.openBushels\n        ),\n\n      haulingJobId:\n        null,\n\n      haulingJobName:\n        null,\n\n      haulingJobLinkedAt:\n        null,\n\n      haulingJobLinkedByUid:\n        null,\n\n      haulingJobLinkedByName:\n        null,\n\n      haulingJobLinkedByEmail:\n        null,\n\n      updatedAt:\n        serverTimestamp()'''
          if marker not in text:
              raise SystemExit('Could not locate legacy contract void payload')
          text = text.replace(marker, insert, 1)
          path.write_text(text)
          PY

      - name: Commit unlink fix
        shell: bash
        run: |
          if git diff --quiet -- js/grain-hauling-jobs.js js/grain-contracts.js js/grain-contract-list.js; then
            echo "No changes needed."
            exit 0
          fi

          git config user.name "FarmVista Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/grain-hauling-jobs.js js/grain-contracts.js js/grain-contract-list.js
          git commit -m "Fix contract hauling-job unlink behavior [skip auto-version]"
          git push
