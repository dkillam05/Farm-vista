name: Fix contract hauling-job unlink behavior

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fv-contract-hauling-unlink-fix.yml'

permissions:
  contents: write

jobs:
  patch-unlink:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply combine calibration patch
        run: python3 .github/scripts/fv_combine_calibration_flow_fix.py

      - name: Restore workflow and remove one-time helpers
        run: |
          git checkout HEAD^ -- .github/workflows/fv-contract-hauling-unlink-fix.yml
          rm -f .github/scripts/fv_combine_calibration_flow_fix.py
          rm -f .github/workflows/fv-combine-calibration-flow-fix.yml

      - name: Commit patched FarmVista file
        run: |
          git config user.name "FarmVista Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/calculators/calc-combine-yield-calibration.html .github/workflows/fv-contract-hauling-unlink-fix.yml .github/scripts/fv_combine_calibration_flow_fix.py .github/workflows/fv-combine-calibration-flow-fix.yml
          git commit -m "Improve combine calibration save flow [skip auto-version]"
          git pull --rebase origin main
          git push origin main
