name: Fix contract hauling-job unlink behavior

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fv-contract-hauling-unlink-fix.yml'

permissions:
  contents: write

jobs:
  patch-unlink:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/fix-contract-hauling-unlink.py

      - name: Commit patched FarmVista files
        run: |
          if git diff --quiet -- js/grain-hauling-jobs.js js/grain-contracts.js js/grain-contract-list.js; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "FarmVista Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/grain-hauling-jobs.js js/grain-contracts.js js/grain-contract-list.js
          git commit -m "Fix contract hauling-job unlink behavior [skip auto-version]"
          git pull --rebase origin main
          git push origin main
