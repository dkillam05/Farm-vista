name: FarmVista Scoular scanner cache refresh
on:
  push:
    paths:
      - '.github/workflows/fv-scoular-cache-refresh.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cache refresh
        run: python3 .github/scripts/fv_scoular_cache_refresh.py
      - name: Validate
        run: |
          grep -q 'grain-ticket-ocr-grade-normalizer.js?v=20260909-5' pages/grain/grain-ticket-scan-core.html
          grep -q 'grain-ticket-scan-core.html?v=20260909-4' pages/grain/grain-ticket-scan.html
          grep -q 'number:  "09.09.08"' js/version.js
          node --check js/version.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "FarmVista Bot"
          git config user.email "actions@farmvista.app"
          git add pages/grain/grain-ticket-scan-core.html pages/grain/grain-ticket-scan.html js/version.js
          git commit -m "Refresh Scoular grade parser cache and bump 09.09.08 [skip auto-version]"
          git pull --rebase origin main
          git push origin HEAD:main
