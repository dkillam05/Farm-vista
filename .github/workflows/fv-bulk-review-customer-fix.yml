name: FarmVista bulk review customer correction

on:
  push:
    paths:
      - '.github/workflows/fv-bulk-review-customer-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/fv_bulk_review_customer_fix.py

      - name: Validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('pages/grain/grain-ticket-detail.html').read_text()
          scripts = re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', html, re.I)
          for i, script in enumerate(scripts):
              if not script.strip():
                  continue
              path = Path(tempfile.gettempdir()) / f'fv-detail-{i}.mjs'
              path.write_text(script)
              subprocess.run(['node', '--check', str(path)], check=True)
          subprocess.run(['node', '--check', 'js/version.js'], check=True)
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/grain/grain-ticket-detail.html js/version.js
          git commit -m 'Fix bulk review customer correction and bump 09.09.02 [skip auto-version]'
          git pull --rebase origin main
          git push
