name: FarmVista bulk review customer correction
on:
  push:
    paths:
      - .github/workflows/fv-bulk-review-customer-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch bulk review customer matching and version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('pages/grain/grain-ticket-detail.html')
          s = p.read_text()

          old = '''    function soldUnderOcrEvidence(
      ticket
    ) {

      const hasResolvedCustomer =
        Boolean(
          clean(
            ticket?.grainCustomerId ||
            ticket?.customerId
          )
        );

      return {
        account:
          normalizedSoldUnderOcr(
            ticket?.ocrCustomerAccountText ||
            ticket?.customerAccountText ||
            ticket?.customerAccount ||
            ticket?.customerCode ||
            ticket?.customerNumber ||
            ""
          ),

        name:
          normalizedSoldUnderOcr(
            ticket?.ocrCustomerText ||
            ticket?.customerText ||
            ticket?.scannedCustomerText ||
            ticket?.rawCustomerName ||
            (!hasResolvedCustomer
              ? (
                  ticket?.customerName ||
                  ticket?.customer ||
                  ticket?.soldUnder ||
                  ""
                )
              : "")
          )
      };

    }'''

          new = '''    function soldUnderOcrEvidence(
      ticket
    ) {

      const storedCustomerId =
        clean(
          ticket?.grainCustomerId ||
          ticket?.customerId
        );

      const hasResolvedCustomer =
        Boolean(
          storedCustomerId &&
          state.customers.some(
            customer =>
              clean(customer?.id) ===
              storedCustomerId
          )
        );

      const unresolvedStoredCustomer =
        !hasResolvedCustomer
          ? (
              ticket?.customerAccount ||
              ticket?.customerCode ||
              ticket?.customerNumber ||
              storedCustomerId ||
              ticket?.customerName ||
              ticket?.customer ||
              ticket?.soldUnder ||
              ""
            )
          : "";

      return {
        account:
          normalizedSoldUnderOcr(
            ticket?.ocrCustomerAccountText ||
            ticket?.customerAccountText ||
            ticket?.customerAccount ||
            ticket?.customerCode ||
            ticket?.customerNumber ||
            (!hasResolvedCustomer ? storedCustomerId : "") ||
            ""
          ),

        name:
          normalizedSoldUnderOcr(
            ticket?.ocrCustomerText ||
            ticket?.customerText ||
            ticket?.scannedCustomerText ||
            ticket?.rawCustomerName ||
            unresolvedStoredCustomer ||
            ""
          )
      };

    }'''

          if old not in s:
              raise SystemExit('soldUnderOcrEvidence block not found')
          s = s.replace(old, new, 1)

          old = '''      const matches =
        state.tickets.filter(
          ticket =>
            ticket?.id !==
              ticketId &&
            normalize(
              ticket?.validationStatus
            ) ===
              "needs_review" &&
            clean(
              ticket?.customerId
            ) !==
              clean(
                selectedCustomer.id
              ) &&
            sameSoldUnderOcrEvidence(
              state.ticket,
              ticket
            )
        );'''

          new = '''      const matches =
        state.tickets.filter(
          ticket => {
            if (
              ticket?.id ===
                ticketId
            ) {
              return false;
            }

            const candidateCustomerId =
              clean(
                ticket?.grainCustomerId ||
                ticket?.customerId
              );

            if (
              candidateCustomerId ===
                clean(selectedCustomer.id)
            ) {
              return false;
            }

            const candidateStatus =
              normalize(
                ticket?.validationStatus ||
                ticket?.status ||
                ""
              );

            const candidateReasons =
              Array.isArray(ticket?.reviewReasons)
                ? ticket.reviewReasons
                : [];

            const stillNeedsReview =
              candidateStatus === "needs_review" ||
              candidateStatus === "review" ||
              candidateStatus === "needs review" ||
              candidateReasons.length > 0;

            return (
              stillNeedsReview &&
              sameSoldUnderOcrEvidence(
                state.ticket,
                ticket
              )
            );
          }
        );'''

          if old not in s:
              raise SystemExit('bulk matches block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          v = Path('js/version.js')
          t = v.read_text()
          t = t.replace('number:  "09.09.01"', 'number:  "09.09.02"', 1)
          t = t.replace('date:    "2026-09-08"', 'date:    "2026-09-09"', 1)
          v.write_text(t)
          PY

      - name: Validate ticket detail JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('pages/grain/grain-ticket-detail.html').read_text()
          scripts = re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', html, re.I)
          for i, script in enumerate(scripts):
              if not script.strip():
                  continue
              path = Path(tempfile.gettempdir()) / f'fv-detail-{i}.mjs'
              path.write_text(script)
              subprocess.run(['node', '--check', str(path)], check=True)
          subprocess.run(['node','--check','js/version.js'], check=True)
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/grain/grain-ticket-detail.html js/version.js
          git commit -m 'Fix bulk review customer correction and bump 09.09.02 [skip auto-version]'
          git pull --rebase origin main
          git push
