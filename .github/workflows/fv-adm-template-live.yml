name: FarmVista ADM template live

on:
  push:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply FarmVista scanner fixes
        run: python3 .github/scripts/fv-loadout-fix.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          files = [
              'pages/grain/grain-ticket-scan.html',
              'pages/grain/grain-ticket-scan-core.html',
              'pages/grain/grain-ticket.html',
          ]
          for filename in files:
              text = Path(filename).read_text()
              for script in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w', suffix='.mjs', delete=False) as f:
                      f.write(script)
                      temp = f.name
                  result = subprocess.run(['node', '--check', temp], capture_output=True, text=True)
                  if result.returncode:
                      print(filename)
                      print(result.stderr)
                      raise SystemExit(result.returncode)
          PY
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages/grain/grain-ticket-scan.html pages/grain/grain-ticket-scan-core.html pages/grain/grain-ticket.html
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve load-out source and copied hauling job'
          git pull --rebase origin main
          git push
