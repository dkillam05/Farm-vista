name: Fix no matching hauling job warning

on:
  push:
    paths:
      - '.github/workflows/fv-ticket-warning-no-matching-job.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch grain ticket warning matcher
        run: python .github/scripts/fix-ticket-warning-no-matching-job.py
      - name: Commit fix
        run: |
          if git diff --quiet -- pages/grain/grain-ticket.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/grain/grain-ticket.html
          git commit -m 'Fix warning for no matching hauling job'
          git pull --rebase origin main
          git push origin main
