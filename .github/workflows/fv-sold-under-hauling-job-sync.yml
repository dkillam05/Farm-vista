name: FarmVista Sold Under and hauling job sync

on:
  push:
    paths:
      - '.github/workflows/fv-sold-under-hauling-job-sync.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Patch Sold Under driver fallback
        run: python .github/scripts/fv_sold_under_hauling_patch.py

      - name: Validate inline JavaScript syntax
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile

          html = Path('pages/grain/grain-ticket-scan.html')
          text = html.read_text()
          scripts = re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', text, re.I)
          for i, script in enumerate(scripts):
              if not script.strip():
                  continue
              tmp = Path(tempfile.gettempdir()) / f'{html.stem}-{i}.mjs'
              tmp.write_text(script)
              subprocess.run(['node', '--check', str(tmp)], check=True)

      - name: Commit Sold Under fallback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/grain/grain-ticket-scan.html
          git commit -m 'Keep skipped Sold Under tickets in review'
          git push