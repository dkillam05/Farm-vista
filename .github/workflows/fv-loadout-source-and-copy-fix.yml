name: FarmVista load-out source and copy fix

on:
  push:
    paths:
      - '.github/workflows/fv-loadout-source-and-copy-fix.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch load-out scan source inheritance and copied hauling job
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ------------------------------------------------------------
          # 1) A secure load-out/guest scan already has Grain Source on
          #    the FarmVista grain_loadouts record. Do not ask the driver
          #    to choose it again; the backend load-out remains authoritative.
          # ------------------------------------------------------------
          scan = Path('pages/grain/grain-ticket-scan-core.html')
          s = scan.read_text()

          if 'LOAD-OUT SOURCE IS AUTHORITATIVE — 2026-09-11' not in s:
              pattern = re.compile(
                  r'(\/\* ========================================================\n\s*GRAIN SOURCE\n\s*======================================================== \*\/\n\s*)if \(crop\) \{\n\s*source =\n\s*await askDriverForGrainSource\(crop\);\n\s*\}',
                  re.M
              )
              replacement = r'''\1/*
    LOAD-OUT SOURCE IS AUTHORITATIVE — 2026-09-11

    A secure FarmVista load-out scan already has its Grain Source stored on
    the grain_loadouts record. The guest/load-out backend owns that context.
    Asking Active Harvest / Field / Storage again can replace the load-out
    context with a driver selection and break hauling-job linkage.

    Normal signed-in scans without a load-out still ask Grain Source.
  */
  if (crop && !isGuestScan) {
    source =
      await askDriverForGrainSource(crop);
  }'''
              s2, n = pattern.subn(replacement, s, count=1)
              if n != 1:
                  raise SystemExit('Could not find Grain Source driver-assist block')
              s = s2
              scan.write_text(s)

          # ------------------------------------------------------------
          # 2) Add Load: when the form says data was copied from the
          #    previous driver load, restore that load's haulingJobId into
          #    the actual select after all dependent dropdowns finish rendering.
          # ------------------------------------------------------------
          page = Path('pages/grain/grain-ticket.html')
          p = page.read_text()

          if 'PREVIOUS LOAD HAULING JOB RESTORE — 2026-09-11' not in p:
              marker = '''  function loOpenModal(){
    loState.mode = "create";
    loState.editingLoadId = null;

    loResetModalBase();
'''
              if marker not in p:
                  raise SystemExit('Could not find loOpenModal marker')

              addition = marker + '''

    /*
      PREVIOUS LOAD HAULING JOB RESTORE — 2026-09-11

      The existing copy-last-driver-load flow can populate Crop, Destination,
      Sold Under and Grain Source, then a dependent rerender clears only the
      hauling-job <select>. That leaves the correct delivery/remaining note
      visible while the select itself says "Select hauling job".

      After the current synchronous copy flow completes, put the previous
      driver's haulingJobId back into the real select. Only do this when the
      form explicitly says it copied the previous load and the user has not
      already selected another hauling job.
    */
    setTimeout(() => {
      try {
        if (loState.mode !== "create") return;
        if (!loEls.haulingJob || loClean(loEls.haulingJob.value)) return;

        const copyMessage =
          loClean(loEls.message?.textContent).toLowerCase();

        if (
          !copyMessage.includes("copied") ||
          !copyMessage.includes("previous")
        ) {
          return;
        }

        const driver = loSelectedDriver();
        if (!driver) return;

        const previousLoad =
          loState.loads
            .filter(load =>
              loDriverMatchesLoad(load, driver) &&
              loClean(load?.haulingJobId)
            )
            .sort((a, b) =>
              loMillis(b.loadedAt || b.createdAt) -
              loMillis(a.loadedAt || a.createdAt)
            )[0] || null;

        const previousJobId =
          loClean(previousLoad?.haulingJobId);

        if (!previousJobId) return;

        loRenderHaulingJobs(previousJobId);

        console.log(
          "[Grain Load Out] Restored copied previous hauling job:",
          {
            loadNumber: previousLoad?.loadNumber || null,
            haulingJobId: previousJobId
          }
        );
      }
      catch (error) {
        console.warn(
          "[Grain Load Out] Could not restore copied hauling job:",
          error
        );
      }
    }, 0);
'''
              p = p.replace(marker, addition, 1)
              page.write_text(p)
          PY

      - name: Validate changed JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          for filename in [
              'pages/grain/grain-ticket.html',
              'pages/grain/grain-ticket-scan-core.html'
          ]:
              text = Path(filename).read_text()
              for script in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w', suffix='.mjs', delete=False) as f:
                      f.write(script)
                      temp = f.name
                  result = subprocess.run(['node', '--check', temp], capture_output=True, text=True)
                  if result.returncode:
                      print(filename)
                      print(result.stderr)
                      raise SystemExit(result.returncode)
          PY

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/grain/grain-ticket.html pages/grain/grain-ticket-scan-core.html
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve load-out source and copied hauling job'
          git pull --rebase origin main
          git push
