name: Fix current ticket hauling progression
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fv-fix-current-ticket-hauling-progression.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scanner assignment
        shell: python
        run: |
          from pathlib import Path
          p=Path('pages/grain/grain-ticket-scan.html')
          s=p.read_text()
          old='''function haulingJobIsActive(\\n  job\\n) {\\n\\n  if (\\n    !job ||\\n    job.active === false ||\\n    job.isActive === false\\n  ) {'''
          new='''function haulingJobIsActive(\\n  job\\n) {\\n\\n  /* Current driver scans must never auto-assign to a completed hauling job.\\n     The two-day completed/overhaul window is a manual/load-out exception only. */\\n  const explicitlyCompleted =\\n    job?.completed === true ||\\n    job?.isCompleted === true ||\\n    Boolean(job?.completedAt || job?.completionDate || job?.completedDate);\\n\\n  if (\\n    !job ||\\n    explicitlyCompleted ||\\n    job.active === false ||\\n    job.isActive === false\\n  ) {'''
          marker="html = replaceRequired(html,\n        `function haulingJobCustomerId("
          if 'const explicitlyCompleted' not in s:
            if marker not in s: raise SystemExit('scanner patch insertion marker missing')
            block="""      html = replaceRequired(html,\n        `"""+old+"""`,\n        `"""+new+"""`,\n        'exclude completed hauling jobs from current scans');\n\n"""
            s=s.replace(marker,block+marker,1)
          s=s.replace("const CORE_URL = '/pages/grain/grain-ticket-scan-core.html?v=20260911-10';","const CORE_URL = '/pages/grain/grain-ticket-scan-core.html?v=20260915-1915';")
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name 'FarmVista Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add pages/grain/grain-ticket-scan.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prevent current scans from using completed hauling jobs'
          git push
