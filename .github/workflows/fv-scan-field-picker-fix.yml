name: FarmVista scan field picker fix

on:
  push:
    paths:
      - '.github/workflows/fv-scan-field-picker-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch signed-in grain scan field flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count} for {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          scan = 'pages/grain/grain-ticket-scan.html'

          replace_once(
              scan,
              '''          title:\n            `Which field did this ${crop} come from?`,\n\n          text:\n            "Only active fields are shown. Search by field name or number.",''',
              '''          title:\n            `Which field did this ${crop} come from?`,\n\n          text:\n            "Choose the actual field this grain came from.",'''
          )

          replace_once(
              scan,
              '''          items:\n            fields.map(\n              field => ({\n                label:\n                  String(\n                    field.name ||\n                    ""\n                  ).trim(),\n\n                searchText:\n                  `${field.name || ""} ${field.farmName || ""} ${field.farmId || ""}`,\n\n                value:\n                  field\n              })\n            ),\n\n          allowSkip:\n            true,\n\n          allowBack:\n            true\n        });''',
              '''          items:\n            fields.map(\n              field => ({\n                label:\n                  String(\n                    field.name ||\n                    ""\n                  ).trim(),\n\n                searchText:\n                  `${field.name || ""} ${field.farmName || ""} ${field.farmId || ""}`,\n\n                value:\n                  field\n              })\n            ),\n\n          allowSkip:\n            false,\n\n          allowBack:\n            true\n        });'''
          )

          replace_once(
              scan,
              '''          groups: [\n            {\n              title:\n                "Grain Bin Sites",\n\n              test:\n                item =>\n                  item.type ===\n                    "bin_site"\n            },\n            {\n              title:\n                "Grain Bag Sites",\n\n              test:\n                item =>\n                  item.type ===\n                    "grain_bag_site"\n            }\n          ],\n\n          allowSkip:\n            true,\n\n          allowBack:\n            true\n        });''',
              '''          groups: [\n            {\n              title:\n                "Grain Bin Sites",\n\n              test:\n                item =>\n                  item.type ===\n                    "bin_site"\n            },\n            {\n              title:\n                "Grain Bag Sites",\n\n              test:\n                item =>\n                  item.type ===\n                    "grain_bag_site"\n            }\n          ],\n\n          allowSkip:\n            false,\n\n          allowBack:\n            true\n        });'''
          )

          helper = 'js/grain-ticket-scan-source-flow.js'
          replace_once(
              helper,
              '''    if (textEl) {\n      textEl.textContent = isField\n        ? 'Tap Select an option, then choose the field this grain came from.'\n        : 'Tap Select an option, then choose the bin site or grain bag site.';\n    }''',
              '''    if (textEl) {\n      textEl.textContent = isField\n        ? 'Choose the field this grain came from.'\n        : 'Choose the bin site or grain bag site.';\n    }'''
          )

          replace_once(
              helper,
              '''    /*\n      IMPORTANT: leave the dropdown CLOSED.\n\n      The previous helper called trigger.click() here. On iPhone the new\n      picker is rendered immediately after the driver's Field tap; opening it\n      programmatically during that same interaction can let a stale tap/click\n      land on newly rendered controls and resolve Driver Assist without an\n      intentional field choice.\n    */\n    const dropdown = document.querySelector('#assistBody .assist-dropdown');\n    if (dropdown) {\n      dropdown.classList.remove('open');\n    }''',
              '''    /*\n      Open the second-level picker automatically, but only after the original\n      Field / Grain Storage tap has fully finished. The inline scanner now\n      disables Skip for these prompts, so the ticket cannot save until the\n      driver chooses a real field/site or intentionally goes Back.\n    */\n    const dropdown = document.querySelector('#assistBody .assist-dropdown');\n    if (dropdown && !dropdown.dataset.fvAutoOpened) {\n      dropdown.dataset.fvAutoOpened = '1';\n      dropdown.classList.remove('open');\n\n      const expectedTitle = clean(title);\n\n      setTimeout(() => {\n        if (!document.body.contains(dropdown)) return;\n\n        const liveTitle = clean(\n          document.getElementById('assistTitle')?.textContent\n        );\n\n        if (liveTitle !== expectedTitle) return;\n        if (dropdown.classList.contains('open')) return;\n\n        dropdown.querySelector('.assist-dropdown-trigger')?.click();\n      }, 250);\n    }'''
          )

          config = 'js/firebase-config.js'
          replace_once(
              config,
              "helperScript.src = '/js/grain-ticket-scan-source-flow.js?v=20260904-2';",
              "helperScript.src = '/js/grain-ticket-scan-source-flow.js?v=20260904-3';"
          )
          PY

      - name: Commit FarmVista fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fv-scan-field-picker-fix.yml
          git add pages/grain/grain-ticket-scan.html js/grain-ticket-scan-source-flow.js js/firebase-config.js
          git commit -m "Require field selection before grain ticket save"
          git push
