name: Deploy Beta Main To Live
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror FarmVista-Beta main
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/dkillam05/FarmVista-Beta.git /tmp/farmvista-beta
          rsync -a --delete --exclude='.git/' /tmp/farmvista-beta/ ./
          git config user.name "FarmVista Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Live already matches Beta."
            exit 0
          fi
          git commit -m "Deploy FarmVista Beta main to live"
          git push origin HEAD:main
