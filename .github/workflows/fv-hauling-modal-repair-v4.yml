name: Final hauling job mobile modal repair
on:
  push:
    paths:
      - '.github/workflows/fv-hauling-modal-repair-v4.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force new hauling job module version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pages/grain/grain-contracts.html')
          s = p.read_text(encoding='utf-8')
          old = '/js/grain-hauling-jobs.js?v=20260909-1146'
          if old in s:
              s = s.replace(old, '/js/grain-hauling-jobs.js?v=20260913-1909', 1)
          elif '/js/grain-hauling-jobs.js?v=20260913-1909' not in s:
              import re
              s, n = re.subn(r'/js/grain-hauling-jobs\.js\?v=[^\"\']+', '/js/grain-hauling-jobs.js?v=20260913-1909', s, count=1)
              if n != 1:
                  raise SystemExit('Could not locate hauling jobs module script')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cache bump
        run: |
          if git diff --quiet -- pages/grain/grain-contracts.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/grain/grain-contracts.html
          git commit -m 'Force fresh hauling job mobile repair'
          git pull --rebase origin main
          git push origin main
