name: FarmVista Scoular Waverly fixed grades

on:
  push:
    paths:
      - '.github/workflows/fv-scoular-waverly-fixed-grades.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fix Scoular Waverly grade row parsing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/grain-ticket-adm-decatur-grade-fix.js')
          s=p.read_text()
          start=s.index('  function scoularGradeValues(text) {')
          end=s.index('\n  function scoularPrintedBushels(text) {', start)
          new=r'''  function scoularGradeValues(text) {
    const source = String(text || '').replace(/\r/g,'\n');
    const start = source.search(/Grade\s*:\s*U\.?S\.?/i);
    if (start < 0) return null;
    let block = source.slice(start, start + 1300);
    const stop = block.search(/\bGROSS\s+L\.?BS\s*:/i);
    if (stop > 0) block = block.slice(0, stop);

    /*
      SCOULAR WAVERLY FIXED ROW MAP

      Printed rows never change meaning:
        Test Weight                    -> TW
        Moisture                       -> MO
        Damaged Kernels (total)        -> DM
        Broken Corn & Foreign Mat      -> FM/BCFM

      Google frequently returns the LABEL COLUMN first and the VALUE COLUMN
      afterward, e.g.:
        58.8 / Test Weight / Moisture / Damaged... / Broken... / 13.2 / 1.9 / 1.0

      Therefore do not require four consecutive decimals.  TW is the grade-sized
      value immediately before the label run; MO/DM/FM are the three grade-sized
      values after that run, in fixed printed row order.  This prevents moisture
      from ever sliding into FM when the OCR reading order is column-major.
    */
    const labelRun = block.match(/Test\s*Weight[\s\S]{0,180}?(?:Moisture|Voisture)[\s\S]{0,180}?Damaged\s*Kernels(?:\s*\(total\))?[\s\S]{0,180}?Broken\s*Corn\s*&\s*Foreign\s*Mat/i);
    if (labelRun && Number.isFinite(labelRun.index)) {
      const before = block.slice(0, labelRun.index);
      const after = block.slice(labelRun.index + labelRun[0].length);
      const nums = part => [...part.matchAll(/(?:^|\s)(\d{1,2}(?:\.\d{1,2}))(?=\s|$)/g)].map(m=>Number(m[1])).filter(Number.isFinite);
      const beforeNums = nums(before).filter(n=>n>=35 && n<=70);
      const afterNums = nums(after).filter(n=>n>=0 && n<=40);
      const tw = beforeNums.length ? beforeNums[beforeNums.length-1] : null;
      if (Number.isFinite(tw) && afterNums.length >= 3) {
        return {testWeight:tw, moisture:afterNums[0], damage:afterNums[1], foreignMaterial:afterNums[2]};
      }
    }

    // Fallback for OCR that returns the four values row-major.
    const values=[];
    for (const m of block.matchAll(/(?:^|\s)(\d{1,2}\.\d{1,2})(?=\s|$)/g)) {
      const n=Number(m[1]);
      if (Number.isFinite(n)) values.push(n);
    }
    if (values.length < 4) return null;
    const [tw,mo,dm,fm]=values;
    if (!(tw>=35&&tw<=70) || !(mo>=0&&mo<=40) || !(dm>=0&&dm<=20) || !(fm>=0&&fm<=20)) return null;
    return {testWeight:tw,moisture:mo,damage:dm,foreignMaterial:fm};
  }
'''
          s=s[:start]+new+s[end:]
          p.write_text(s)

          scan=Path('pages/grain/grain-ticket-scan.html')
          t=scan.read_text()
          # Ensure helper is loaded by the wrapper/core document if already referenced with an older cache key.
          t=t.replace('grain-ticket-adm-decatur-grade-fix.js?v=20260915-1','grain-ticket-adm-decatur-grade-fix.js?v=20260915-2')
          scan.write_text(t)
          PY

      - name: Validate JavaScript
        run: node --check js/grain-ticket-adm-decatur-grade-fix.js

      - name: Commit parser fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/grain-ticket-adm-decatur-grade-fix.js pages/grain/grain-ticket-scan.html
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'Fix Scoular Waverly fixed grade row parsing'
          git push
