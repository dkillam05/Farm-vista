name: Apply reconciliation buyer patch
on:
  push:
    paths:
      - '.github/workflows/fv-reconcile-apply-simple.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fv_reconciliation_ticket_buyers.py
      - run: |
          cp js/grain-contracts.js /tmp/grain-contracts.mjs
          node --check /tmp/grain-contracts.mjs
          node --check js/version.js
      - run: |
          git config user.name 'FarmVista Bot'
          git config user.email 'actions@farmvista.app'
          git add js/grain-contracts.js pages/grain/grain-contracts.html js/version.js
          git commit -m 'Show ticket buyers in contract reconciliation [skip auto-version]'
          git pull --rebase origin main
          git push origin HEAD:main
