name: FarmVista Scoular scan fix

on:
  push:
    paths:
      - '.github/workflows/fv-scoular-scan-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch grain ticket scan flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('pages/grain/grain-ticket-scan.html')
          text = path.read_text()
          original = text

          # Cache-bust the upgraded Scoular grade/customer normalizer.
          text, count = re.subn(
              r'(/js/grain-ticket-ocr-grade-normalizer\.js\?v=)[^"\']+',
              r'\g<1>20260909-3',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected to update normalizer import once, got {count}')

          # Learned aliases should use the elevator account/customer ID first,
          # then the printed Sold Under name. This lets DOWSJC1 become reusable.
          alias_pattern = re.compile(r'''
  if \(
    ocrName
  \) \{

    const alias =
      findLearnedAlias\(
        "customer",
        ocrName
      \);


    if \(
      alias\?\.targetId
    \) \{

      const customer =
        candidates\.find\(
          item =>
            item\.id ===
            alias\.targetId
        \);


      if \(
        customer
      \) \{

        return \{
          matched:
            true,

          matchType:
            "learned_alias",

          customer
        \};

      \}

    \}

  \}
''', re.X)

          alias_replacement = '''
  /*
    Learned Sold Under aliases prefer the elevator's customer/account ID.
    If no account alias exists, fall back to the printed customer name.
  */
  const learnedCustomerAlias =
    (
      ocrAccount
        ? findLearnedAlias(
            "customer",
            ocrAccount
          )
        : null
    ) ||
    (
      ocrName
        ? findLearnedAlias(
            "customer",
            ocrName
          )
        : null
    );


  if (
    learnedCustomerAlias?.targetId
  ) {

    const customer =
      candidates.find(
        item =>
          String(item.id) ===
            String(learnedCustomerAlias.targetId)
      );


    if (
      customer
    ) {

      return {
        matched:
          true,

        matchType:
          "learned_alias",

        customer
      };

    }

  }
'''

          text, count = alias_pattern.subn(alias_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected to replace customer alias lookup once, got {count}')

          # Add a small safe alias writer before Driver Assist. It writes only
          # after an explicit driver choice; Unknown/Skip never creates aliases.
          marker = 'async function runDriverAssistQuestions(\n  grainTicket,\n  ocrResult,\n  matching\n) {'
          if marker not in text:
              raise SystemExit('Driver Assist marker not found')

          helper = r'''
function customerAliasEvidence(
  grainTicket
) {

  const evidence = [
    String(
      grainTicket?.customerAccountText ||
      ""
    ).trim(),
    String(
      grainTicket?.customerText ||
      ""
    ).trim()
  ]
    .filter(Boolean);


  return Array.from(
    new Set(
      evidence
    )
  );

}


async function saveDriverCustomerAliases(
  grainTicket,
  customer
) {

  if (
    !customer?.id
  ) {
    return;
  }


  const targetId =
    String(
      customer.id
    );


  const targetName =
    getCustomerName(
      customer
    );


  for (
    const ocrText of
    customerAliasEvidence(
      grainTicket
    )
  ) {

    const normalizedText =
      normalizeAliasText(
        ocrText
      );


    if (
      !normalizedText
    ) {
      continue;
    }


    const aliasId =
      `customer_${normalizedText}`
        .replace(
          /[^a-z0-9_-]+/g,
          "_"
        )
        .slice(
          0,
          180
        );


    const payload = {
      type:
        "customer",

      ocrText,

      normalizedText,

      targetId,

      targetName:
        targetName ||
        null,

      source:
        "driver_confirmation",

      active:
        true,

      updatedAt:
        serverTimestamp()
    };


    try {

      await setDoc(
        doc(
          db,
          ALIAS_COLLECTION,
          aliasId
        ),
        payload,
        {
          merge:
            true
        }
      );


      const existingIndex =
        ocrAliases.findIndex(
          alias =>
            alias.type ===
              "customer" &&
            normalizeAliasText(
              alias.normalizedText ||
              alias.ocrText
            ) ===
              normalizedText
        );


      const localAlias = {
        id:
          aliasId,
        ...payload
      };


      if (
        existingIndex >=
          0
      ) {
        ocrAliases[
          existingIndex
        ] =
          localAlias;
      }
      else {
        ocrAliases.push(
          localAlias
        );
      }


      console.log(
        "[Grain Ticket] Learned Sold Under alias:",
        {
          ocrText,
          targetId,
          targetName
        }
      );

    }
    catch (error) {

      /*
        Learning must never block a driver's ticket from saving.
      */
      console.warn(
        "[Grain Ticket] Could not save Sold Under alias:",
        error
      );

    }

  }

}


'''

          text = text.replace(marker, helper + marker, 1)

          # When OCR did not confidently match Sold Under, always ask the driver.
          # Contract-valid customers are shown first, followed by all existing
          # FarmVista customers. The driver still has Unknown and Skip.
          old_choice = '''    if (eligibleCustomers.length === 1) {
      customer = eligibleCustomers[0];
    }
    else if (eligibleCustomers.length > 1) {
      const selectedCustomer =
'''

          new_choice = '''    const eligibleCustomerIds =
      new Set(
        eligibleCustomers.map(
          item =>
            String(item.id)
        )
      );


    const soldUnderCustomers = [
      ...eligibleCustomers,
      ...customers.filter(
        item =>
          !eligibleCustomerIds.has(
            String(item.id)
          )
      )
    ];


    if (soldUnderCustomers.length) {
      const selectedCustomer =
'''

          if old_choice not in text:
              raise SystemExit('Sold Under eligibility block not found')
          text = text.replace(old_choice, new_choice, 1)

          text, count = re.subn(
              r'\.\.\.eligibleCustomers\.map\(',
              '...soldUnderCustomers.map(',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one Sold Under customer map replacement, got {count}')

          # Make the prompt explain why it appeared.
          text = text.replace(
              '              : `Choose the Sold Under customer for this ${grainTicket.crop} delivery.`,',
              '              : `OCR could not confidently link the Sold Under customer. Choose who this ${grainTicket.crop} load is sold under.`,',
              1,
          )

          # Learn account/name aliases only after a positive explicit selection.
          learn_anchor = '''        ocrResult.manualCorrections = {
          ...(ocrResult.manualCorrections || {}),
          customer: {
            originalValue: originalEvidence || null,
            selectedId: selectedCustomer.id,
            selectedValue: getCustomerName(selectedCustomer),
            source: "driver_selection",
            learningEligible: Boolean(originalEvidence),
            learningReason:
              originalEvidence
                ? "ocr_evidence_confirmed"
                : "driver_supplied_missing_value"
          }
        };
'''

          learn_replacement = learn_anchor + '''

        await saveDriverCustomerAliases(
          grainTicket,
          selectedCustomer
        );
'''

          if learn_anchor not in text:
              raise SystemExit('Driver customer correction block not found')
          text = text.replace(learn_anchor, learn_replacement, 1)

          if text == original:
              raise SystemExit('No changes made')

          path.write_text(text)
          PY

      - name: Commit patched scan flow
        run: |
          git config user.name "FarmVista Automation"
          git config user.email "farmvista-automation@users.noreply.github.com"
          rm -f .github/workflows/fv-scoular-scan-fix.yml
          git add pages/grain/grain-ticket-scan.html .github/workflows/fv-scoular-scan-fix.yml
          git commit -m "Fix Scoular sold-under verification and alias learning"
          git push origin HEAD:main
