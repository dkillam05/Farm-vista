name: Auto bump FarmVista version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    if: ${{ !contains(github.event.head_commit.message, '[skip auto-version]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply pending FarmVista load-out fixes
        shell: bash
        run: |
          if [ -f .github/scripts/fv-loadout-fix.py ]; then
            python3 .github/scripts/fv-loadout-fix.py
          fi

      - name: Update FarmVista date and build number
        shell: bash
        env:
          TZ: America/Chicago
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import re

          path = Path('js/version.js')
          text = path.read_text()

          version_match = re.search(r'(number:\s*["\'])(\d+)\.(\d+)\.(\d+)(["\'])', text)
          date_match = re.search(r'(date:\s*["\'])(\d{4}-\d{2}-\d{2})(["\'])', text)
          if not version_match:
              raise SystemExit('Could not find FV_VERSION number in js/version.js')
          if not date_match:
              raise SystemExit('Could not find FV_VERSION date in js/version.js')

          now = datetime.now(ZoneInfo('America/Chicago'))
          today = now.strftime('%Y-%m-%d')
          month = now.month
          day = now.day

          old_month, old_day, old_patch = map(int, version_match.group(2, 3, 4))
          if old_month == month and old_day == day:
              patch = old_patch + 1
          else:
              patch = 1

          new_version = f'{month:02d}.{day:02d}.{patch:02d}'

          text = (
              text[:version_match.start()]
              + version_match.group(1)
              + new_version
              + version_match.group(5)
              + text[version_match.end():]
          )

          date_match = re.search(r'(date:\s*["\'])(\d{4}-\d{2}-\d{2})(["\'])', text)
          text = (
              text[:date_match.start()]
              + date_match.group(1)
              + today
              + date_match.group(3)
              + text[date_match.end():]
          )

          path.write_text(text)
          print(f'FarmVista version: {new_version} — {today}')
          PY

      - name: Commit version bump and pending fixes
        shell: bash
        run: |
          if git diff --quiet -- js/version.js pages/grain/grain-ticket.html pages/grain/grain-ticket-scan.html pages/grain/grain-ticket-scan-core.html; then
            echo "No FarmVista changes needed."
            exit 0
          fi

          git config user.name "FarmVista Version Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/version.js pages/grain/grain-ticket.html pages/grain/grain-ticket-scan.html pages/grain/grain-ticket-scan-core.html
          git commit -m "Bump FarmVista version and apply load-out fixes [skip auto-version]"
          git pull --rebase origin main
          git push
