name: Auto bump FarmVista version
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Check out live
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror tested Beta main into live
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/dkillam05/FarmVista-Beta.git /tmp/farmvista-beta
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/farmvista-beta/ ./
          git config user.name "FarmVista Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo 'Non-workflow files already match Beta.'; exit 0; fi
          git commit -m "Deploy FarmVista Beta main to live"
          git push origin HEAD:main
