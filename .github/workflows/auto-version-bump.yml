name: Auto bump FarmVista version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    if: ${{ !contains(github.event.head_commit.message, '[skip auto-version]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increment FarmVista build number
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('js/version.js')
          text = path.read_text()

          match = re.search(r'(number:\s*["\'])(\d+)\.(\d+)\.(\d+)(["\'])', text)
          if not match:
              raise SystemExit('Could not find FV_VERSION number in js/version.js')

          major, minor, patch = map(int, match.group(2, 3, 4))
          patch += 1
          new_version = f'{major:02d}.{minor:02d}.{patch:02d}'

          text = text[:match.start()] + match.group(1) + new_version + match.group(5) + text[match.end():]
          path.write_text(text)
          print(f'Bumped FarmVista to {new_version}')
          PY

      - name: Commit version bump
        shell: bash
        run: |
          if git diff --quiet -- js/version.js; then
            echo "No version change needed."
            exit 0
          fi

          git config user.name "FarmVista Version Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/version.js
          git commit -m "Bump FarmVista version [skip auto-version]"
          git push
