name: Auto bump FarmVista version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    if: ${{ !contains(github.event.head_commit.message, '[skip auto-version]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Scoular scan integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('pages/grain/grain-ticket-scan.html')
          text = path.read_text()
          original = text

          old_import = '/js/grain-ticket-ocr-grade-normalizer.js?v=20260904-1'
          if old_import in text:
              text = text.replace(old_import, '/js/grain-ticket-ocr-grade-normalizer.js?v=20260909-3', 1)

          old_alias = '''  if (
    ocrName
  ) {

    const alias =
      findLearnedAlias(
        "customer",
        ocrName
      );


    if (
      alias?.targetId
    ) {

      const customer =
        candidates.find(
          item =>
            item.id ===
            alias.targetId
        );


      if (
        customer
      ) {

        return {
          matched:
            true,

          matchType:
            "learned_alias",

          customer
        };

      }

    }

  }
'''

          new_alias = '''  /* Prefer the elevator customer/account ID for a learned Sold Under alias. */
  const learnedCustomerAlias =
    (ocrAccount ? findLearnedAlias("customer", ocrAccount) : null) ||
    (ocrName ? findLearnedAlias("customer", ocrName) : null);


  if (
    learnedCustomerAlias?.targetId
  ) {

    const customer =
      candidates.find(
        item =>
          String(item.id) ===
            String(learnedCustomerAlias.targetId)
      );


    if (
      customer
    ) {

      return {
        matched:
          true,

        matchType:
          "learned_alias",

        customer
      };

    }

  }
'''
          if old_alias not in text:
              raise SystemExit('Customer learned-alias block not found')
          text = text.replace(old_alias, new_alias, 1)

          marker = '''async function runDriverAssistQuestions(
  grainTicket,
  ocrResult,
  matching
) {'''
          if marker not in text:
              raise SystemExit('Driver Assist function marker not found')

          helper = '''function customerAliasEvidence(
  grainTicket
) {

  return Array.from(
    new Set(
      [
        String(grainTicket?.customerAccountText || "").trim(),
        String(grainTicket?.customerText || "").trim()
      ].filter(Boolean)
    )
  );

}


async function saveDriverCustomerAliases(
  grainTicket,
  customer
) {

  if (!customer?.id) return;

  const targetId = String(customer.id);
  const targetName = getCustomerName(customer);

  for (const ocrText of customerAliasEvidence(grainTicket)) {
    const normalizedText = normalizeAliasText(ocrText);
    if (!normalizedText) continue;

    const aliasId =
      `customer_${normalizedText}`
        .replace(/[^a-z0-9_-]+/g, "_")
        .slice(0, 180);

    const payload = {
      type: "customer",
      ocrText,
      normalizedText,
      targetId,
      targetName: targetName || null,
      source: "driver_confirmation",
      active: true,
      updatedAt: serverTimestamp()
    };

    try {
      await setDoc(
        doc(db, ALIAS_COLLECTION, aliasId),
        payload,
        { merge: true }
      );

      const existingIndex = ocrAliases.findIndex(
        alias =>
          String(alias.type || "") === "customer" &&
          normalizeAliasText(alias.normalizedText || alias.ocrText) === normalizedText
      );

      const localAlias = { id: aliasId, ...payload };
      if (existingIndex >= 0) ocrAliases[existingIndex] = localAlias;
      else ocrAliases.push(localAlias);

      console.log("[Grain Ticket] Learned Sold Under alias:", {
        ocrText,
        targetId,
        targetName
      });
    }
    catch (error) {
      /* Alias learning must never prevent the driver's ticket from saving. */
      console.warn("[Grain Ticket] Could not save Sold Under alias:", error);
    }
  }

}


'''
          text = text.replace(marker, helper + marker, 1)

          old_choice = '''    if (eligibleCustomers.length === 1) {
      customer = eligibleCustomers[0];
    }
    else if (eligibleCustomers.length > 1) {
      const selectedCustomer =
'''
          new_choice = '''    const eligibleCustomerIds =
      new Set(
        eligibleCustomers.map(
          item => String(item.id)
        )
      );


    const soldUnderCustomers = [
      ...eligibleCustomers,
      ...customers.filter(
        item => !eligibleCustomerIds.has(String(item.id))
      )
    ];


    if (soldUnderCustomers.length) {
      const selectedCustomer =
'''
          if old_choice not in text:
              raise SystemExit('Sold Under eligibility branch not found')
          text = text.replace(old_choice, new_choice, 1)

          old_map = '          ...eligibleCustomers.map(\n'
          if old_map not in text:
              raise SystemExit('Sold Under item map not found')
          text = text.replace(old_map, '          ...soldUnderCustomers.map(\n', 1)

          old_prompt = '              : `Choose the Sold Under customer for this ${grainTicket.crop} delivery.`,'
          new_prompt = '              : `OCR could not confidently link the Sold Under customer. Choose who this ${grainTicket.crop} load is sold under.`,'
          if old_prompt in text:
              text = text.replace(old_prompt, new_prompt, 1)

          learn_anchor = '''        ocrResult.manualCorrections = {
          ...(ocrResult.manualCorrections || {}),
          customer: {
            originalValue: originalEvidence || null,
            selectedId: selectedCustomer.id,
            selectedValue: getCustomerName(selectedCustomer),
            source: "driver_selection",
            learningEligible: Boolean(originalEvidence),
            learningReason:
              originalEvidence
                ? "ocr_evidence_confirmed"
                : "driver_supplied_missing_value"
          }
        };
'''
          if learn_anchor not in text:
              raise SystemExit('Driver customer correction block not found')
          text = text.replace(
              learn_anchor,
              learn_anchor + '''

        await saveDriverCustomerAliases(
          grainTicket,
          selectedCustomer
        );
''',
              1
          )

          if text == original:
              raise SystemExit('No Scoular scan changes were applied')

          path.write_text(text)
          PY

      - name: Increment FarmVista build number
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('js/version.js')
          text = path.read_text()

          match = re.search(r'(number:\s*["\'])(\d+)\.(\d+)\.(\d+)(["\'])', text)
          if not match:
              raise SystemExit('Could not find FV_VERSION number in js/version.js')

          major, minor, patch = map(int, match.group(2, 3, 4))
          patch += 1
          new_version = f'{major:02d}.{minor:02d}.{patch:02d}'

          text = text[:match.start()] + match.group(1) + new_version + match.group(5) + text[match.end():]
          path.write_text(text)
          print(f'Bumped FarmVista to {new_version}')
          PY

      - name: Commit FarmVista changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi

          git config user.name "FarmVista Version Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/grain/grain-ticket-scan.html js/version.js
          git commit -m "Fix Scoular scan grades and Sold Under verification [skip auto-version]"
          git push
