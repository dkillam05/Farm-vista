name: FarmVista grain scanner clean reset

on:
  push:
    paths:
      - '.github/workflows/fv-grain-scanner-clean-reset.yml'
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale scanner layers and force current OCR path
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) version.js was still loading the OCR helper under a SEPT 4 cache URL.
          p=Path('js/version.js'); s=p.read_text()
          s=s.replace('__FV_ADM_DECATUR_GRADE_FIX_LOADER_20260904','__FV_GRAIN_TICKET_OCR_TEMPLATE_LOADER_20260916_RESET1')
          s=s.replace('/js/grain-ticket-adm-decatur-grade-fix.js?v=20260904-1','/js/grain-ticket-adm-decatur-grade-fix.js?v=20260916-reset-1')
          p.write_text(s)

          # 2) The helper must interpret OCR only. Remove the global canvas hooks;
          #    the scanner core now sends the original camera/photo File to OCR.
          p=Path('js/grain-ticket-adm-decatur-grade-fix.js'); s=p.read_text()
          s=re.sub(r"\n  /\* Keep FarmVista's normal in-app shutter\.[\s\S]*?\n  }\n\n  const scoularTemplateReady=", "\n\n  const scoularTemplateReady=", s, count=1)
          s=s.replace('__FV_ELEVATOR_GRADE_FIX_20260916_8','__FV_ELEVATOR_GRADE_FIX_20260916_RESET1')
          s=s.replace('scoular-waverly.js?v=20260916-8','scoular-waverly.js?v=20260916-reset-1')
          p.write_text(s)

          # 3) Force the wrapper to fetch a fresh scanner core after this reset.
          p=Path('pages/grain/grain-ticket-scan.html'); s=p.read_text()
          s=re.sub(r"const CORE_URL = '/pages/grain/grain-ticket-scan-core\.html\?v=[^']+';",
                   "const CORE_URL = '/pages/grain/grain-ticket-scan-core.html?v=20260916-clean-reset-1';",s,count=1)
          p.write_text(s)

          # 4) Core must consume the generic backend's top-level documentText.
          p=Path('pages/grain/grain-ticket-scan-core.html'); s=p.read_text()
          s=s.replace('String(result.document?.text || "").trim()', 'String(result.documentText || result.document?.text || "").trim()')
          p.write_text(s)
          PY

      - name: Validate scanner JavaScript
        run: |
          node --check js/grain-ticket-adm-decatur-grade-fix.js
          node --check js/grain-ticket-templates/scoular-waverly.js

      - name: Commit clean scanner reset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/version.js js/grain-ticket-adm-decatur-grade-fix.js pages/grain/grain-ticket-scan.html pages/grain/grain-ticket-scan-core.html
          if git diff --cached --quiet; then
            echo 'No reset changes required.'
            exit 0
          fi
          git commit -m 'Clean reset grain ticket OCR scan path [skip auto-version]'
          git push
