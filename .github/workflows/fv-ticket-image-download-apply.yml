name: Apply FarmVista grain ticket image download
on:
  push:
    paths:
      - '.github/workflows/fv-ticket-image-download-apply.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply download support
        shell: python
        run: |
          from pathlib import Path
          import re

          source = Path('.github/workflows/fv-ticket-image-download.yml').read_text()
          match = re.search(r"script = r'''(.*?)\n          '''", source, re.S)
          assert match, 'Shared download script block not found'
          script = match.group(1)
          lines = script.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('js/grain-ticket-image-download.js').write_text(script)

          tag = '<script src="/js/grain-ticket-image-download.js?v=20260909-1"></script>'
          for name in (
            'pages/grain/grain-ticket-detail.html',
            'pages/grain/index.html',
            'pages/reports/report-grain-contracts.html',
          ):
            p = Path(name)
            s = p.read_text()
            if 'grain-ticket-image-download.js' not in s:
              assert '</body>' in s, f'</body> not found in {name}'
              s = s.replace('</body>', f'  {tag}\n</body>', 1)
              p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/grain-ticket-image-download.js pages/grain/grain-ticket-detail.html pages/grain/index.html pages/reports/report-grain-contracts.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add grain ticket image downloads across views [skip auto-version]'
          git pull --rebase origin main
          git push
