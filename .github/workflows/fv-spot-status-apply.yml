name: FarmVista reconciliation buyer apply
on:
  push:
    paths:
      - '.github/workflows/fv-spot-status-apply.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reconciliation patch
        run: python3 .github/scripts/fv_reconciliation_ticket_buyers.py
      - name: Validate
        run: |
          cp js/grain-contracts.js /tmp/grain-contracts.mjs
          node --check /tmp/grain-contracts.mjs
          node --check js/version.js
          grep -q 'getBuyersForReconciliation' js/grain-contracts.js
          grep -q 'number:  "09.09.07"' js/version.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "FarmVista Bot"
          git config user.email "actions@farmvista.app"
          git add js/grain-contracts.js pages/grain/grain-contracts.html js/version.js
          git commit -m "Show ticket buyers in contract reconciliation [skip auto-version]"
          git pull --rebase origin main
          git push origin HEAD:main
# trigger
