name: FarmVista OCR raw document log patch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fv-ocr-raw-document-log.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch scanner OCR diagnostics
        shell: python
        run: |
          from pathlib import Path

          core = Path('pages/grain/grain-ticket-scan-core.html')
          s = core.read_text(encoding='utf-8')

          old = '''          const result =\n            await response.json();\n\n          /*\n            FarmVista verification layer:'''
          new = '''          const result =\n            await response.json();\n\n          /*\n            RAW OCR DIAGNOSTIC — log Google's literal document text BEFORE\n            any FarmVista grade normalizer or elevator template changes it.\n          */\n          const rawOcrDocumentText =\n            String(\n              result.documentText ||\n              result.document?.text ||\n              ""\n            );\n\n          console.log(\n            "[Grain Ticket] RAW GOOGLE OCR DOCUMENT TEXT\\n" +\n            rawOcrDocumentText\n          );\n\n          /*\n            FarmVista verification layer:'''
          if old not in s:
              raise SystemExit('Could not find OCR response insertion point')
          s = s.replace(old, new, 1)

          old2 = '''const documentText =\n  String(\n    result.document?.text ||\n    ""\n  ).trim();'''
          new2 = '''const documentText =\n  String(\n    result.documentText ||\n    result.document?.text ||\n    ""\n  ).trim();'''
          if old2 not in s:
              raise SystemExit('Could not find documentText validation block')
          s = s.replace(old2, new2, 1)
          core.write_text(s, encoding='utf-8')

          version = Path('js/version.js')
          v = version.read_text(encoding='utf-8')
          v = v.replace('__FV_ADM_DECATUR_GRADE_FIX_LOADER_20260904', '__FV_GRAIN_TICKET_OCR_TEMPLATE_LOADER_20260916_RAW1')
          v = v.replace('/js/grain-ticket-adm-decatur-grade-fix.js?v=20260904-1', '/js/grain-ticket-adm-decatur-grade-fix.js?v=20260916-raw1')
          version.write_text(v, encoding='utf-8')

          wrapper = Path('pages/grain/grain-ticket-scan.html')
          w = wrapper.read_text(encoding='utf-8')
          import re
          w, n = re.subn(r"const CORE_URL = '/pages/grain/grain-ticket-scan-core\.html\?v=[^']+';", "const CORE_URL = '/pages/grain/grain-ticket-scan-core.html?v=20260916-raw1';", w, count=1)
          if n != 1:
              raise SystemExit('Could not bump scanner core cache URL')
          wrapper.write_text(w, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "FarmVista Automation"
          git config user.email "actions@users.noreply.github.com"
          git add pages/grain/grain-ticket-scan-core.html pages/grain/grain-ticket-scan.html js/version.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Log raw Google OCR text before ticket templates [skip auto-version]"
          git push origin main
