name: FarmVista hauling job modal freeze fix

on:
  push:
    paths:
      - '.github/workflows/fv-fix-hauling-job-modal-freeze.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch hauling job modal compatibility helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/grain-hauling-jobs-sold-under-display.js')
          text = path.read_text()
          old = """      select.disabled = true;\n      select.setAttribute('aria-busy', 'true');\n      requestCoreHaulingRefresh();\n      const buyers = await loadLiveBuyers();\n"""
          new = """      select.disabled = true;\n      select.setAttribute('aria-busy', 'true');\n      // Do not trigger the core hauling refresh while the edit modal is opening.\n      // That refresh re-renders the hauling workspace during the same tap and can\n      // lock iOS/PWA interaction behind the modal. The modal already has the\n      // current selected buyer; only refresh the buyer options here.\n      const buyers = await loadLiveBuyers();\n"""
          if old not in text:
              raise SystemExit('syncBuyerSelect patch marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/fv-fix-hauling-job-modal-freeze.yml
          git config user.name "FarmVista Automation"
          git config user.email "farmvista-automation@users.noreply.github.com"
          git add js/grain-hauling-jobs-sold-under-display.js .github/workflows/fv-fix-hauling-job-modal-freeze.yml
          git commit -m "Fix hauling job edit modal freeze [skip auto-version]"
          git pull --rebase origin main
          git push origin HEAD:main
