name: Fix hauling job local dropdown anchoring v6

on:
  push:
    paths:
      - '.github/workflows/fv-hauling-job-local-dropdown-v6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch hauling job dropdown anchoring
        run: python .github/scripts/fix-hauling-job-local-dropdown-v6.py

      - name: Verify repair
        run: |
          python - <<'PY'
          from pathlib import Path
          js = Path('js/grain-hauling-jobs.js').read_text(encoding='utf-8')
          html = Path('pages/grain/grain-contracts.html').read_text(encoding='utf-8')
          required = [
            'fv-hauling-modal-touch-repair-v6',
            'visible[visible.length - 1]',
            'panel.style.setProperty("top", "calc(100% + 4px)", "important")',
            'panel.style.setProperty("transform", "none", "important")',
            '/js/grain-hauling-jobs.js?v=20260913-1920'
          ]
          missing = [x for x in required if x not in js and x not in html]
          if missing:
            raise SystemExit(f'Missing expected repair markers: {missing}')
          print('Verified hauling job hard local dropdown anchoring')
          PY

      - name: Commit fix
        run: |
          if git diff --quiet -- js/grain-hauling-jobs.js pages/grain/grain-contracts.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/grain-hauling-jobs.js pages/grain/grain-contracts.html
          git commit -m 'Hard-anchor hauling job dropdowns below fields'
          git pull --rebase origin main
          git push origin main
