name: FarmVista harvest ticket correction fix
on:
  push:
    paths: ['.github/workflows/fv-harvest-ticket-fix.yml']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Patch ticket detail and harvest drilldown
        shell: python
        run: |
          from pathlib import Path

          # Ticket Details: source edits must clear old field identity everywhere.
          p=Path('pages/grain/grain-ticket-detail.html')
          s=p.read_text()
          old='''          grainSourceType:\n            selectedSource?.type ||\n            null,\n\n          grainSourceValue:\n            selectedSource?.value ||\n            null,'''
          new='''          grainSourceType:\n            selectedSource?.type ||\n            null,\n\n          grainSourceScope:\n            selectedSource?.sourceScope ||\n            null,\n\n          grainSourceValue:\n            selectedSource?.value ||\n            null,'''
          assert s.count(old) >= 1
          s=s.replace(old,new,1)

          old='''          grainSourceFieldName:\n            selectedSource?.fieldName ||\n            null,\n\n          grainSourceCropYear:'''
          new='''          grainSourceFieldName:\n            selectedSource?.fieldName ||\n            null,\n\n          /*\n            fieldId / fieldName are legacy compatibility fields still read by\n            older FarmVista reports. They MUST be cleared when a ticket is\n            changed from a Field to generic Active Harvest.\n          */\n          fieldId:\n            selectedSource?.fieldId ||\n            null,\n\n          fieldName:\n            selectedSource?.fieldName ||\n            null,\n\n          sourceFieldId:\n            selectedSource?.fieldId ||\n            null,\n\n          sourceFieldName:\n            selectedSource?.fieldName ||\n            null,\n\n          grainSourceCropYear:'''
          assert s.count(old) >= 1
          s=s.replace(old,new,1)

          # Same canonical source fields on linked loadout.
          old='''            grainSourceType:\n              selectedSource?.type ||\n              null,\n\n            grainSourceValue:\n              selectedSource?.value ||\n              null,'''
          new='''            grainSourceType:\n              selectedSource?.type ||\n              null,\n\n            grainSourceScope:\n              selectedSource?.sourceScope ||\n              null,\n\n            grainSourceValue:\n              selectedSource?.value ||\n              null,'''
          assert old in s
          s=s.replace(old,new,1)

          old='''            grainSourceFieldName:\n              selectedSource?.fieldName ||\n              null,\n\n            grainSourceCropYear:'''
          new='''            grainSourceFieldName:\n              selectedSource?.fieldName ||\n              null,\n\n            fieldId:\n              selectedSource?.fieldId ||\n              null,\n\n            fieldName:\n              selectedSource?.fieldName ||\n              null,\n\n            sourceFieldId:\n              selectedSource?.fieldId ||\n              null,\n\n            sourceFieldName:\n              selectedSource?.fieldName ||\n              null,\n\n            grainSourceCropYear:'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # Grain Inventory: stale legacy field names must never override the
          # current source selection. Also add direct saved-image viewing.
          p=Path('pages/grain/index.html')
          s=p.read_text()
          old='''    const fieldBased =\n      sourceType === "field" ||\n      sourceScope === "field" ||\n      clean(ticket?.grainSourceFieldId) ||\n      clean(ticket?.grainSourceFieldName);'''
          new='''    const sourceValue = norm(ticket?.grainSourceValue);\n\n    /*\n      Current source identity is authoritative. Old fieldId/fieldName values\n      can remain on historical records after an edit, so they must NOT by\n      themselves make a generic Active Harvest ticket look field-scoped.\n    */\n    const fieldBased =\n      sourceType === "field" ||\n      sourceScope === "field" ||\n      sourceValue.startsWith("field:") ||\n      sourceValue.includes("active_field_harvest:field:");'''
          assert old in s
          s=s.replace(old,new,1)

          marker='''  function driverValue(ticket){\n    return clean(\n      ticket?.driverName ||\n      ticket?.driver ||\n      ticket?.submittedByName ||\n      ticket?.submittedBy ||\n      ""\n    ) || "—";\n  }'''
          addition=marker+'''\n\n  function ticketImageValue(ticket){\n    return clean(\n      ticket?.ticketImageUrl ||\n      ticket?.imageUrl ||\n      ticket?.photoUrl ||\n      ""\n    );\n  }\n\n  function openHarvestTicketImage(ticket){\n    const imageUrl = ticketImageValue(ticket);\n    if(!imageUrl){\n      window.alert("No saved ticket image is available for this ticket.");\n      return;\n    }\n    window.open(imageUrl,"_blank","noopener,noreferrer");\n  }'''
          assert marker in s
          s=s.replace(marker,addition,1)

          old='''              <th>Damage</th>\n            </tr>'''
          new='''              <th>Damage</th>\n              <th>View</th>\n            </tr>'''
          assert old in s
          s=s.replace(old,new,1)

          old='''                <td class="${gradeClass(ticket.damage)}">${fmtGrade(ticket.damage)}</td>\n              </tr>'''
          new='''                <td class="${gradeClass(ticket.damage)}">${fmtGrade(ticket.damage)}</td>\n                <td>\n                  <button type="button" class="btn harvest-ticket-image" data-ticket-image="${esc(ticket.id)}" ${ticketImageValue(ticket) ? "" : "disabled"}>\n                    View\n                  </button>\n                </td>\n              </tr>'''
          assert old in s
          s=s.replace(old,new,1)

          old='''    $("harvest-field-back").addEventListener("click",() => showHarvestCrop(crop));\n  }'''
          new='''    $("harvest-field-back").addEventListener("click",() => showHarvestCrop(crop));\n\n    $("harvest-modal-content").querySelectorAll("[data-ticket-image]").forEach(button => {\n      button.addEventListener("click", event => {\n        event.preventDefault();\n        event.stopPropagation();\n        const ticket = state.ticketsById.get(button.dataset.ticketImage);\n        if(ticket) openHarvestTicketImage(ticket);\n      });\n    });\n  }'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/grain/grain-ticket-detail.html pages/grain/index.html
          git commit -m 'Fix Active Harvest ticket edits and image viewing'
          git push
