name: FarmVista - Fix Grain Ticket Image Pipeline 2026-09-16

on:
  push:
    paths:
      - '.github/workflows/fv-fix-grain-ticket-image-pipeline-20260916.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch scanner response and image pipeline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pages/grain/grain-ticket-scan-core.html')
          s=p.read_text()

          replacements=[
          ('''          const file =\n            await prepareImage(\n              rawFile\n            );''','''          /* Preserve the original captured JPEG for OCR. Re-encoding a camera\n             frame a second time softens the small printed grade values. */\n          const file =\n            rawFile;'''),
          ('''const scannedTestWeight =\n  Number(\n    result.grainTicket\n      ?.testWeight\n  );''','''const rawScannedTestWeight =\n  result.grainTicket\n    ?.testWeight;\n\nconst scannedTestWeight =\n  (rawScannedTestWeight === null ||\n   rawScannedTestWeight === undefined ||\n   rawScannedTestWeight === "")\n    ? null\n    : Number(rawScannedTestWeight);'''),
          ('''const documentText =\n  String(\n    result.document?.text ||\n    ""\n  ).trim();''','''const documentText =\n  String(\n    result.documentText ||\n    result.document?.text ||\n    result.grainTicket?.rawText ||\n    ""\n  ).trim();''')]

          for old,new in replacements:
              if old in s:
                  s=s.replace(old,new,1)
              elif new not in s:
                  raise SystemExit('Required scanner block not found: '+old[:60])

          p.write_text(s)
          PY
      - name: Verify scanner repair
        run: |
          grep -q 'const file =' pages/grain/grain-ticket-scan-core.html
          grep -q 'rawScannedTestWeight' pages/grain/grain-ticket-scan-core.html
          grep -q 'result.documentText' pages/grain/grain-ticket-scan-core.html
          if grep -A4 'const documentText =' pages/grain/grain-ticket-scan-core.html | grep -q 'result.documentText'; then echo 'documentText OK'; else exit 1; fi
      - name: Commit scanner repair
        run: |
          git config user.name 'FarmVista Automation'
          git config user.email 'farmvista-automation@users.noreply.github.com'
          git add pages/grain/grain-ticket-scan-core.html
          git commit -m 'Fix phone grain ticket successful OCR handling' || exit 0
          git pull --rebase origin main
          git push origin main
