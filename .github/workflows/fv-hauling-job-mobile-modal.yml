name: Fix hauling job mobile modal

on:
  push:
    paths:
      - '.github/workflows/fv-hauling-job-mobile-modal.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch hauling job modal mobile behavior
        run: python .github/scripts/fix-hauling-job-mobile-modal.py

      - name: Confirm targeted modal CSS exists
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('pages/grain/grain-contracts.html').read_text(encoding='utf-8')
          required = [
            'FV_HAULING_JOB_MOBILE_VERTICAL_ONLY',
            '#hauling-job-modal{',
            'overflow-y:auto;',
            'overflow-x:hidden;',
            'touch-action:pan-y;',
            'max-width:calc(100vw - 20px);'
          ]
          missing = [item for item in required if item not in text]
          if missing:
            raise SystemExit(f'Missing expected mobile modal CSS: {missing}')
          print('Targeted hauling-job mobile CSS verified')
          PY

      - name: Commit mobile modal fix
        run: |
          if git diff --quiet -- pages/grain/grain-contracts.html; then
            echo 'No Grain Contracts change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/grain/grain-contracts.html
          git commit -m 'Fix hauling job modal mobile scrolling'
          git pull --rebase origin main
          git push origin main
