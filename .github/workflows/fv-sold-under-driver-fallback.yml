name: FarmVista Sold Under driver fallback

on:
  push:
    paths:
      - '.github/workflows/fv-sold-under-driver-fallback.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Sold Under driver fallback
        shell: python
        run: |
          from pathlib import Path
          p = Path('pages/grain/grain-ticket-scan.html')
          s = p.read_text()

          old = '''          items:
            eligibleCustomers.map(
              item => ({
                label: getCustomerName(item),
                searchText: getCustomerName(item),
                value: item
              })
            ),
          allowSkip: true,
          allowBack: true
        });'''

          new = '''          items: [
            ...eligibleCustomers.map(
              item => ({
                label: getCustomerName(item),
                searchText: getCustomerName(item),
                value: item
              })
            ),
            {
              label: "Unknown / I'm not sure",
              searchText: "unknown not sure don't know",
              value: "__unknown_sold_under__"
            }
          ],
          allowSkip: true,
          allowBack: true
        });'''

          assert old in s, 'Sold Under customer picker block not found'
          s = s.replace(old, new, 1)

          old = '''      else if (selectedCustomer) {
        customer = selectedCustomer;

        const originalEvidence =
          String(
            grainTicket.customerText ||
            ""
          ).trim();'''

          new = '''      else if (
        selectedCustomer === "__unknown_sold_under__"
      ) {
        /*
          Driver explicitly could not identify Sold Under.
          Allow the scan to continue, but keep the ticket unresolved
          so the office must review it later.
        */
        customer = null;
        skippedReasons.push("sold_under_unknown");

        ocrResult.manualCorrections = {
          ...(ocrResult.manualCorrections || {}),
          customer: {
            originalValue:
              String(grainTicket.customerText || "").trim() || null,
            selectedId: null,
            selectedValue: "Unknown",
            source: "driver_unknown",
            learningEligible: false,
            learningReason: "driver_could_not_identify_sold_under"
          }
        };
      }
      else if (selectedCustomer) {
        customer = selectedCustomer;

        const originalEvidence =
          String(
            grainTicket.customerText ||
            ""
          ).trim();'''

          assert old in s, 'Sold Under selected customer handler not found'
          s = s.replace(old, new, 1)

          old = '''      else {
        skippedReasons.push("customer_not_selected");
      }
    }
  }

  /* ========================================================
     HAULING JOB — NARROWED BY SOLD UNDER WHEN KNOWN
  ======================================================== */'''

          new = '''      else {
        /*
          Skip is allowed as a backup so the driver is never blocked.
          A skipped Sold Under must remain Needs Review.
        */
        skippedReasons.push("sold_under_driver_skipped");
      }
    }
  }

  /* ========================================================
     HAULING JOB — NARROWED BY SOLD UNDER WHEN KNOWN
  ======================================================== */'''

          assert old in s, 'Sold Under skip handler not found'
          s = s.replace(old, new, 1)

          p.write_text(s)
      - name: Validate inline JavaScript
        shell: python
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('pages/grain/grain-ticket-scan.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          checked = 0
          for script in scripts:
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.mjs', delete=False) as f:
                  f.write(script)
                  name = f.name
              proc = subprocess.run(['node', '--check', name], capture_output=True, text=True)
              if proc.returncode:
                  print(proc.stderr)
                  raise SystemExit(proc.returncode)
              checked += 1
          print(f'Validated {checked} inline script blocks')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/grain/grain-ticket-scan.html
          git commit -m 'Keep skipped Sold Under tickets in review'
          git push
