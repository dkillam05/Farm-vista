name: Add zero-bushel spot hauling jobs and contracts

on:
  push:
    paths:
      - '.github/workflows/fv-spot-load-zero-bushels.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch spot-load behavior
        run: python .github/scripts/fix-spot-load-zero-bushels.py

      - name: Syntax check changed JavaScript
        run: |
          node --check js/grain-hauling-jobs-core.js
          node --check js/grain-contract-add.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          text = Path('pages/grain/grain-ticket.html').read_text(encoding='utf-8')
          modules = re.findall(r'<script\s+type="module"[^>]*>(.*?)</script>', text, flags=re.S | re.I)
          if not modules:
              raise SystemExit('No inline module scripts found')

          for index, source in enumerate(modules, 1):
              with tempfile.NamedTemporaryFile('w', suffix='.mjs', encoding='utf-8', delete=False) as handle:
                  handle.write(source)
                  name = handle.name
              subprocess.run(['node', '--check', name], check=True)
              print(f'Checked inline module {index}')
          PY

      - name: Commit spot-load support
        run: |
          if git diff --quiet -- js/grain-hauling-jobs-core.js js/grain-contract-add.js pages/grain/grain-ticket.html; then
            echo 'No spot-load changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/grain-hauling-jobs-core.js js/grain-contract-add.js pages/grain/grain-ticket.html
          git commit -m 'Allow zero-bushel spot hauling jobs and contracts'
          git pull --rebase origin main
          git push origin main