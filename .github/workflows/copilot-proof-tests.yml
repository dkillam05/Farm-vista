name: Copilot source proof tests
on:
  pull_request:
    paths:
      - 'js/dashboard/copilot/**'
      - 'tests/copilot-*.test.mjs'
      - '.github/workflows/copilot-proof-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/copilot-context.test.mjs tests/copilot-presentation.test.mjs tests/copilot-viewport.test.mjs tests/copilot-dictation.test.mjs
