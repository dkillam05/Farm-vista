name: FarmVista Scoular Waverly template
on:
  push:
    paths:
      - '.github/workflows/fv-scoular-waverly-template.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Scoular Waverly template
        run: python3 .github/scripts/fv_scoular_waverly_template.py
      - name: Validate
        run: |
          cp js/grain-ticket-ocr-grade-normalizer.js /tmp/grain-ticket-ocr-grade-normalizer.mjs
          node --check /tmp/grain-ticket-ocr-grade-normalizer.mjs
          node --check js/version.js
          grep -q 'scoular_waverly_template_v3' js/grain-ticket-ocr-grade-normalizer.js
          grep -q 'grain-ticket-ocr-grade-normalizer.js?v=20260909-6' pages/grain/grain-ticket-scan-core.html
          grep -q 'grain-ticket-scan-core.html?v=20260909-5' pages/grain/grain-ticket-scan.html
          grep -q 'number:  "09.09.09"' js/version.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "FarmVista Bot"
          git config user.email "actions@farmvista.app"
          git add js/grain-ticket-ocr-grade-normalizer.js pages/grain/grain-ticket-scan-core.html pages/grain/grain-ticket-scan.html js/version.js
          git commit -m "Add authoritative Scoular Waverly OCR template and bump 09.09.09 [skip auto-version]"
          git pull --rebase origin main
          git push origin HEAD:main
