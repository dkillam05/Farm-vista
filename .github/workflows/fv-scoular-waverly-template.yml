name: FarmVista Scoular Waverly scan template

on:
  push:
    paths:
      - '.github/workflows/fv-scoular-waverly-template.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Enable and harden Scoular Waverly fixed grade layout
        run: |
          python - <<'PY'
          from pathlib import Path

          helper = Path('js/grain-ticket-adm-decatur-grade-fix.js')
          s = helper.read_text()

          # The helper already contains the Scoular Waverly template. Harden its
          # grade reader so it first trusts explicit labels, then uses the known
          # fixed four-row order as fallback. This prevents MO/DM/FM from sliding.
          start = s.index('  function scoularGradeValues(text) {')
          end = s.index('\n  function scoularPrintedBushels(text) {', start)
          new = r'''  function scoularGradeValues(text) {
    const source = String(text || '').replace(/\r/g,'\n');
    const start = source.search(/Grade\s*:\s*U\.?S\.?/i);
    if (start < 0) return null;
    let block = source.slice(start, start + 1300);
    const stop = block.search(/\bGross\s+Bushels\s*:/i);
    if (stop > 0) block = block.slice(0, stop);

    const readAfterLabel = labels => {
      for (const label of labels) {
        const re = new RegExp(label + '\\s*[:=-]?\\s*([0-9]{1,3}(?:\\.[0-9]{1,2})?)\\b','i');
        const m = block.match(re);
        const n = m ? Number(m[1]) : NaN;
        if (Number.isFinite(n)) return n;
      }
      return null;
    };

    // Prefer labels when OCR preserves label/value association.
    const labeled = {
      testWeight: readAfterLabel(['Test\\s*Weight','\\bTW\\b']),
      moisture: readAfterLabel(['Moisture','\\bMO\\b','\\bMT\\b']),
      damage: readAfterLabel(['Damaged\\s+Kernels(?:\\s*\\(total\\))?','Damage','\\bDM\\b']),
      foreignMaterial: readAfterLabel(['Broken\\s+Corn\\s*(?:&|and)\\s*Foreign\\s+Mat(?:erial)?','\\bBCFM\\b','Foreign\\s+Mat(?:erial)?'])
    };

    // Scoular Waverly's printed grade rows are physically fixed:
    // TW -> MO -> DM -> BCFM. Document AI can separate the left labels from
    // the right numeric column, so collect the decimal grade column as fallback.
    const values = [];
    const re = /(?:^|\s)(\d{1,2}\.\d{1,2})(?=\s|$)/g;
    let match;
    while ((match = re.exec(block)) && values.length < 8) {
      const n = Number(match[1]);
      if (Number.isFinite(n)) values.push(n);
    }

    let ordered = {};
    if (values.length >= 4) {
      const [tw,mo,dm,fm] = values;
      if (tw >= 35 && tw <= 70 && mo >= 0 && mo <= 40 && dm >= 0 && dm <= 50 && fm >= 0 && fm <= 50) {
        ordered = {testWeight:tw,moisture:mo,damage:dm,foreignMaterial:fm};
      }
    }

    const result = {
      testWeight: Number.isFinite(labeled.testWeight) ? labeled.testWeight : ordered.testWeight,
      moisture: Number.isFinite(labeled.moisture) ? labeled.moisture : ordered.moisture,
      damage: Number.isFinite(labeled.damage) ? labeled.damage : ordered.damage,
      foreignMaterial: Number.isFinite(labeled.foreignMaterial) ? labeled.foreignMaterial : ordered.foreignMaterial
    };

    if (!(result.testWeight >= 35 && result.testWeight <= 70)) result.testWeight = ordered.testWeight ?? null;
    if (!(result.moisture >= 0 && result.moisture <= 40)) result.moisture = ordered.moisture ?? null;
    if (!(result.damage >= 0 && result.damage <= 50)) result.damage = ordered.damage ?? null;
    if (!(result.foreignMaterial >= 0 && result.foreignMaterial <= 50)) result.foreignMaterial = ordered.foreignMaterial ?? null;
    return result;
  }
'''
          s = s[:start] + new + s[end:]
          s = s.replace('__FV_ADM_DECATUR_GRADE_FIX_20260911', '__FV_ELEVATOR_GRADE_TEMPLATE_20260915', 2)
          helper.write_text(s)

          # IMPORTANT: the scanner is now a wrapper that dynamically loads the
          # core page. The elevator template helper was no longer included, so
          # its fetch interception never ran. Load it before scanner boot.
          scan = Path('pages/grain/grain-ticket-scan.html')
          t = scan.read_text()
          tag = '  <script src="/js/grain-ticket-adm-decatur-grade-fix.js?v=20260915-scoular-1"></script>\n'
          if 'grain-ticket-adm-decatur-grade-fix.js' not in t:
            marker = '  <script>\n  (() => {'
            if marker not in t:
              raise SystemExit('Scanner boot marker not found; refusing unsafe edit')
            t = t.replace(marker, tag + marker, 1)
          else:
            import re
            t = re.sub(r'  <script src="/js/grain-ticket-adm-decatur-grade-fix\.js\?v=[^"]+"></script>\n', tag, t, count=1)
          scan.write_text(t)
          PY

      - name: Validate JavaScript
        run: node --check js/grain-ticket-adm-decatur-grade-fix.js

      - name: Commit Scoular scanner fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/grain-ticket-adm-decatur-grade-fix.js pages/grain/grain-ticket-scan.html
          if git diff --cached --quiet; then
            echo 'No Scoular changes required.'
            exit 0
          fi
          git commit -m 'Fix Scoular Waverly fixed grade layout parsing'
          git push
