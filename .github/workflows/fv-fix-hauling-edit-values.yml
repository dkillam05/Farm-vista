name: FarmVista hauling edit values fix
on:
  push:
    paths:
      - '.github/workflows/fv-fix-hauling-edit-values.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch hauling job edit values
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/grain-hauling-jobs.js')
          text = path.read_text()

          old = '''function jobBuyerId(\n  job\n) {\n\n  return clean(\n    job?.buyerId\n  );\n\n}\n'''
          new = '''function jobBuyerId(\n  job\n) {\n\n  const savedId =\n    clean(\n      job?.buyerId\n    );\n\n\n  if (\n    savedId &&\n    state.buyers.some(\n      buyer => buyer.id === savedId\n    )\n  ) {\n\n    return savedId;\n\n  }\n\n\n  const savedName =\n    norm(\n      job?.buyerName ||\n      job?.buyer\n    );\n\n\n  if (\n    savedName\n  ) {\n\n    const match =\n      state.buyers.find(\n        buyer =>\n          norm(\n            buyer?.name\n          ) ===\n          savedName\n      );\n\n\n    if (\n      match\n    ) {\n\n      return match.id;\n\n    }\n\n  }\n\n\n  return savedId;\n\n}\n'''
          if old not in text:
              raise SystemExit('jobBuyerId marker not found')
          text = text.replace(old, new, 1)

          old = '''function jobLocationId(\n  job\n) {\n\n  return clean(\n    job?.deliveryLocationId ||\n    job?.locationId ||\n    job?.destinationId\n  );\n\n}\n'''
          new = '''function jobLocationId(\n  job\n) {\n\n  const savedId =\n    clean(\n      job?.deliveryLocationId ||\n      job?.locationId ||\n      job?.destinationId\n    );\n\n\n  if (\n    savedId &&\n    state.locations.some(\n      location => location.id === savedId\n    )\n  ) {\n\n    return savedId;\n\n  }\n\n\n  const savedName =\n    norm(\n      job?.deliveryLocationName ||\n      job?.locationName ||\n      job?.destinationName ||\n      job?.destination\n    );\n\n\n  if (\n    savedName\n  ) {\n\n    const buyerId =\n      jobBuyerId(\n        job\n      );\n\n\n    const sameBuyer =\n      state.locations.find(\n        location =>\n          norm(\n            location?.locationName\n          ) ===\n            savedName &&\n          (\n            !buyerId ||\n            clean(\n              location?.buyerId\n            ) ===\n              buyerId\n          )\n      );\n\n\n    const match =\n      sameBuyer ||\n      state.locations.find(\n        location =>\n          norm(\n            location?.locationName\n          ) ===\n          savedName\n      );\n\n\n    if (\n      match\n    ) {\n\n      return match.id;\n\n    }\n\n  }\n\n\n  return savedId;\n\n}\n'''
          if old not in text:
              raise SystemExit('jobLocationId marker not found')
          text = text.replace(old, new, 1)

          old = '''function jobCrop(\n  job\n) {\n\n  return clean(\n    job?.crop ||\n    job?.commodity\n  );\n\n}\n'''
          new = '''function jobCrop(\n  job\n) {\n\n  const raw =\n    clean(\n      job?.crop ||\n      job?.commodity\n    );\n\n\n  const key =\n    norm(\n      raw\n    )\n      .replace(\n        /[^a-z]/g,\n        ""\n      );\n\n\n  if (\n    key === "corn" ||\n    key === "yellowcorn"\n  ) {\n\n    return "Corn";\n\n  }\n\n\n  if (\n    [\n      "soy",\n      "soybean",\n      "soybeans",\n      "bean",\n      "beans"\n    ].includes(\n      key\n    )\n  ) {\n\n    return "Soybeans";\n\n  }\n\n\n  return raw;\n\n}\n'''
          if old not in text:
              raise SystemExit('jobCrop marker not found')
          text = text.replace(old, new, 1)

          old = '''  if (\n    !job\n  ) {\n\n    return;\n\n  }\n\n\n  setJobMessage(\n    ""\n  );\n'''
          new = '''  if (\n    !job\n  ) {\n\n    return;\n\n  }\n\n\n  /* Always clear values left by the previously opened hauling job first. */\n  $(\n    "hauling-job-form"\n  )\n    ?.reset();\n\n\n  setJobMessage(\n    ""\n  );\n'''
          if old not in text:
              raise SystemExit('openEditJob reset marker not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/fv-fix-hauling-edit-values.yml
          git config user.name "FarmVista Automation"
          git config user.email "farmvista-automation@users.noreply.github.com"
          git add js/grain-hauling-jobs.js .github/workflows/fv-fix-hauling-edit-values.yml
          git commit -m "Fix hauling job edit dropdown values [skip auto-version]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
