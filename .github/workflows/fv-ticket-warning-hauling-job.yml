name: Fix grain ticket warning classification

on:
  push:
    paths:
      - '.github/workflows/fv-ticket-warning-hauling-job.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Classify unmatched hauling-job tickets as warnings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ticket_path = Path('pages/grain/grain-ticket.html')
          text = ticket_path.read_text(encoding='utf-8')

          old = '''    return reasons.some(reason => warningReasons.has(reason));'''
          new = '''    return reasons.some(reason => {

      if (warningReasons.has(reason)) return true;

      /*
        A clean/readable ticket that cannot be matched to an ACTIVE hauling
        job is an operational mismatch, not an OCR/data-entry review item.
        Keep these red so dispatch immediately sees that the destination /
        crop / Sold Under combination has no current hauling job available.
      */
      const haulingJobMismatch =
        (reason.includes("hauling") || reason.includes("job")) &&
        (
          reason.includes("not_matched") ||
          reason.includes("not_found") ||
          reason.includes("no_match") ||
          reason.includes("missing") ||
          reason.includes("inactive") ||
          reason.includes("no_active") ||
          reason.includes("requires_review")
        );

      return haulingJobMismatch;

    });'''

          if old not in text:
              raise SystemExit('Expected isTicketWarning return statement was not found; refusing unsafe patch.')

          text = text.replace(old, new, 1)
          ticket_path.write_text(text, encoding='utf-8')

          version_path = Path('js/version.js')
          version = version_path.read_text(encoding='utf-8')
          old_version = 'number:  "09.11.103"'
          new_version = 'number:  "09.11.104"'
          if old_version not in version:
              raise SystemExit('Expected FarmVista version 09.11.103 was not found; refusing unsafe version bump.')
          version = version.replace(old_version, new_version, 1)
          version_path.write_text(version, encoding='utf-8')
          PY

      - name: Verify patch
        shell: bash
        run: |
          grep -q 'const haulingJobMismatch' pages/grain/grain-ticket.html
          grep -q 'number:  "09.11.104"' js/version.js

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/grain/grain-ticket.html js/version.js
          git commit -m 'Show unmatched hauling-job tickets as warnings'
          git push
