name: Fix grain ticket warning classification

on:
  push:
    paths:
      - '.github/workflows/fv-ticket-warning-hauling-job.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Patch grain ticket warning classification
        run: python .github/scripts/fix-ticket-warning-hauling-job.py

      - name: Verify patch
        run: grep -q 'const haulingJobMismatch' pages/grain/grain-ticket.html

      - name: Commit fix
        run: |
          if git diff --quiet -- pages/grain/grain-ticket.html; then
            echo 'Patch already present; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/grain/grain-ticket.html
          git commit -m 'Show unmatched hauling-job tickets as warnings'
          git pull --rebase origin main
          git push origin main
