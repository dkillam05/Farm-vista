name: FarmVista scan dropdown performance fix
on:
  push:
    paths:
      - '.github/workflows/fv-scan-dropdown-performance-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch grain scan dropdown and observer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          def dec(value): return base64.b64decode(value).decode('utf-8')
          def replace_once(path, old64, new64):
              p=Path(path); text=p.read_text(encoding='utf-8'); old=dec(old64); new=dec(new64); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')
          replace_once('pages/grain/grain-ticket-scan.html','','')
          replace_once('js/grain-ticket-scan-source-flow.js','ICAgIGlmIChhY3RpdmVCdXR0b24pIGFjdGl2ZUJ1dHRvbi50ZXh0Q29udGVudCA9ICdBY3RpdmUgSGFydmVzdCc7CiAgICBpZiAodGV4dEVsKSB0ZXh0RWwudGV4dENvbnRlbnQgPSAnQ2hvb3NlIHdoZXJlIHRoaXMgZ3JhaW4gY2FtZSBmcm9tLic7','')
          replace_once('js/grain-ticket-scan-source-flow.js','ICAgIGlmICh0ZXh0RWwpIHsKICAgICAgdGV4dEVsLnRleHRDb250ZW50ID0gaXNGaWVsZAogICAgICAgID8gJ0Nob29zZSB0aGUgZmllbGQgdGhpcyBncmFpbiBjYW1lIGZyb20uJwogICAgICAgIDogJ0Nob29zZSB0aGUgYmluIHNpdGUgb3IgZ3JhaW4gYmFnIHNpdGUuJzsKICAgIH0=','')
          replace_once('js/grain-ticket-scan-source-flow.js','','')
          p=Path('js/firebase-config.js'); text=p.read_text(encoding='utf-8'); old="helperScript.src = '/js/grain-ticket-scan-source-flow.js?v=20260904-4';"; new="helperScript.src = '/js/grain-ticket-scan-source-flow.js?v=20260904-5';"
          if text.count(old) != 1: raise SystemExit('firebase-config cache-bust match failed')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit FarmVista fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/grain/grain-ticket-scan.html js/grain-ticket-scan-source-flow.js js/firebase-config.js
          git commit -m "Restore grain source dropdown and fix scan lag"
          git push
