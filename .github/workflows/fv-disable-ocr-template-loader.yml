name: FarmVista disable scanner OCR templates

on:
  push:
    paths:
      - '.github/workflows/fv-disable-ocr-template-loader.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Disable legacy OCR template loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/version.js')
          s = p.read_text()
          start = s.index('  /* ===================================================================\n     SEPT 4, 2026 — ADM DECATUR GRADE FACTOR SAFETY')
          end = s.index('  /* ===================================================================\n     SEPT 4, 2026 — IN-APP GRAIN TICKET SOURCE FLOW', start)
          replacement = '''  /* ===================================================================
     SEPT 16, 2026 — CLEAN OCR BASELINE TEST

     Elevator OCR response interceptors/templates are intentionally disabled
     on the scan page. The scanner receives the generic fvOcr response without
     the legacy ADM/Scoular/Bartlett helper modifying it.
  =================================================================== */

'''
          s = s[:start] + replacement + s[end:]
          s = s.replace('number:  "09.16.26"', 'number:  "09.16.27"')
          p.write_text(s)
          PY
      - name: Commit scanner baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/version.js
          git commit -m 'Disable legacy OCR templates for clean scanner baseline [skip auto-version]'
          git push
