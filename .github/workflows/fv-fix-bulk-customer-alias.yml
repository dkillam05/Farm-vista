name: FarmVista bulk customer alias matcher fix

on:
  push:
    paths:
      - '.github/workflows/fv-fix-bulk-customer-alias.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply bulk customer alias matcher fix
        run: python .github/scripts/fv_fix_bulk_customer_alias.py

      - name: Validate ticket detail JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('pages/grain/grain-ticket-detail.html')
          scripts = re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', html.read_text(), re.I)
          for i, script in enumerate(scripts):
              if not script.strip():
                  continue
              path = Path(tempfile.gettempdir()) / f'fv-detail-alias-{i}.mjs'
              path.write_text(script)
              subprocess.run(['node', '--check', str(path)], check=True)
          PY

      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/fv-fix-bulk-customer-alias.yml
          rm -f .github/scripts/fv_fix_bulk_customer_alias.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/grain/grain-ticket-detail.html .github/workflows/fv-fix-bulk-customer-alias.yml .github/scripts/fv_fix_bulk_customer_alias.py
          git commit -m 'Fix bulk customer alias correction [skip auto-version]'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
