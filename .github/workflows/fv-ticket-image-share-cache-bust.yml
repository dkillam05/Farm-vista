name: FarmVista ticket image share cache bust
on:
  push:
    paths:
      - '.github/workflows/fv-ticket-image-share-cache-bust.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bump grain ticket image helper version
        shell: python
        run: |
          from pathlib import Path
          files = [
            Path('pages/grain/grain-ticket-detail.html'),
            Path('pages/grain/index.html'),
            Path('pages/reports/report-grain-contracts.html'),
          ]
          old = '/js/grain-ticket-image-download.js?v=20260909-1'
          new = '/js/grain-ticket-image-download.js?v=20260909-2'
          for path in files:
            text = path.read_text()
            if old in text:
              text = text.replace(old, new)
              path.write_text(text)

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/grain/grain-ticket-detail.html pages/grain/index.html pages/reports/report-grain-contracts.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh grain ticket image share helper [skip auto-version]'
          git pull --rebase origin main
          git push
