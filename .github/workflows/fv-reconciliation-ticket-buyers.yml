name: FarmVista reconciliation ticket buyers
on:
  push:
    paths:
      - '.github/workflows/fv-reconciliation-ticket-buyers.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch reconciliation filters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/grain-contracts.js')
          s = p.read_text()

          start = s.index('function getBuyersWithActiveContracts() {')
          end = s.index('\n\nfunction getCustomersForBuyer(', start)
          new = r'''function reconciliationBuyerKey(
  id,
  name
) {
  const cleanId = clean(id);
  if (cleanId) {
    return cleanId;
  }

  const cleanName = normalized(name);
  return cleanName
    ? `__ticket_buyer_name__:${cleanName}`
    : "";
}


function getBuyersForReconciliation() {
  const candidates =
    new Map();

  const addBuyer = (
    id,
    name
  ) => {
    const key =
      reconciliationBuyerKey(
        id,
        name
      );

    const label =
      clean(name);

    if (!key || !label) {
      return;
    }

    if (!candidates.has(key)) {
      candidates.set(
        key,
        {
          id:key,
          sourceId:clean(id) || null,
          name:label
        }
      );
    }
  };

  state.contracts
    .filter(
      contract =>
        !contract.voided &&
        numberValue(
          contract.openBushels
        ) >
        EPSILON
    )
    .forEach(
      contract =>
        addBuyer(
          contract.buyerId,
          contract.buyerName
        )
    );

  state.tickets
    .filter(
      ticket =>
        !ticket.voided &&
        getUnassignedBushels(
          ticket
        ) >
        EPSILON
    )
    .forEach(
      ticket =>
        addBuyer(
          ticket.buyerId,
          ticket.buyerName ||
          ticket.deliveryLocationBuyerName ||
          ticket.ocrElevatorName
        )
    );

  /* Prefer canonical buyer names/IDs when the buyer master contains a match. */
  state.buyers.forEach(
    buyer => {
      const canonicalId =
        clean(buyer.id);
      const canonicalName =
        normalized(buyer.name);

      for (const [key, candidate] of candidates) {
        if (
          (canonicalId && candidate.sourceId === canonicalId) ||
          (canonicalName && normalized(candidate.name) === canonicalName)
        ) {
          candidates.delete(key);
          candidates.set(
            canonicalId || key,
            {
              id:canonicalId || key,
              sourceId:canonicalId || null,
              name:clean(buyer.name) || candidate.name
            }
          );
          break;
        }
      }
    }
  );

  return [
    ...candidates.values()
  ].sort(
    (a, b) =>
      clean(a.name)
        .localeCompare(
          clean(b.name),
          undefined,
          {
            numeric:true,
            sensitivity:"base"
          }
        )
  );
}
'''
          s = s[:start] + new + s[end:]

          s = s.replace(
            '  const buyers =\n    getBuyersWithActiveContracts();',
            '  const buyers =\n    getBuyersForReconciliation();',
            1
          )

          old_lookup = '''  const buyer =\n    allBuyers\n      ? null\n      : state.buyers.find(\n          item =>\n            clean(item.id) ===\n            clean(buyerId)\n        );'''
          new_lookup = '''  const buyer =\n    allBuyers\n      ? null\n      : getBuyersForReconciliation().find(\n          item =>\n            clean(item.id) ===\n            clean(buyerId)\n        );'''
          if old_lookup not in s:
            raise SystemExit('customer buyer lookup target missing')
          s = s.replace(old_lookup, new_lookup, 1)

          # Replace the buyer lookup in ticketMatchesCurrent and getAvailableContracts.
          old_state_lookup = '''      : state.buyers.find(\n          item =>\n            clean(item.id) ===\n            clean(\n              state.reconcileBuyerId\n            )\n        );'''
          new_state_lookup = '''      : getBuyersForReconciliation().find(\n          item =>\n            clean(item.id) ===\n            clean(\n              state.reconcileBuyerId\n            )\n        );'''
          if s.count(old_state_lookup) < 2:
            raise SystemExit('reconciliation buyer lookup targets missing')
          s = s.replace(old_state_lookup, new_state_lookup, 2)

          # Match either a canonical ID or a synthetic ticket-buyer name key.
          old_ticket_id = '''        clean(\n          ticket.buyerId\n        ) ===\n        clean(\n          buyer.id\n        )'''
          new_ticket_id = '''        clean(\n          ticket.buyerId\n        ) ===\n        clean(\n          buyer.sourceId || buyer.id\n        )'''
          if old_ticket_id not in s:
            raise SystemExit('ticket buyer id match target missing')
          s = s.replace(old_ticket_id, new_ticket_id, 1)

          old_contract_id = '''              clean(\n                contract.buyerId\n              ) ===\n              clean(\n                buyer.id\n              )'''
          new_contract_id = '''              clean(\n                contract.buyerId\n              ) ===\n              clean(\n                buyer.sourceId || buyer.id\n              )'''
          if old_contract_id not in s:
            raise SystemExit('contract buyer id match target missing')
          s = s.replace(old_contract_id, new_contract_id, 1)

          # Customer choices should come from open contracts AND visible unallocated tickets.
          marker = '''  const customerIds =\n    new Set(\n      contracts\n        .map(\n          contract =>\n            clean(\n              contract.customerId\n            )\n        )\n        .filter(Boolean)\n    );'''
          replacement = '''  const ticketCustomers =\n    state.tickets.filter(\n      ticket => {\n        if (\n          ticket.voided ||\n          getUnassignedBushels(ticket) <= EPSILON\n        ) {\n          return false;\n        }\n\n        if (allBuyers) {\n          return true;\n        }\n\n        return (\n          (\n            clean(ticket.buyerId) &&\n            clean(ticket.buyerId) ===\n              clean(buyer.sourceId || buyer.id)\n          ) ||\n          (\n            normalized(ticket.buyerName) &&\n            normalized(ticket.buyerName) ===\n              normalized(buyer.name)\n          )\n        );\n      }\n    );\n\n  const customerIds =\n    new Set(\n      [\n        ...contracts.map(contract => clean(contract.customerId)),\n        ...ticketCustomers.map(ticket => clean(ticket.customerId))\n      ].filter(Boolean)\n    );'''
          if marker not in s:
            raise SystemExit('customer id set target missing')
          s = s.replace(marker, replacement, 1)

          old_names = '''  const customerNames =\n    new Set(\n      contracts\n        .map(\n          contract =>\n            normalized(\n              contract.customerName\n            )\n        )\n        .filter(Boolean)\n    );'''
          new_names = '''  const customerNames =\n    new Set(\n      [\n        ...contracts.map(contract => normalized(contract.customerName)),\n        ...ticketCustomers.map(ticket => normalized(ticket.customerName))\n      ].filter(Boolean)\n    );'''
          if old_names not in s:
            raise SystemExit('customer name set target missing')
          s = s.replace(old_names, new_names, 1)

          p.write_text(s)

          html = Path('pages/grain/grain-contracts.html')
          h = html.read_text()
          old_src = '<script type="module" src="/js/grain-contracts.js"></script>'
          new_src = '<script type="module" src="/js/grain-contracts.js?v=20260909-1"></script>'
          if old_src in h:
            h = h.replace(old_src, new_src, 1)
          elif new_src not in h:
            raise SystemExit('grain contracts script source target missing')
          html.write_text(h)

          version = Path('js/version.js')
          v = version.read_text()
          if 'number:  "09.09.06"' not in v:
            raise SystemExit('expected version 09.09.06 not found')
          v = v.replace('number:  "09.09.06"', 'number:  "09.09.07"', 1)
          version.write_text(v)
          PY
      - name: Validate
        run: |
          cp js/grain-contracts.js /tmp/grain-contracts.mjs
          node --check /tmp/grain-contracts.mjs
          node --check js/version.js
          grep -q 'getBuyersForReconciliation' js/grain-contracts.js
          grep -q '09.09.07' js/version.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "FarmVista Bot"
          git config user.email "actions@farmvista.app"
          git add js/grain-contracts.js pages/grain/grain-contracts.html js/version.js
          git commit -m "Show ticket buyers in contract reconciliation [skip auto-version]"
          git pull --rebase origin main
          git push origin HEAD:main
