name: Fix unmatched hauling job warning

on:
  push:
    paths:
      - '.github/workflows/fv-ticket-warning-not-assigned.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Patch warning classification
        run: python .github/scripts/fix-ticket-warning-not-assigned.py

      - name: Verify patch
        run: |
          grep -q 'const noOpenMatchingHaulingJob' pages/grain/grain-ticket.html
          if grep -A20 'const warningReasons = new Set' pages/grain/grain-ticket.html | grep -q '"hauling_job_not_assigned"'; then
            echo 'Generic hauling_job_not_assigned is still in warningReasons'
            exit 1
          fi

      - name: Commit fix
        run: |
          if git diff --quiet -- pages/grain/grain-ticket.html; then
            echo 'Patch already present; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/grain/grain-ticket.html
          git commit -m 'Warn only when no matching hauling job exists'
          git pull --rebase origin main
          git push origin main
