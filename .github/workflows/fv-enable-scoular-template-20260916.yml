name: FarmVista activate Scoular Waverly template

on:
  push:
    paths:
      - '.github/workflows/fv-enable-scoular-template-20260916.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Activate fresh Scoular template bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/version.js')
          s = p.read_text()
          s = s.replace("/js/grain-ticket-adm-decatur-grade-fix.js?v=20260904-1", "/js/grain-ticket-adm-decatur-grade-fix.js?v=20260916-10")
          s = s.replace('number:  "09.16.27"', 'number:  "09.16.28"')
          p.write_text(s)

          p = Path('pages/grain/grain-ticket-scan-core.html')
          s = p.read_text()
          s = s.replace("result.document?.text ||\n            \"\"", "result.documentText ||\n            result.document?.text ||\n            \"\"")
          s = s.replace("result.document?.text ||\n    \"\"", "result.documentText ||\n    result.document?.text ||\n    \"\"")
          p.write_text(s)
          PY
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/version.js pages/grain/grain-ticket-scan-core.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Activate isolated Scoular Waverly OCR template [skip auto-version]'
          git push
