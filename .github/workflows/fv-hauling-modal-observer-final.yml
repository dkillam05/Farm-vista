name: FarmVista hauling modal observer final
on:
  push:
    paths:
      - '.github/workflows/fv-hauling-modal-observer-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch helper
        run: python3 -c "import base64; exec(base64.b64decode(''))"
      - name: Commit fix
        run: |
          rm -f .github/workflows/fv-hauling-modal-observer-final.yml
          git config user.name "FarmVista Automation"
          git config user.email "farmvista-automation@users.noreply.github.com"
          git add js/grain-hauling-jobs-sold-under-display.js .github/workflows/fv-hauling-modal-observer-final.yml
          git commit -m "Fix hauling job modal observer freeze [skip auto-version]"
          sleep 15
          git pull --rebase origin main
          git push origin HEAD:main
